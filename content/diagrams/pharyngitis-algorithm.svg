<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-label { font-size: 12px; font-weight: 700; fill: white; }
      .box-text { font-size: 11px; fill: white; }
      .diamond-text { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .yes-no { font-size: 11px; font-weight: 700; fill: #64748b; }
      .step-text { font-size: 11px; fill: #1e293b; line-height: 1.5; }
      .note { font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="920" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="776" height="896" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" class="title">Pharyngitis / Sinusitis / URI — Clinical Algorithm</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">FNP D118 | Adult Primary Care</text>
  <line x1="40" y1="72" x2="760" y2="72" stroke="#e2e8f0" stroke-width="1"/>

  <!-- START: Presentation box -->
  <rect x="230" y="82" width="340" height="55" rx="10" fill="#1e40af"/>
  <text x="400" y="103" text-anchor="middle" class="box-label">PATIENT PRESENTATION</text>
  <text x="400" y="118" text-anchor="middle" class="box-text">Sore throat ± fever ± cough ± nasal congestion</text>
  <text x="400" y="132" text-anchor="middle" class="box-text">Duration of symptoms, severity, exposure history</text>

  <!-- Arrow down -->
  <line x1="400" y1="137" x2="400" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond: CENTOR SCORE -->
  <polygon points="400,167 530,212 400,257 270,212" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" class="diamond-text">CENTOR / McISAAC SCORE</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#92400e">Score severity for Group A Strep</text>
  <text x="400" y="230" text-anchor="middle" font-size="10" fill="#92400e">Each criterion = 1 point</text>

  <!-- Centor Criteria box (left side) -->
  <rect x="22" y="174" width="200" height="95" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="122" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Centor Criteria (1 pt each)</text>
  <text x="32" y="208" font-size="10" fill="#78350f">□ Exudate/tonsillar swelling (1 pt)</text>
  <text x="32" y="222" font-size="10" fill="#78350f">□ Tender ant. cervical LAD (1 pt)</text>
  <text x="32" y="236" font-size="10" fill="#78350f">□ Fever &gt;38°C (100.4°F) (1 pt)</text>
  <text x="32" y="250" font-size="10" fill="#78350f">□ Absence of cough (1 pt)</text>
  <text x="32" y="264" font-size="10" fill="#78350f">Age: 3-14yr +1, 15-44yr 0, ≥45yr -1</text>
  <line x1="222" y1="212" x2="270" y2="212" stroke="#ca8a04" stroke-width="1"/>

  <!-- Arrow down from Centor -->
  <line x1="400" y1="257" x2="400" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Centor 0-1 path (left) -->
  <line x1="400" y1="288" x2="255" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="328" y="280" text-anchor="middle" class="yes-no">SCORE 0–1</text>
  <rect x="65" y="275" width="190" height="50" rx="8" fill="#065f46"/>
  <text x="160" y="294" text-anchor="middle" class="box-label">NO TEST / NO ABX</text>
  <text x="160" y="310" text-anchor="middle" class="box-text">Viral etiology &gt;90%</text>
  <text x="160" y="322" text-anchor="middle" class="box-text">Symptomatic treatment only</text>

  <!-- Centor 2-3 path (center) -->
  <line x1="400" y1="288" x2="400" y2="318" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="308" class="yes-no">SCORE 2–3</text>
  <rect x="245" y="318" width="310" height="45" rx="10" fill="#0c4a6e"/>
  <text x="400" y="337" text-anchor="middle" class="box-label">ORDER RAPID STREP TEST (RADT)</text>
  <text x="400" y="353" text-anchor="middle" class="box-text">If positive → treat; If negative → consider throat culture</text>

  <!-- Centor 4+ path (right) -->
  <line x1="400" y1="288" x2="560" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="280" text-anchor="middle" class="yes-no">SCORE ≥4</text>
  <rect x="550" y="272" width="220" height="55" rx="8" fill="#dc2626"/>
  <text x="660" y="290" text-anchor="middle" class="box-label">EMPIRIC TREATMENT</text>
  <text x="660" y="306" text-anchor="middle" class="box-text">High pre-test probability</text>
  <text x="660" y="319" text-anchor="middle" class="box-text">Treat without waiting for culture</text>

  <!-- Arrow down from RADT -->
  <line x1="400" y1="363" x2="400" y2="393" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond: RADT result -->
  <polygon points="400,395 510,435 400,475 290,435" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="430" text-anchor="middle" class="diamond-text">RADT RESULT</text>
  <text x="400" y="446" text-anchor="middle" font-size="10" fill="#0369a1">Spec: ~95%, Sens: ~80%</text>

  <!-- RADT Positive -->
  <line x1="290" y1="435" x2="180" y2="435" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="427" text-anchor="middle" class="yes-no">POSITIVE</text>
  <rect x="40" y="418" width="140" height="55" rx="8" fill="#065f46"/>
  <text x="110" y="436" text-anchor="middle" class="box-label">GAS CONFIRMED</text>
  <text x="48" y="453" font-size="10" fill="#a7f3d0">Treat per antibiotic schedule</text>

  <!-- RADT Negative -->
  <line x1="510" y1="435" x2="610" y2="435" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="427" text-anchor="middle" class="yes-no">NEGATIVE</text>
  <rect x="610" y="410" width="175" height="70" rx="8" fill="#7c3aed"/>
  <text x="697" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="white">High Suspicion?</text>
  <text x="618" y="444" font-size="10" fill="#e9d5ff">• Send throat culture</text>
  <text x="618" y="458" font-size="10" fill="#e9d5ff">• Back-up throat culture</text>
  <text x="618" y="472" font-size="10" fill="#e9d5ff">  if RADT negative</text>

  <!-- Arrow down to treatment -->
  <line x1="180" y1="473" x2="180" y2="500" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="475" x2="400" y2="500" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="500" x2="180" y2="500" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TREATMENT box -->
  <rect x="40" y="500" width="330" height="115" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="205" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">💊 GAS PHARYNGITIS Rx</text>
  <line x1="60" y1="526" x2="350" y2="526" stroke="#86efac" stroke-width="1"/>
  <text x="110" y="543" font-size="11" font-weight="700" fill="#166534">First Line</text>
  <text x="205" y="543" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Penicillin Allergy</text>
  <text x="70" y="559" font-size="10" fill="#15803d">Amoxicillin</text>
  <text x="70" y="573" font-size="10" fill="#15803d">500 mg PO BID × 10 days</text>
  <text x="70" y="587" font-size="10" fill="#15803d">OR Penicillin V 250mg QID</text>
  <text x="70" y="601" font-size="10" fill="#15803d">OR Benzathine PCN 1.2M IM x1</text>
  <text x="180" y="559" font-size="10" fill="#15803d">Cephalexin 500mg BID</text>
  <text x="180" y="573" font-size="10" fill="#15803d">OR Clindamycin 300mg TID</text>
  <text x="180" y="587" font-size="10" fill="#15803d">OR Azithromycin 500mg x1,</text>
  <text x="180" y="601" font-size="10" fill="#15803d">  250mg × 4 days (resistance ↑)</text>

  <!-- SINUSITIS branch (right side) -->
  <rect x="440" y="500" width="310" height="60" rx="10" fill="#1e40af"/>
  <text x="595" y="520" text-anchor="middle" class="box-label">ACUTE SINUSITIS BRANCH</text>
  <text x="595" y="537" text-anchor="middle" class="box-text">Sx: purulent rhinorrhea + facial pain/pressure</text>
  <text x="595" y="551" text-anchor="middle" class="box-text">+ nasal obstruction + hyposmia</text>

  <!-- Arrow down to sinusitis diamond -->
  <line x1="595" y1="560" x2="595" y2="585" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sinusitis diamond -->
  <polygon points="595,587 700,627 595,667 490,627" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="595" y="622" text-anchor="middle" class="diamond-text">BACTERIAL SINUSITIS?</text>
  <text x="595" y="638" text-anchor="middle" font-size="10" fill="#92400e">Criteria (any 1):</text>
  <text x="595" y="652" text-anchor="middle" font-size="10" fill="#92400e">Duration &gt;10d OR</text>
  <text x="595" y="662" text-anchor="middle" font-size="10" fill="#92400e">Worsening after 5–7d</text>

  <!-- YES Bacterial sinusitis -->
  <line x1="490" y1="627" x2="370" y2="627" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="619" text-anchor="middle" class="yes-no">YES</text>
  <rect x="440" y="670" width="310" height="70" rx="8" fill="#0c4a6e"/>
  <text x="595" y="688" text-anchor="middle" class="box-label">BACTERIAL SINUSITIS TREATMENT</text>
  <text x="448" y="704" font-size="10" fill="#bae6fd">First line: Amoxicillin-Clavulanate 875/125 mg BID × 10d</text>
  <text x="448" y="718" font-size="10" fill="#bae6fd">PCN allergy: Doxycycline 100mg BID × 10d</text>
  <text x="448" y="730" font-size="10" fill="#bae6fd">Intranasal steroids and saline irrigation for symptom relief</text>

  <!-- Arrow down -->
  <line x1="205" y1="615" x2="205" y2="645" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Complications / Red Flags box -->
  <rect x="40" y="645" width="330" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="205" y="664" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">⚠️ COMPLICATIONS / RED FLAGS</text>
  <line x1="58" y1="670" x2="352" y2="670" stroke="#fca5a5" stroke-width="1"/>
  <text x="55" y="686" font-size="10" fill="#991b1b">• Peritonsillar abscess: trismus, muffled voice, uvula deviation</text>
  <text x="55" y="700" font-size="10" fill="#991b1b">  → ENT EMERGENCY — urgent CT + ENT referral</text>
  <text x="55" y="714" font-size="10" fill="#991b1b">• Fusobacterium necrophorum → Lemierre syndrome</text>
  <text x="55" y="724" font-size="10" fill="#991b1b">• Monospot if atypical (no amoxicillin if EBV — rash reaction)</text>

  <!-- Bottom KEY MEMORY POINTS -->
  <rect x="40" y="834" width="720" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="852" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">KEY MEMORY POINTS</text>
  <text x="85" y="868" font-size="10" fill="#475569">🎯 Most sore throat = VIRAL — Centor score guides decision, not just exam</text>
  <text x="85" y="882" font-size="10" fill="#475569">🎯 Fusobacterium = Lemierre syndrome (jugular thrombophlebitis + sepsis)</text>
  <text x="400" y="868" font-size="10" fill="#475569">🎯 Peritonsillar abscess = ENT emergency — do not miss trismus/uvula deviation</text>
  <text x="400" y="882" font-size="10" fill="#475569">🎯 Monospot before amoxicillin if EBV suspected — amox causes morbiliform rash</text>
</svg>
