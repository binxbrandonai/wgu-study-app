<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <style>
      text { font-family: 'Inter', -apple-system, sans-serif; fill: #e2e8f5; }
      .title { font-size: 22px; font-weight: 700; fill: #00e5cc; }
      .subtitle { font-size: 13px; fill: #94a3b8; }
      .box-text { font-size: 11px; }
      .box-title { font-size: 12px; font-weight: 700; }
      .decision-text { font-size: 12px; font-weight: 700; fill: #f5b731; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-teal { fill: none; stroke: #00e5cc; stroke-width: 2; marker-end: url(#arrowhead-teal); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#334155"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#00e5cc"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="750" fill="#050810" rx="0"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" class="title" filter="url(#glow)">Pediatric ADHD Assessment &amp; Management Algorithm</text>
  <text x="450" y="56" text-anchor="middle" class="subtitle">Based on AAP Clinical Practice Guidelines (Age 4-18 Years)</text>

  <!-- Step 1: Suspicion -->
  <rect x="275" y="72" width="350" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="94" text-anchor="middle" class="box-text" font-weight="700">Parent or Teacher Raises Concern for ADHD</text>

  <line x1="450" y1="108" x2="450" y2="125" class="arrow"/>

  <!-- Step 2: Gather information -->
  <rect x="200" y="125" width="500" height="60" rx="8" fill="#0b0f1c" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="145" text-anchor="middle" class="box-title" fill="#f5b731">Step 1: Gather Information from Multiple Sources</text>
  <text x="450" y="162" text-anchor="middle" class="box-text">Vanderbilt rating scales (parent + teacher) Medical history School records</text>
  <text x="450" y="178" text-anchor="middle" class="box-text">Full history: inattention, hyperactivity, impulsivity, onset, settings, impairment</text>

  <line x1="450" y1="185" x2="450" y2="202" class="arrow"/>

  <!-- Step 3: Rule out mimics -->
  <rect x="100" y="202" width="700" height="70" rx="8" fill="#0b0f1c" stroke="#ff4d6d" stroke-width="1"/>
  <text x="450" y="222" text-anchor="middle" class="box-title" fill="#ff4d6d">Step 2: Rule Out Mimics and Comorbidities</text>
  <text x="450" y="240" text-anchor="middle" class="box-text">Hearing/vision deficits · Sleep disorders (sleep apnea, RLS) · Anxiety · Depression · Trauma/PTSD</text>
  <text x="450" y="258" text-anchor="middle" class="box-text">Learning disability · Autism spectrum disorder · Thyroid disease · Anemia · Medications (allergy meds, asthma)</text>

  <line x1="450" y1="272" x2="450" y2="290" class="arrow"/>

  <!-- Step 4: DSM-5 Criteria -->
  <rect x="150" y="290" width="600" height="60" rx="8" fill="#0b0f1c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="310" text-anchor="middle" class="box-title" fill="#38bdf8">Step 3: Apply DSM-5 Diagnostic Criteria</text>
  <text x="450" y="328" text-anchor="middle" class="box-text">≥6 symptoms (≥5 if age 17+) of INATTENTION and/or HYPERACTIVITY-IMPULSIVITY for ≥6 months</text>
  <text x="450" y="344" text-anchor="middle" class="box-text">Onset before age 12 · Present in ≥2 settings · Interferes with function · Not explained by other condition</text>

  <line x1="450" y1="350" x2="450" y2="368" class="arrow"/>

  <!-- Decision Diamond -->
  <rect x="280" y="368" width="340" height="36" rx="18" fill="#0b0f1c" stroke="#f5b731" stroke-width="2"/>
  <text x="450" y="391" text-anchor="middle" class="decision-text">Does Child Meet Full DSM-5 Criteria?</text>

  <!-- YES branch (left) -->
  <line x1="280" y1="392" x2="220" y2="420" class="arrow"/>
  <line x1="220" y1="420" x2="220" y2="435" class="arrow"/>

  <rect x="40" y="435" width="360" height="50" rx="8" fill="#0b0f1c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="220" y="455" text-anchor="middle" class="box-title" fill="#4ade80">✅ YES — ADHD Diagnosis Confirmed</text>
  <text x="220" y="473" text-anchor="middle" class="box-text">Document subtype: Inattentive / Hyperactive-Impulsive / Combined</text>

  <line x1="220" y1="485" x2="220" y2="502" class="arrow"/>

  <!-- Age-based decision -->
  <rect x="40" y="502" width="360" height="55" rx="8" fill="#0b0f1c" stroke="#38bdf8" stroke-width="1"/>
  <text x="220" y="520" text-anchor="middle" class="box-title" fill="#38bdf8">Determine Treatment by Age Group</text>
  <text x="220" y="538" text-anchor="middle" class="box-text">Age 4-5: Behavioral parent training FIRST</text>
  <text x="220" y="553" text-anchor="middle" class="box-text">Age 6-11: Stimulant meds + behavioral therapy</text>

  <!-- Preschool branch (Age 4-5) -->
  <line x1="40" y1="540" x2="40" y2="570" class="arrow"/>
  <line x1="40" y1="570" x2="130" y2="570" class="arrow"/>
  <rect x="40" y="570" width="170" height="60" rx="6" fill="#0b0f1c" stroke="#a78bfa" stroke-width="1"/>
  <text x="125" y="588" text-anchor="middle" class="box-title" fill="#a78bfa">Age 4-5</text>
  <text x="125" y="604" text-anchor="middle" class="box-text">1st: Parent training</text>
  <text x="125" y="619" text-anchor="middle" class="box-text">2nd: Methylphenidate</text>

  <!-- School-age branch (Age 6+) -->
  <line x1="220" y1="557" x2="220" y2="570" class="arrow"/>
  <line x1="220" y1="570" x2="310" y2="570" class="arrow"/>
  <rect x="220" y="570" width="180" height="60" rx="6" fill="#0b0f1c" stroke="#4ade80" stroke-width="1"/>
  <text x="310" y="588" text-anchor="middle" class="box-title" fill="#4ade80">Age 6-11</text>
  <text x="310" y="604" text-anchor="middle" class="box-text">1st: Methylphenidate</text>
  <text x="310" y="619" text-anchor="middle" class="box-text">+ Behavioral therapy</text>

  <!-- NO branch (right) -->
  <line x1="620" y1="392" x2="680" y2="420" class="arrow"/>
  <line x1="680" y1="420" x2="680" y2="435" class="arrow"/>

  <rect x="500" y="435" width="360" height="50" rx="8" fill="#0b0f1c" stroke="#f5b731" stroke-width="1.5"/>
  <text x="680" y="455" text-anchor="middle" class="box-title" fill="#f5b731">❌ NO — Reconsider Differential</text>
  <text x="680" y="473" text-anchor="middle" class="box-text">Screen for: Anxiety, depression, trauma, learning disability, ASD, sleep disorder</text>

  <line x1="680" y1="485" x2="680" y2="502" class="arrow"/>

  <rect x="500" y="502" width="360" height="55" rx="8" fill="#0b0f1c" stroke="#334155" stroke-width="1"/>
  <text x="680" y="520" text-anchor="middle" class="box-title">Monitor and Reassess</text>
  <text x="680" y="538" text-anchor="middle" class="box-text">Re-evaluate in 3-6 months</text>
  <text x="680" y="553" text-anchor="middle" class="box-text">Consider psychoeducational testing</text>

  <!-- Follow-up section -->
  <line x1="310" y1="630" x2="310" y2="648" class="arrow"/>
  <line x1="450" y1="648" x2="310" y2="648" class="arrow"/>
  <line x1="450" y1="648" x2="450" y2="648" class="arrow"/>
  <line x1="450" y1="648" x2="450" y2="648" class="arrow"/>

  <rect x="100" y="648" width="700" height="50" rx="8" fill="#0b0f1c" stroke="#00e5cc" stroke-width="1"/>
  <text x="450" y="666" text-anchor="middle" class="box-title" fill="#00e5cc">Ongoing Monitoring (Every 3-6 Months)</text>
  <text x="450" y="684" text-anchor="middle" class="box-text">Vanderbilt re-evaluation · Height/weight tracking (stimulant growth effect) · BP/HR · Side effect check</text>
  <text x="450" y="698" text-anchor="middle" class="box-text">Medication titration · School performance · Reassess need for medication annually</text>

  <!-- Pharmacology box -->
  <rect x="50" y="710" width="800" height="28" rx="6" fill="#0b0f1c" stroke="#334155" stroke-width="1"/>
  <text x="450" y="728" text-anchor="middle" class="box-text" fill="#a78bfa">💊 First-line: Methylphenidate (Ritalin/Concerta) or Amphetamine (Adderall/Vyvanse). Non-stimulants: Atomoxetine, Guanfacine if failed 2 stimulants</text>
</svg>
