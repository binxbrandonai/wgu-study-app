<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-label { font-size: 12px; font-weight: 700; fill: white; }
      .box-text { font-size: 11px; fill: white; }
      .diamond-text { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .yes-no { font-size: 11px; font-weight: 700; fill: #64748b; }
      .step-text { font-size: 11px; fill: #1e293b; line-height: 1.5; }
      .note { font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="920" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="776" height="896" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" class="title">Bipolar &amp; Schizophrenia — Clinical Algorithm</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">FNP D118 | Adult Primary Care</text>
  <line x1="40" y1="72" x2="760" y2="72" stroke="#e2e8f0" stroke-width="1"/>

  <!-- BIPOLAR SECTION HEADER -->
  <rect x="30" y="82" width="350" height="30" rx="6" fill="#1e40af"/>
  <text x="205" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="white">BIPOLAR DISORDER PATHWAY</text>

  <!-- SCHIZOPHRENIA SECTION HEADER -->
  <rect x="420" y="82" width="350" height="30" rx="6" fill="#1e40af"/>
  <text x="595" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="white">SCHIZOPHRENIA PATHWAY</text>

  <line x1="400" y1="82" x2="400" y2="112" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- ===== BIPOLAR FLOW ===== -->

  <!-- Presentation -->
  <rect x="30" y="120" width="350" height="55" rx="10" fill="#1e40af"/>
  <text x="205" y="141" text-anchor="middle" class="box-label">BIPOLAR PRESENTATION</text>
  <text x="205" y="157" text-anchor="middle" class="box-text">Elevated/irritable mood &amp;plus; 3&amp;plus; DIGFAST symptoms</text>
  <text x="205" y="172" text-anchor="middle" class="box-text">Distractibility, grandiosity, flight of ideas, activity &amp;uarr;</text>

  <line x1="205" y1="175" x2="205" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bipolar type diamond -->
  <polygon points="205,204 290,239 205,274 120,239" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="205" y="233" text-anchor="middle" class="diamond-text">BIPOLAR TYPE?</text>
  <text x="205" y="249" text-anchor="middle" font-size="10" fill="#92400e">Duration &amp; severity</text>

  <!-- Bipolar I -->
  <line x1="120" y1="239" x2="60" y2="239" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="231" text-anchor="middle" class="yes-no">I</text>
  <rect x="20" y="250" width="80" height="44" rx="8" fill="#dc2626"/>
  <text x="60" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="white">BIPOLAR I</text>
  <text x="60" y="283" text-anchor="middle" font-size="9" fill="#fecaca">Mania &amp;ge;7 days</text>
  <text x="60" y="293" text-anchor="middle" font-size="9" fill="#fecaca">or hospitalized</text>

  <!-- Bipolar II -->
  <line x1="205" y1="274" x2="205" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="223" y="292" class="yes-no">II</text>
  <rect x="135" y="300" width="140" height="44" rx="8" fill="#0c4a6e"/>
  <text x="205" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#bae6fd">BIPOLAR II</text>
  <text x="205" y="333" text-anchor="middle" font-size="9" fill="#e0f2fe">Hypomania &amp;ge;4 days</text>
  <text x="205" y="343" text-anchor="middle" font-size="9" fill="#e0f2fe">&amp;plus; MDD episodes</text>

  <!-- Cyclothymia -->
  <line x1="120" y1="252" x2="60" y2="306" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="72" y="280" text-anchor="middle" font-size="9" font-weight="700" fill="#854d0e">Cyclo</text>
  <rect x="20" y="300" width="80" height="44" rx="8" fill="#065f46"/>
  <text x="60" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="white">Cyclothymia</text>
  <text x="60" y="333" text-anchor="middle" font-size="9" fill="#a7f3d0">Hypomania &amp;plus;</text>
  <text x="60" y="343" text-anchor="middle" font-size="9" fill="#a7f3d0">Mild depression &amp;ge;2yr</text>

  <!-- Merge arrows to acute mania treatment -->
  <line x1="60" y1="294" x2="60" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="364" x2="205" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="205" y1="344" x2="205" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Acute mania treatment -->
  <rect x="40" y="364" width="330" height="50" rx="10" fill="#0c4a6e"/>
  <text x="205" y="385" text-anchor="middle" class="box-label">ACUTE MANIA TREATMENT</text>
  <text x="205" y="401" text-anchor="middle" class="box-text">Lithium OR Valproate OR Atypical Antipsychotic (quetiapine, olanzapine)</text>

  <line x1="205" y1="414" x2="205" y2="442" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Maintenance box -->
  <rect x="40" y="442" width="330" height="50" rx="10" fill="#065f46"/>
  <text x="205" y="463" text-anchor="middle" class="box-label">MAINTENANCE THERAPY</text>
  <text x="205" y="479" text-anchor="middle" class="box-text">Lithium first-line | Lamotrigine for bipolar depression</text>
  <text x="205" y="491" text-anchor="middle" class="box-text">NO antidepressant monotherapy (induces mania)</text>

  <line x1="205" y1="492" x2="205" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Monitoring boxes -->
  <rect x="20" y="518" width="170" height="66" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="105" y="536" text-anchor="middle" font-size="10" font-weight="700" fill="#854d0e">LITHIUM MONITORING</text>
  <text x="28" y="552" font-size="9" fill="#a16207">Levels: 0.8-1.2 mEq/L</text>
  <text x="28" y="566" font-size="9" fill="#a16207">Check BMP, TSH, BMP q6mo</text>
  <text x="28" y="580" font-size="9" fill="#a16207">Toxicity &gt;1.5: tremor, N/V</text>

  <rect x="210" y="518" width="160" height="66" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="290" y="536" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">VALPROATE</text>
  <text x="218" y="552" font-size="9" fill="#991b1b">Check LFTs, CBC</text>
  <text x="218" y="566" font-size="9" fill="#991b1b">TERATOGENIC (neural tube)</text>
  <text x="218" y="580" font-size="9" fill="#991b1b">Avoid in pregnancy</text>

  <!-- Arrow down -->
  <line x1="105" y1="584" x2="105" y2="610" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="105" y1="610" x2="290" y2="610" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="584" x2="290" y2="610" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lamotrigine warning -->
  <rect x="40" y="610" width="325" height="36" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="202" y="628" text-anchor="middle" font-size="10" font-weight="700" fill="#7e22ce">Lamotrigine: titrate slowly (SJS risk) | Good for bipolar depression</text>
  <text x="202" y="642" text-anchor="middle" font-size="9" fill="#7e22ce">NO antidepressant alone in bipolar (mania induction)</text>

  <!-- ===== SCHIZOPHRENIA FLOW ===== -->

  <!-- Presentation -->
  <rect x="420" y="120" width="350" height="55" rx="10" fill="#1e40af"/>
  <text x="595" y="141" text-anchor="middle" class="box-label">SCHIZOPHRENIA PRESENTATION</text>
  <text x="595" y="157" text-anchor="middle" class="box-text">2&amp;plus; of: delusions, hallucinations, disorganized speech</text>
  <text x="595" y="172" text-anchor="middle" class="box-text">Disorganized/negative behavior, social/occupational dysfunction &gt;6 mo</text>

  <line x1="595" y1="175" x2="595" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DSM-5 Diagnosis box -->
  <polygon points="595,206 685,241 595,276 505,241" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="595" y="235" text-anchor="middle" class="diamond-text">DSM-5 CRITERIA?</text>
  <text x="595" y="251" text-anchor="middle" font-size="10" fill="#0369a1">2&amp;plus; symptoms &gt;6 mo?</text>

  <line x1="505" y1="241" x2="420" y2="241" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="233" text-anchor="middle" class="yes-no">YES</text>

  <!-- First-line treatment -->
  <rect x="420" y="258" width="350" height="50" rx="10" fill="#065f46"/>
  <text x="595" y="279" text-anchor="middle" class="box-label">DIAGNOSIS: SCHIZOPHRENIA</text>
  <text x="595" y="295" text-anchor="middle" class="box-text">First-line: Second-gen antipsychotic (risperidone, quetiapine, olanzapine, aripiprazole)</text>

  <line x1="595" y1="308" x2="595" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metabolic monitoring -->
  <rect x="420" y="336" width="350" height="50" rx="10" fill="#0c4a6e"/>
  <text x="595" y="357" text-anchor="middle" class="box-label">METABOLIC MONITORING REQUIRED</text>
  <text x="595" y="373" text-anchor="middle" class="box-text">Weight, glucose, lipids q3mo | EPS monitoring (AIMS exam)</text>

  <line x1="595" y1="386" x2="595" y2="414" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Treatment-resistant -->
  <polygon points="595,416 685,451 595,486 505,451" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="595" y="445" text-anchor="middle" class="diamond-text">TREATMENT-RESISTANT?</text>
  <text x="595" y="461" text-anchor="middle" font-size="10" fill="#991b1b">Failed 2 trials?</text>

  <line x1="505" y1="451" x2="420" y2="451" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="443" text-anchor="middle" class="yes-no">YES</text>

  <rect x="420" y="466" width="350" height="50" rx="10" fill="#dc2626"/>
  <text x="595" y="487" text-anchor="middle" class="box-label">CLOZAPINE</text>
  <text x="595" y="503" text-anchor="middle" class="box-text">Only for treatment-resistant schizophrenia</text>
  <text x="595" y="515" text-anchor="middle" class="box-text">ANC monitoring required (agranulocytosis risk)</text>

  <line x1="595" y1="516" x2="595" y2="544" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="544" width="350" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="595" y="562" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">CLOZAPINE: weekly ANC &amp;times;6mo, then q2wk</text>
  <text x="595" y="576" text-anchor="middle" font-size="9" fill="#991b1b">Clozapine REMS program required</text>

  <!-- NO path -->
  <line x1="685" y1="451" x2="740" y2="451" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="443" text-anchor="middle" class="yes-no">NO</text>
  <rect x="740" y="436" width="50" height="40" rx="8" fill="#065f46"/>
  <text x="765" y="453" text-anchor="middle" font-size="9" font-weight="700" fill="white">Try</text>
  <text x="765" y="466" text-anchor="middle" font-size="9" font-weight="700" fill="white">other SGA</text>

  <!-- KEY MEMORY POINTS -->
  <rect x="30" y="730" width="740" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="748" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">KEY MEMORY POINTS</text>
  <text x="60" y="764" font-size="10" fill="#475569">🎯 Lithium toxicity: tremor, confusion, vomiting at &gt;1.5 mEq/L</text>
  <text x="60" y="778" font-size="10" fill="#475569">🎯 Valproate = teratogen (neural tube defects); avoid in pregnancy</text>
  <text x="400" y="764" font-size="10" fill="#475569">🎯 NEVER antidepressant alone in bipolar — induces mania</text>
  <text x="400" y="778" font-size="10" fill="#475569">🎯 Clozapine = agranulocytosis risk; requires ANC monitoring</text>

</svg>
