<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-label { font-size: 12px; font-weight: 700; fill: white; }
      .box-text { font-size: 11px; fill: white; }
      .diamond-text { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .yes-no { font-size: 11px; font-weight: 700; fill: #64748b; }
      .step-text { font-size: 11px; fill: #1e293b; line-height: 1.5; }
      .note { font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="920" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="776" height="896" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" class="title">Major Depressive Disorder — Clinical Algorithm</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">FNP D118 | Adult Primary Care</text>
  <line x1="40" y1="72" x2="760" y2="72" stroke="#e2e8f0" stroke-width="1"/>

  <!-- START: Presentation box -->
  <rect x="210" y="82" width="380" height="55" rx="10" fill="#1e40af"/>
  <text x="400" y="103" text-anchor="middle" class="box-label">PATIENT PRESENTATION</text>
  <text x="400" y="119" text-anchor="middle" class="box-text">Depressed mood, anhedonia, sleep/appetite changes, low energy</text>
  <text x="400" y="134" text-anchor="middle" class="box-text">Poor concentration, guilt/worthlessness, psychomotor changes</text>

  <!-- Arrow -->
  <line x1="400" y1="137" x2="400" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PHQ-2 DIAMOND -->
  <polygon points="400,166 490,201 400,236 310,201" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" class="diamond-text">PHQ-2 SCREEN</text>
  <text x="400" y="212" text-anchor="middle" font-size="10" fill="#0369a1">Score &amp;ge;3?</text>

  <!-- NO PHQ-2 -->
  <line x1="310" y1="201" x2="200" y2="201" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="193" text-anchor="middle" class="yes-no">NO</text>
  <rect x="50" y="185" width="150" height="40" rx="8" fill="#065f46"/>
  <text x="125" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="white">PHQ-2 &lt;3</text>
  <text x="125" y="217" text-anchor="middle" font-size="10" fill="#a7f3d0">Rescreen annually</text>

  <!-- YES → PHQ-9 -->
  <line x1="400" y1="236" x2="400" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="418" y="256" class="yes-no">YES</text>

  <!-- PHQ-9 Box -->
  <rect x="240" y="266" width="320" height="44" rx="10" fill="#0c4a6e"/>
  <text x="400" y="287" text-anchor="middle" class="box-label">ADMINISTER PHQ-9 (9 items, 0-27)</text>
  <text x="400" y="303" text-anchor="middle" class="box-text">Score &amp;ge;10 = positive screen | Item 9 = suicide risk</text>

  <!-- Arrow -->
  <line x1="400" y1="310" x2="400" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PHQ-9 SCORING diamond -->
  <polygon points="400,338 510,373 400,408 290,373" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="367" text-anchor="middle" class="diamond-text">PHQ-9 SEVERITY</text>
  <text x="400" y="383" text-anchor="middle" font-size="10" fill="#92400e">Score interpretation</text>

  <!-- Severity boxes right side -->
  <line x1="510" y1="373" x2="550" y2="341" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="326" width="210" height="36" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="655" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">0-4 Minimal / 5-9 Mild</text>
  <text x="655" y="356" text-anchor="middle" font-size="10" fill="#15803d">Watchful waiting, lifestyle</text>

  <line x1="510" y1="380" x2="550" y2="380" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="368" width="210" height="36" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="655" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">10-14 Moderate</text>
  <text x="655" y="398" text-anchor="middle" font-size="10" fill="#a16207">Therapy &amp;plus; consider SSRI</text>

  <line x1="510" y1="394" x2="550" y2="422" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="410" width="210" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="655" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">15-19 Mod-Severe</text>
  <text x="655" y="440" text-anchor="middle" font-size="10" fill="#991b1b">SSRI &amp;plus; therapy required</text>

  <line x1="510" y1="400" x2="550" y2="468" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="454" width="210" height="36" rx="8" fill="#7f1d1d"/>
  <text x="655" y="471" text-anchor="middle" font-size="11" font-weight="700" fill="#fca5a5">20-27 Severe</text>
  <text x="655" y="484" text-anchor="middle" font-size="10" fill="#fecaca">SSRI &amp;plus; therapy, close f/u</text>

  <!-- Arrow down -->
  <line x1="400" y1="408" x2="400" y2="436" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SUICIDE RISK diamond -->
  <polygon points="400,438 500,473 400,508 300,473" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="467" text-anchor="middle" class="diamond-text">SUICIDE RISK</text>
  <text x="400" y="483" text-anchor="middle" font-size="10" fill="#991b1b">PHQ-9 Item 9 &gt;0?</text>

  <!-- ACTIVE PLAN → Emergency -->
  <line x1="300" y1="473" x2="140" y2="473" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="465" text-anchor="middle" class="yes-no">ACTIVE PLAN?</text>

  <rect x="36" y="462" width="104" height="40" rx="8" fill="#dc2626"/>
  <text x="88" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="white">EMERGENCY</text>
  <text x="88" y="495" text-anchor="middle" font-size="10" fill="#fecaca">ER evaluation required</text>

  <line x1="88" y1="502" x2="88" y2="522" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="36" y="522" width="104" height="36" rx="8" fill="#991b1b"/>
  <text x="88" y="540" text-anchor="middle" font-size="10" font-weight="700" fill="#fecaca">Safety plan</text>
  <text x="88" y="553" text-anchor="middle" font-size="10" fill="#fecaca">Crisis hotline</text>

  <!-- NO suicide risk -->
  <line x1="400" y1="508" x2="400" y2="536" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="418" y="526" class="yes-no">NO</text>

  <!-- DSM-5 Diagnosis box -->
  <rect x="180" y="536" width="440" height="50" rx="10" fill="#065f46"/>
  <text x="400" y="557" text-anchor="middle" class="box-label">DIAGNOSIS: DSM-5 MDD</text>
  <text x="400" y="573" text-anchor="middle" class="box-text">5&amp;plus; symptoms &amp;times; 2 wks | Anhedonia OR depressed mood required</text>
  <text x="400" y="585" text-anchor="middle" class="box-text">Rule out: bipolar, substance-induced, medical (thyroid, B12)</text>

  <!-- Arrow -->
  <line x1="400" y1="586" x2="400" y2="614" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TREATMENT SELECTION box -->
  <rect x="60" y="614" width="680" height="90" rx="10" fill="#0c4a6e"/>
  <text x="400" y="635" text-anchor="middle" class="box-label">TREATMENT SELECTION</text>
  <line x1="80" y1="641" x2="720" y2="641" stroke="#38bdf8" stroke-width="0.5"/>

  <text x="210" y="658" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">Mild-Moderate (PHQ-9 &lt;15)</text>
  <text x="130" y="674" font-size="10" fill="#e0f2fe">Therapy (CBT/IPT) &amp;plus; consider SSRI</text>
  <text x="130" y="688" font-size="10" fill="#e0f2fe">Sertraline 50mg or Escitalopram 10mg qAM</text>
  <text x="130" y="702" font-size="10" fill="#e0f2fe">Lifestyle: sleep hygiene, exercise, diet</text>

  <text x="590" y="658" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">Severe (PHQ-9 &amp;ge;15)</text>
  <text x="490" y="674" font-size="10" fill="#e0f2fe">SSRI &amp;plus; therapy REQUIRED</text>
  <text x="490" y="688" font-size="10" fill="#e0f2fe">Sertraline 50-200mg OR Escitalopram 10-20mg</text>
  <text x="490" y="702" font-size="10" fill="#e0f2fe">Consider psychiatry referral</text>

  <line x1="400" y1="644" x2="400" y2="704" stroke="#38bdf8" stroke-width="0.5"/>

  <!-- Arrow -->
  <line x1="400" y1="704" x2="400" y2="730" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ADEQUATE TRIAL diamond -->
  <polygon points="400,732 490,767 400,802 310,767" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="761" text-anchor="middle" class="diamond-text">ADEQUATE TRIAL?</text>
  <text x="400" y="777" text-anchor="middle" font-size="10" fill="#7e22ce">6-8 wks at therapeutic dose?</text>

  <!-- YES -->
  <line x1="310" y1="767" x2="210" y2="767" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="759" text-anchor="middle" class="yes-no">YES</text>
  <rect x="40" y="752" width="170" height="36" rx="8" fill="#065f46"/>
  <text x="125" y="770" text-anchor="middle" font-size="11" font-weight="700" fill="white">Continue &amp; Monitor</text>
  <text x="125" y="784" text-anchor="middle" font-size="10" fill="#a7f3d0">Follow-up 4-6 wks</text>

  <!-- NO -->
  <line x1="400" y1="802" x2="400" y2="828" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="418" y="820" class="yes-no">NO</text>

  <!-- Treatment-resistant box -->
  <rect x="150" y="828" width="500" height="38" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="845" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">Switch SSRI or Augment: Bupropion 150mg, Aripiprazole 2-5mg</text>
  <text x="400" y="858" text-anchor="middle" font-size="10" fill="#7e22ce">Treatment-resistant: Refer psychiatry &amp;mdash; consider esketamine/ECT</text>

  <!-- Arrow left to Serotonin Syndrome box -->
  <line x1="150" y1="847" x2="104" y2="847" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Serotonin Syndrome Warning -->
  <rect x="20" y="830" width="84" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="62" y="846" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">SEROTONIN</text>
  <text x="62" y="858" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">SYNDROME</text>
  <text x="62" y="872" text-anchor="middle" font-size="8" fill="#991b1b">Hyperthermia,</text>
  <text x="62" y="882" text-anchor="middle" font-size="8" fill="#991b1b">clonus, agitation</text>

  <!-- KEY MEMORY POINTS -->
  <rect x="30" y="844" width="740" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="862" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">KEY MEMORY POINTS</text>
  <text x="60" y="878" font-size="10" fill="#475569">🎯 PHQ-9 &amp;ge;10 = positive screen; wait 4-6 wks for SSRI effect</text>
  <text x="60" y="892" font-size="10" fill="#475569">🎯 Bupropion: NO in seizures/eating disorders/abrupt EtOH cessation</text>
  <text x="400" y="878" font-size="10" fill="#475569">🎯 6-12 mo treatment for first episode; address substance use comorbidity</text>
  <text x="400" y="892" font-size="10" fill="#475569">🎯 Serotonin syndrome: stop agents, give cyproheptadine</text>

</svg>
