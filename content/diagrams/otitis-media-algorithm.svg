<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-label { font-size: 12px; font-weight: 700; fill: white; }
      .box-text { font-size: 11px; fill: white; }
      .diamond-text { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .yes-no { font-size: 11px; font-weight: 700; fill: #64748b; }
      .step-text { font-size: 11px; fill: #1e293b; line-height: 1.5; }
      .note { font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="920" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="776" height="896" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" class="title">Acute Otitis Media — Clinical Algorithm</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">FNP D118 | AAP 2013/2022 Guidelines</text>
  <line x1="40" y1="72" x2="760" y2="72" stroke="#e2e8f0" stroke-width="1"/>

  <!-- START: Presentation box -->
  <rect x="230" y="82" width="340" height="55" rx="10" fill="#1e40af"/>
  <text x="400" y="103" text-anchor="middle" class="box-label">PATIENT PRESENTATION</text>
  <text x="400" y="118" text-anchor="middle" class="box-text">Otalgia (ear pain) + fever + irritability</text>
  <text x="400" y="132" text-anchor="middle" class="box-text">Recent URI symptoms in last 3–7 days</text>

  <!-- Arrow down -->
  <line x1="400" y1="137" x2="400" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond: TM Exam -->
  <polygon points="400,167 520,207 400,247 280,207" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" class="diamond-text">OTOSCOPIC EXAM</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#92400e">TM bulging + erythema +</text>
  <text x="400" y="230" text-anchor="middle" font-size="10" fill="#92400e">effusion / decreased mobility?</text>

  <!-- RIGHT: OME differential -->
  <line x1="520" y1="207" x2="600" y2="207" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="199" text-anchor="middle" class="yes-no">NO →</text>
  <rect x="600" y="180" width="175" height="95" rx="8" fill="#7c3aed"/>
  <text x="687" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="white">Consider OME</text>
  <text x="608" y="213" font-size="10" fill="#e9d5ff">• Otitis Media with Effusion</text>
  <text x="608" y="227" font-size="10" fill="#e9d5ff">• No acute inflammation</text>
  <text x="608" y="241" font-size="10" fill="#e9d5ff">• TM retracted, not bulging</text>
  <text x="608" y="255" font-size="10" fill="#e9d5ff">• Watch &amp; wait 3 months</text>
  <text x="608" y="269" font-size="10" fill="#e9d5ff">• No antibiotics indicated</text>

  <!-- YES arrow down -->
  <line x1="400" y1="247" x2="400" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="265" class="yes-no">YES</text>

  <!-- Diagnosis: AOM -->
  <rect x="230" y="278" width="340" height="50" rx="10" fill="#065f46"/>
  <text x="400" y="298" text-anchor="middle" class="box-label">✓ ACUTE OTITIS MEDIA (AOM)</text>
  <text x="400" y="314" text-anchor="middle" class="box-text">Diagnosis requires: acute onset + effusion + inflammation</text>
  <text x="400" y="326" text-anchor="middle" class="box-text">TM bulging = hallmark of AOM (not just erythema)</text>

  <!-- Arrow down -->
  <line x1="400" y1="328" x2="400" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DIAMOND: Age-based decision -->
  <polygon points="400,360 530,405 400,450 270,405" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="398" text-anchor="middle" class="diamond-text">AGE-BASED APPROACH</text>
  <text x="400" y="414" text-anchor="middle" font-size="10" fill="#0369a1">Severity &amp; laterality matter</text>

  <!-- LEFT branch: <6 months -->
  <line x1="270" y1="405" x2="160" y2="405" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="397" text-anchor="middle" class="yes-no">&lt;6 mo</text>
  <rect x="40" y="388" width="120" height="50" rx="8" fill="#dc2626"/>
  <text x="100" y="406" text-anchor="middle" class="box-label">&lt; 6 MONTHS</text>
  <text x="100" y="420" text-anchor="middle" class="box-text">Treat ALWAYS</text>
  <text x="100" y="433" text-anchor="middle" class="box-text">Any AOM = antibiotics</text>

  <!-- Arrow down from <6mo -->
  <line x1="100" y1="438" x2="100" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CENTER branch: 6mo-2yr -->
  <line x1="400" y1="450" x2="400" y2="480" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="470" class="yes-no">6 mo – 2 yr</text>

  <polygon points="400,482 490,512 400,542 310,512" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="506" text-anchor="middle" class="diamond-text">BILATERAL</text>
  <text x="400" y="522" text-anchor="middle" font-size="10" fill="#15803d">OR SEVERE?</text>

  <!-- YES 6mo-2yr -->
  <line x1="490" y1="512" x2="560" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="504" text-anchor="middle" class="yes-no">YES</text>
  <rect x="560" y="490" width="205" height="75" rx="8" fill="#dc2626"/>
  <text x="662" y="508" text-anchor="middle" class="box-label">Treat with antibiotics</text>
  <text x="568" y="524" font-size="10" fill="#fca5a5">Bilateral AOM: treat age 6–23 mo</text>
  <text x="568" y="538" font-size="10" fill="#fca5a5">Severe: temp ≥39°C (102.2°F)</text>
  <text x="568" y="552" font-size="10" fill="#fca5a5">or moderate-severe otalgia</text>

  <!-- NO 6mo-2yr -->
  <line x1="310" y1="512" x2="240" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="504" text-anchor="middle" class="yes-no">NO</text>
  <rect x="100" y="496" width="140" height="55" rx="8" fill="#0c4a6e"/>
  <text x="170" y="514" text-anchor="middle" class="box-label">Observation</text>
  <text x="108" y="530" font-size="10" fill="#bae6fd">Watchful waiting 48–72h</text>
  <text x="108" y="544" font-size="10" fill="#bae6fd">If no improvement → treat</text>

  <!-- RIGHT branch: >2yr -->
  <line x1="530" y1="405" x2="630" y2="405" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="630" y="380" width="155" height="55" rx="8" fill="#0c4a6e"/>
  <text x="707" y="398" text-anchor="middle" class="box-label">&gt; 2 YEARS</text>
  <text x="638" y="413" font-size="10" fill="#bae6fd">Unilateral mild: observation</text>
  <text x="638" y="427" font-size="10" fill="#bae6fd">Bilateral/severe: treat</text>

  <!-- Merge lines into treatment decision -->
  <line x1="400" y1="542" x2="400" y2="575" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Treatment box -->
  <rect x="100" y="575" width="600" height="130" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">💊 ANTIBIOTIC TREATMENT</text>
  <line x1="120" y1="602" x2="680" y2="602" stroke="#86efac" stroke-width="1"/>

  <text x="250" y="620" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">First Line</text>
  <text x="130" y="637" font-size="11" fill="#15803d">Amoxicillin 80–90 mg/kg/day</text>
  <text x="130" y="652" font-size="10" fill="#15803d">Divide BID × 10 days</text>
  <text x="130" y="667" font-size="10" fill="#15803d">(× 7 days if age ≥6yr)</text>
  <text x="130" y="682" font-size="10" fill="#15803d">Weight-based dosing — max 875mg BID</text>

  <text x="520" y="620" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Failed 48–72h / Severe</text>
  <text x="400" y="637" font-size="11" fill="#15803d">Amoxicillin-Clavulanate</text>
  <text x="400" y="652" font-size="10" fill="#15803d">90 mg/kg/day amox component</text>
  <text x="400" y="667" font-size="10" fill="#15803d">Divide BID × 10 days</text>

  <text x="670" y="620" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">PCN Allergy</text>
  <text x="590" y="637" font-size="10" fill="#15803d">Non-anaphylactic rash:</text>
  <text x="590" y="652" font-size="10" fill="#15803d">→ Cefdinir 14mg/kg/day</text>
  <text x="590" y="667" font-size="10" fill="#15803d">Anaphylaxis:</text>
  <text x="590" y="682" font-size="10" fill="#15803d">→ Azithromycin 10mg/kg x1</text>
  <text x="590" y="695" font-size="10" fill="#15803d">  then 5mg/kg × 4 days</text>

  <!-- Arrow down -->
  <line x1="400" y1="705" x2="400" y2="735" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Follow-up box -->
  <rect x="100" y="735" width="260" height="80" rx="10" fill="#0c4a6e"/>
  <text x="230" y="756" text-anchor="middle" class="box-label">FOLLOW-UP</text>
  <text x="110" y="773" font-size="10" fill="#bae6fd">• Re-evaluate in 48–72 hours</text>
  <text x="110" y="787" font-size="10" fill="#bae6fd">• Pain management always</text>
  <text x="110" y="801" font-size="10" fill="#bae6fd">• Ibuprofen 10mg/kg q6-8h</text>
  <text x="110" y="810" font-size="10" fill="#bae6fd">  or acetaminophen 15mg/kg q4-6h</text>

  <!-- Recurrent box -->
  <rect x="440" y="735" width="260" height="80" rx="10" fill="#dc2626"/>
  <text x="570" y="756" text-anchor="middle" class="box-label">RECURRENT AOM</text>
  <text x="450" y="773" font-size="10" fill="#fca5a5">• ≥3 episodes in 6 months</text>
  <text x="450" y="787" font-size="10" fill="#fca5a5">  OR ≥4 in 12 months</text>
  <text x="450" y="801" font-size="10" fill="#fca5a5">• Refer to ENT</text>
  <text x="450" y="810" font-size="10" fill="#fca5a5">  (consider tympanostomy tubes)</text>

  <!-- Bottom KEY MEMORY POINTS -->
  <rect x="40" y="834" width="720" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="852" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">KEY MEMORY POINTS</text>
  <text x="80" y="868" font-size="10" fill="#475569">🎯 TM bulging = AOM (not just erythema); erythema alone ≠ AOM</text>
  <text x="80" y="882" font-size="10" fill="#475569">🎯 PCN allergy with rash → cefdinir; anaphylaxis → azithromycin</text>
  <text x="400" y="868" font-size="10" fill="#475569">🎯 &lt;6 mo always treat; 6–23 mo treat if bilateral/severe</text>
  <text x="400" y="882" font-size="10" fill="#475569">🎯 Pain management is ALWAYS indicated — NSAIDs first line</text>
</svg>
