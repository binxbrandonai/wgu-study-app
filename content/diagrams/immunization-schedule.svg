  <text x="110" y="253" text-anchor="end" class="label" fill="#00e5cc">MMR</text>
  <rect x="345" y="240" width="38" height="18" rx="4" fill="#00e5cc"/>
  <rect x="513" y="240" width="48" height="18" rx="4" fill="#00e5cc"/>
  <text x="365" y="252" text-anchor="middle" class="bar-text" fill="#050810">1</text>
  <text x="538" y="252" text-anchor="middle" class="bar-text" fill="#050810">2</text>

