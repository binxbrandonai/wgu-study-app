  <text x="110" y="169" text-anchor="end" class="label" fill="#a78bfa">IPV</text>
  <rect x="185" y="156" width="38" height="18" rx="4" fill="#a78bfa"/>
  <rect x="225" y="156" width="38" height="18" rx="4" fill="#a78bfa"/>
  <rect x="345" y="156" width="38" height="18" rx="4" fill="#a78bfa"/>
  <rect x="513" y="156" width="48" height="18" rx="4" fill="#a78bfa"/>
