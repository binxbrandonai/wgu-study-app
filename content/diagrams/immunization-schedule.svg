  <text x="110" y="281" text-anchor="end" class="label" fill="#34d399">VAR</text>
  <rect x="345" y="268" width="38" height="18" rx="4" fill="#34d399"/>
  <rect x="513" y="268" width="48" height="18" rx="4" fill="#34d399"/>
  <text x="365" y="280" text-anchor="middle" class="bar-text" fill="#050810">1</text>
  <text x="538" y="280" text-anchor="middle" class="bar-text" fill="#050810">2</text>

  <!-- Row 9: HepA -->
  <text x="110" y="309" text-anchor="end" class="label" fill="#f472b6">HepA</text>
  <rect x="345" y="296" width="75" height="18" rx="4" fill="#f472b6"/>
  <text x="383" y="308" text-anchor="middle" class="bar-text" fill="#050810">2-dose series</text>

  <!-- Row 10: Tdap -->
  <text x="110" y="337" text-anchor="end" class="label" fill="#f5b731">Tdap</text>
  <rect x="663" y="324" width="48" height="18" rx="4" fill="#f5b731"/>
  <rect x="745" y="324" width="16" height="18" rx="4" fill="#f5b731" opacity="0.5"/>
  <text x="688" y="336" text-anchor="middle" class="bar-text" fill="#050810">Tdap</text>

  <!-- Row 11: HPV -->
  <text x="110" y="365" text-anchor="end" class="label" fill="#a78bfa">HPV</text>
  <rect x="663" y="352" width="95" height="18" rx="4" fill="#a78bfa"/>
  <text x="712" y="364" text-anchor="middle" class="bar-text" fill="#050810">2-3 doses</text>

  <!-- Row 12: MenACWY -->
  <text x="110" y="393" text-anchor="end" class="label" fill="#38bdf8">MenACWY</text>
  <rect x="663" y="380" width="48" height="18" rx="4" fill="#38bdf8"/>
  <rect x="745" y="380" width="16" height="18" rx="4" fill="#38bdf8" opacity="0.5"/>
  <text x="688" y="392" text-anchor="middle" class="bar-text" fill="#050810">1</text>

  <!-- Row 13: MenB (optional) -->
  <text x="110" y="421" text-anchor="end" class="label" fill="#64748b">MenB</text>
  <rect x="710" y="408" width="50" height="18" rx="4" fill="#64748b"/>
  <text x="750" y="422" text-anchor="middle" class="bar-text" fill="#050810">16-18</text>

  <!-- Row 14: Influenza -->
  <text x="110" y="449" text-anchor="end" class="label" fill="#22c55e">Flu</text>
  <rect x="265" y="436" width="460" height="18" rx="4" fill="#22c55e"/>
  <text x="496" y="449" text-anchor="middle" class="bar-text" fill="#050810">Annual (starting at 6 months)</text>

  <!-- Row 15: COVID-19 -->
  <text x="110" y="477" text-anchor="end" class="label" fill="#94a3b8">COVID-19</text>
  <rect x="265" y="464" width="460" height="18" rx="4" fill="#94a3b8"/>
  <text x="496" y="477" text-anchor="middle" class="bar-text" fill="#050810">Per current recommendations</text>

  <!-- Row 16: RSV -->
  <text x="110" y="505" text-anchor="end" class="label" fill="#fbbf24">RSV</text>
  <rect x="185" y="492" width="38" height="18" rx="4" fill="#fbbf24"/>
  <rect x="745" y="492" width="16" height="18" rx="4" fill="#fbbf24" opacity="0.5"/>
  <text x="205" y="505" text-anchor="middle" class="bar-text" fill="#050810">Nirsevimab</text>

  <!-- Legend -->
  <rect x="20" y="530" width="760" height="55" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="30" y="540" width="12" height="12" rx="2" fill="#38bdf8"/>
  <text x="46" y="551" class="legend-text">HepB</text>
  <rect x="90" y="540" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="106" y="551" class="legend-text">RV</text>
  <rect x="135" y="540" width="12" height="12" rx="2" fill="#f5b731"/>
  <text x="151" y="551" class="legend-text">DTaP</text>
  <rect x="190" y="540" width="12" height="12" rx="2" fill="#a78bfa"/>
  <text x="206" y="551" class="legend-text">IPV</text>
  <rect x="240" y="540" width="12" height="12" rx="2" fill="#ff4d6d"/>
  <text x="256" y="551" class="legend-text">Hib</text>
  <rect x="290" y="540" width="12" height="12" rx="2" fill="#fb923c"/>
  <text x="306" y="551" class="legend-text">PCV13</text>
  <rect x="350" y="540" width="12" height="12" rx="2" fill="#00e5cc"/>
  <text x="366" y="551" class="legend-text">MMR</text>
  <rect x="410" y="540" width="12" height="12" rx="2" fill="#34d399"/>
  <text x="426" y="551" class="legend-text">VAR</text>
  <rect x="465" y="540" width="12" height="12" rx="2" fill="#f472b6"/>
  <text x="481" y="551" class="legend-text">HepA</text>
  <rect x="525" y="540" width="12" height="12" rx="2" fill="#f5b731"/>
  <text x="541" y="551" class="legend-text">Tdap</text>
  <rect x="580" y="540" width="12" height="12" rx="2" fill="#a78bfa"/>
  <text x="596" y="551" class="legend-text">HPV</text>
  <rect x="635" y="540" width="12" height="12" rx="2" fill="#38bdf8"/>
  <text x="651" y="551" class="legend-text">MenACWY</text>
  <rect x="710" y="540" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="726" y="551" class="legend-text">Flu</text>
</svg>
