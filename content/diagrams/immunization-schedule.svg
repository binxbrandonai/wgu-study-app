<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      text { font-family: 'Inter', -apple-system, sans-serif; fill: #e2e8f5; }
      .title { font-size: 22px; font-weight: 700; fill: #00e5cc; }
      .subtitle { font-size: 12px; fill: #94a3b8; }
      .label { font-size: 10.5px; font-weight: 600; }
      .age-label { font-size: 9px; fill: #64748b; }
      .bar-text { font-size: 9px; fill: #050810; font-weight: 700; }
      .legend-text { font-size: 9px; fill: #94a3b8; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#050810" rx="0"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title" filter="url(#glow)">Childhood Immunization Schedule</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">CDC Recommended Schedule (Birth — 18 Years)</text>

  <!-- Age axis -->
  <text x="120" y="62" class="age-label">Age ▶</text>
  <text x="156" y="62" class="age-label">Birth</text>
  <text x="189" y="62" class="age-label">2mo</text>
  <text x="222" y="62" class="age-label">4mo</text>
  <text x="255" y="62" class="age-label">6mo</text>
  <text x="288" y="62" class="age-label">9mo</text>
  <text x="321" y="62" class="age-label">12mo</text>
  <text x="354" y="62" class="age-label">15mo</text>
  <text x="387" y="62" class="age-label">18mo</text>
  <text x="420" y="62" class="age-label">19-23mo</text>
  <text x="470" y="62" class="age-label">2-3yr</text>
  <text x="518" y="62" class="age-label">4-6yr</text>
  <text x="566" y="62" class="age-label">7-10yr</text>
  <text x="618" y="62" class="age-label">11-12yr</text>
  <text x="670" y="62" class="age-label">13-15yr</text>
  <text x="722" y="62" class="age-label">16-18yr</text>

  <!-- Grid lines -->
  <line x1="140" y1="60" x2="140" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="180" y1="60" x2="180" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="220" y1="60" x2="220" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="300" y1="60" x2="300" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="340" y1="60" x2="340" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="380" y1="60" x2="380" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="420" y1="60" x2="420" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="460" y1="60" x2="460" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="510" y1="60" x2="510" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="560" y1="60" x2="560" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="610" y1="60" x2="610" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="660" y1="60" x2="660" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="710" y1="60" x2="710" y2="560" stroke="#1e293b" stroke-width="1"/>
  <line x1="755" y1="60" x2="755" y2="560" stroke="#1e293b" stroke-width="1"/>

  <!-- Background banding for rows -->
  <rect x="20" y="67" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="123" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="179" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="235" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="291" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="347" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="403" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="459" width="760" height="28" fill="rgba(30,41,59,0.3)"/>
  <rect x="20" y="515" width="760" height="28" fill="rgba(30,41,59,0.3)"/>

  <!-- Row 1: HepB -->
  <text x="110" y="85" text-anchor="end" class="label" fill="#38bdf8">HepB</text>
  <rect x="145" y="72" width="32" height="18" rx="4" fill="#38bdf8"/>
  <rect x="185" y="72" width="75" height="18" rx="4" fill="#38bdf8" opacity="0.6"/>
  <text x="162" y="84" text-anchor="middle" class="bar-text" fill="#050810">1</text>
  <text x="222" y="84" text-anchor="middle" class="bar-text" fill="#050810" opacity="0.6">2-3</text>

  <!-- Row 2: RV -->
  <text x="110" y="113" text-anchor="end" class="label" fill="#22c55e">RV</text>
  <rect x="185" y="100" width="38" height="18" rx="4" fill="#22c55e"/>
  <rect x="225" y="100" width="38" height="18" rx="4" fill="#22c55e"/>
  <rect x="265" y="100" width="38" height="18" rx="4" fill="#22c55e"/>
  <text x="205" y="112" text-anchor="middle" class="bar-text" fill="#050810">1</text>
  <text x="245" y="112" text-anchor="middle" class="bar-text" fill="#050810">2</text>
  <text x="285" y="112" text-anchor="middle" class="bar-text" fill="#050810">3</text>

  <!-- Row 3: DTaP -->
  <text x="110" y="141" text-anchor="end" class="label" fill="#f5b731">DTaP</text>
  <rect x="185" y="128" width="38" height="18" rx="4" fill="#f5b731"/>
  <rect x="225" y="128" width="38" height="18" rx="4" fill="#f5b731"/>
  <rect x="265" y="128" width="38" height="18" rx="4" fill="#f5b731"/>
  <rect x="345" y="128" width="38" height="18" rx="4" fill="#f5b731"/>
  <rect x="513" y="128" width="48" height="18" rx="4" fill="#f5b731"/>
  <text x="205" y="140" text-anchor="middle" class="bar-text" fill="#050810">1</text>
  <text x="245" y="140" text-anchor="middle" class="bar-text" fill="#050810">2</text>
  <text x="285" y="140" text-anchor="middle" class="bar-text" fill="#050810">3</text>
  <text x="365" y="140" text-anchor="middle" class="bar-text" fill="#050810">4</text>
  <text x="538" y="140" text-anchor="middle" class="bar-text" fill="#050810">5</text>

