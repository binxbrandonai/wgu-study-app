  <text x="110" y="225" text-anchor="end" class="label" fill="#fb923c">PCV13</text>
  <rect x="185" y="212" width="38" height="18" rx="4" fill="#fb923c"/>
  <rect x="225" y="212" width="38" height="18" rx="4" fill="#fb923c"/>
  <rect x="265" y="212" width="38" height="18" rx="4" fill="#fb923c"/>
  <rect x="345" y="212" width="38" height="18" rx="4" fill="#fb923c"/>
  <text x="205" y="224" text-anchor="middle" class="bar-text" fill="#050810">1</text>
  <text x="245" y="224" text-anchor="middle" class="bar-text" fill="#050810">2</text>
  <text x="285" y="224" text-anchor="middle" class="bar-text" fill="#050810">3</text>
  <text x="365" y="224" text-anchor="middle" class="bar-text" fill="#050810">4</text>

