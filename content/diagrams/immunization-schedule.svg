  <text x="245" y="168" text-anchor="middle" class="bar-text" fill="#050810">2</text>
  <text x="365" y="168" text-anchor="middle" class="bar-text" fill="#050810">3</text>
  <text x="538" y="168" text-anchor="middle" class="bar-text" fill="#050810">4</text>

