<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-label { font-size: 12px; font-weight: 700; fill: white; }
      .box-text { font-size: 11px; fill: white; }
      .diamond-text { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .yes-no { font-size: 11px; font-weight: 700; fill: #64748b; }
      .step-text { font-size: 11px; fill: #1e293b; line-height: 1.5; }
      .note { font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="920" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="776" height="896" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" class="title">Anxiety Disorders — Clinical Algorithm</text>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#64748b">FNP D118 | Adult Primary Care</text>
  <line x1="40" y1="72" x2="760" y2="72" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Presentation -->
  <rect x="200" y="82" width="400" height="55" rx="10" fill="#1e40af"/>
  <text x="400" y="103" text-anchor="middle" class="box-label">ANXIETY PRESENTATION</text>
  <text x="400" y="119" text-anchor="middle" class="box-text">Excessive worry, panic attacks, avoidance, hypervigilance</text>
  <text x="400" y="134" text-anchor="middle" class="box-text">Somatic: palpitations, SOB, dizziness, GI distress, insomnia</text>

  <line x1="400" y1="137" x2="400" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rule out medical -->
  <polygon points="400,166 510,201 400,236 290,201" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" class="diamond-text">PRIMARY DISORDER?</text>
  <text x="400" y="211" text-anchor="middle" font-size="10" fill="#0369a1">Rule out medical causes</text>

  <!-- Medical mimics left -->
  <line x1="290" y1="201" x2="180" y2="201" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="193" text-anchor="middle" class="yes-no">RULE OUT</text>
  <rect x="30" y="185" width="150" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="105" y="203" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Medical mimics:</text>
  <text x="38" y="217" font-size="9" fill="#991b1b">Hyperthyroid, hypoglycemia</text>
  <text x="38" y="230" font-size="9" fill="#991b1b">MVP, arrhythmia, asthma</text>
  <text x="38" y="243" font-size="9" fill="#991b1b">Substance-induced (caffeine, EtOH)</text>

  <line x1="400" y1="236" x2="400" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="418" y="256" class="yes-no">YES</text>

  <!-- GAD-7 -->
  <rect x="245" y="264" width="310" height="44" rx="10" fill="#0c4a6e"/>
  <text x="400" y="285" text-anchor="middle" class="box-label">GAD-7 ASSESSMENT</text>
  <text x="400" y="301" text-anchor="middle" class="box-text">Score &amp;ge;10 = moderate-severe anxiety</text>

  <line x1="400" y1="308" x2="400" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BRANCHING diamond -->
  <polygon points="400,338 520,373 400,408 280,373" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="367" text-anchor="middle" class="diamond-text">ANXIETY DISORDER</text>
  <text x="400" y="383" text-anchor="middle" font-size="10" fill="#92400e">Select diagnosis branch</text>

  <!-- ===== GAD BRANCH (left-most) ===== -->
  <line x1="280" y1="358" x2="160" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="346" text-anchor="middle" class="yes-no">GAD</text>

  <rect x="20" y="320" width="140" height="60" rx="8" fill="#065f46"/>
  <text x="90" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="white">GAD</text>
  <text x="28" y="353" font-size="9" fill="#a7f3d0">Worry &amp;ge;6 mo</text>
  <text x="28" y="365" font-size="9" fill="#a7f3d0">3&amp;plus; somatic symptoms</text>
  <text x="28" y="377" font-size="9" fill="#a7f3d0">Restless, fatigued</text>

  <line x1="90" y1="380" x2="90" y2="406" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="406" width="140" height="60" rx="8" fill="#0c4a6e"/>
  <text x="90" y="424" text-anchor="middle" font-size="10" font-weight="700" fill="#bae6fd">GAD TREATMENT</text>
  <text x="28" y="440" font-size="9" fill="#e0f2fe">SSRI/SNRI first-line</text>
  <text x="28" y="453" font-size="9" fill="#e0f2fe">Buspirone alternative</text>
  <text x="28" y="466" font-size="9" fill="#e0f2fe">Avoid long-term benzos</text>

  <!-- ===== PANIC BRANCH (mid-left) ===== -->
  <line x1="280" y1="373" x2="160" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="390" text-anchor="middle" class="yes-no">PANIC</text>

  <rect x="20" y="398" width="140" height="60" rx="8" fill="#065f46"/>
  <text x="90" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="white">PANIC DISORDER</text>
  <text x="28" y="432" font-size="9" fill="#a7f3d0">Unexpected attacks</text>
  <text x="28" y="444" font-size="9" fill="#a7f3d0">Anticipatory anxiety</text>
  <text x="28" y="456" font-size="9" fill="#a7f3d0">Agoraphobia common</text>

  <line x1="90" y1="458" x2="90" y2="484" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="484" width="140" height="60" rx="8" fill="#0c4a6e"/>
  <text x="90" y="502" text-anchor="middle" font-size="10" font-weight="700" fill="#bae6fd">PANIC TREATMENT</text>
  <text x="28" y="518" font-size="9" fill="#e0f2fe">SSRI &amp;plus; CBT</text>
  <text x="28" y="531" font-size="9" fill="#e0f2fe">Short-term benzo bridge</text>
  <text x="28" y="544" font-size="9" fill="#e0f2fe">Avoid chronic benzos</text>

  <!-- ===== PTSD BRANCH (mid-right) ===== -->
  <line x1="520" y1="358" x2="660" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="346" text-anchor="middle" class="yes-no">PTSD</text>

  <rect x="640" y="320" width="140" height="60" rx="8" fill="#065f46"/>
  <text x="710" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="white">PTSD</text>
  <text x="648" y="353" font-size="9" fill="#a7f3d0">Trauma &amp;plus; 4 clusters</text>
  <text x="648" y="365" font-size="9" fill="#a7f3d0">Intrusion/avoidance</text>
  <text x="648" y="377" font-size="9" fill="#a7f3d0">Neg.cog/hyperarousal &gt;1mo</text>

  <line x1="710" y1="380" x2="710" y2="406" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="406" width="140" height="60" rx="8" fill="#0c4a6e"/>
  <text x="710" y="424" text-anchor="middle" font-size="10" font-weight="700" fill="#bae6fd">PTSD TREATMENT</text>
  <text x="648" y="440" font-size="9" fill="#e0f2fe">Sertraline/Paroxetine</text>
  <text x="648" y="453" font-size="9" fill="#e0f2fe">FDA-approved</text>
  <text x="648" y="466" font-size="9" fill="#e0f2fe">Plus EMDR/CPT therapy</text>

  <line x1="710" y1="466" x2="710" y2="484" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="484" width="140" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="710" y="502" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Prazosin for nightmares</text>
  <text x="710" y="515" text-anchor="middle" font-size="9" fill="#991b1b">1-6mg qHS</text>

  <!-- ===== OCD BRANCH (right-most) ===== -->
  <line x1="520" y1="373" x2="660" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="390" text-anchor="middle" class="yes-no">OCD</text>

  <rect x="640" y="398" width="140" height="60" rx="8" fill="#065f46"/>
  <text x="710" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="white">OCD</text>
  <text x="648" y="432" font-size="9" fill="#a7f3d0">Obsessions &amp;plus;</text>
  <text x="648" y="444" font-size="9" fill="#a7f3d0">Compulsions &gt;1h/day</text>
  <text x="648" y="456" font-size="9" fill="#a7f3d0">Ego-dystonic</text>

  <line x1="710" y1="458" x2="710" y2="530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="530" width="140" height="60" rx="8" fill="#0c4a6e"/>
  <text x="710" y="548" text-anchor="middle" font-size="10" font-weight="700" fill="#bae6fd">OCD TREATMENT</text>
  <text x="648" y="564" font-size="9" fill="#e0f2fe">Fluoxetine or Fluvoxamine</text>
  <text x="648" y="577" font-size="9" fill="#e0f2fe">Higher SSRI doses than MDD</text>
  <text x="648" y="590" font-size="9" fill="#e0f2fe">Plus ERP therapy</text>

  <!-- Center flow arrow -->
  <line x1="160" y1="466" x2="160" y2="560" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="560" x2="400" y2="560" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="660" y1="466" x2="660" y2="560" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="560" x2="400" y2="560" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Common principles box -->
  <rect x="140" y="560" width="520" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="581" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">CORE PRINCIPLES — ALL ANXIETY DISORDERS</text>
  <line x1="160" y1="587" x2="640" y2="587" stroke="#86efac" stroke-width="1"/>
  <text x="250" y="603" text-anchor="middle" font-size="10" fill="#15803d">CBT = backbone therapy for all</text>
  <text x="250" y="618" text-anchor="middle" font-size="10" fill="#15803d">SSRI/SNRI first-line pharmacotherapy</text>
  <text x="550" y="603" text-anchor="middle" font-size="10" fill="#991b1b">Benzos = short-term bridge ONLY</text>
  <text x="550" y="618" text-anchor="middle" font-size="10" fill="#991b1b">High addiction &amp; tolerance risk</text>

  <!-- Arrow down -->
  <line x1="400" y1="630" x2="400" y2="658" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Benzo withdrawal box -->
  <rect x="130" y="658" width="540" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="676" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">⚠️ BENZODIAZEPINE WITHDRAWAL</text>
  <text x="400" y="692" text-anchor="middle" font-size="10" fill="#78350f">Taper slowly (reduce by 25% q2-4 wks) | Seizure risk if abrupt discontinuation</text>

  <!-- KEY MEMORY POINTS -->
  <rect x="30" y="726" width="740" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="744" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">KEY MEMORY POINTS</text>
  <text x="60" y="760" font-size="10" fill="#475569">🎯 GAD-7 &amp;ge;10 = moderate-severe; benzos = short-term bridge only</text>
  <text x="60" y="774" font-size="10" fill="#475569">🎯 PTSD: prazosin effective for nightmares; EMDR/CPT are evidence-based</text>
  <text x="400" y="760" font-size="10" fill="#475569">🎯 OCD needs higher SSRI doses than MDD; ERP therapy is essential</text>
  <text x="400" y="774" font-size="10" fill="#475569">🎯 CBT is backbone psychotherapy for ALL anxiety disorders</text>

</svg>
