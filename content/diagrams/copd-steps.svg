<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <!-- Arrowhead markers -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00e5cc"/>
    </marker>
    <!-- Glow filter -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#f5b731" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#020617"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="800" y2="500" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="400" y="32" text-anchor="middle" fill="#f5b731" font-size="22" font-weight="700" letter-spacing="1.5" filter="url(#glow-gold)">COPD MANAGEMENT ALGORITHM</text>
  <text x="400" y="50" text-anchor="middle" fill="#64748b" font-size="11" font-weight="400">GOLD Guidelines — Chronic Obstructive Pulmonary Disease</text>

  <!-- ===== ARROWS ===== -->

  <!-- Spirometry → Smoking -->
  <line x1="250" y1="110" x2="250" y2="137" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Smoking → ABCD -->
  <line x1="250" y1="180" x2="250" y2="207" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ABCD → branches -->
  <line x1="250" y1="270" x2="250" y2="295" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="295" x2="380" y2="295" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="295" x2="120" y2="307" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="295" x2="250" y2="307" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="295" x2="380" y2="307" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Group → Treatment arrows -->
  <line x1="120" y1="375" x2="120" y2="405" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="375" x2="250" y2="405" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="375" x2="380" y2="405" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Side connectors -->
  <line x1="420" y1="85" x2="530" y2="97" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="420" y1="242" x2="530" y2="217" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ===== MAIN FLOW BOXES ===== -->

  <!-- 1. Spirometry Box -->
  <g filter="url(#glow-blue)">
    <rect x="80" y="60" width="340" height="50" rx="8" fill="#0b0f1c" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="250" y="82" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Spirometry to Confirm Diagnosis</text>
  <text x="250" y="100" text-anchor="middle" fill="#94a3b8" font-size="12">FEV₁/FVC ratio &lt; 0.70 → COPD confirmed</text>

  <!-- 2. Smoking Cessation Banner -->
  <rect x="60" y="145" width="380" height="35" rx="8" fill="#0b0f1c" stroke="#00e5cc" stroke-width="1.5"/>
  <text x="250" y="167" text-anchor="middle" fill="#00e5cc" font-size="13" font-weight="600">🚭  Smoking Cessation — Reinforce at EVERY Step</text>

  <!-- 3. ABCD Assessment Box -->
  <g filter="url(#glow-gold)">
    <rect x="80" y="215" width="340" height="55" rx="8" fill="#0b0f1c" stroke="#f5b731" stroke-width="1.5"/>
  </g>
  <text x="250" y="238" text-anchor="middle" fill="#f5b731" font-size="14" font-weight="700">GOLD ABCD Assessment</text>
  <text x="250" y="258" text-anchor="middle" fill="#94a3b8" font-size="11">Symptom burden (mMRC / CAT) + Exacerbation history</text>

  <!-- ===== GROUP BOXES ===== -->

  <!-- Group A -->
  <rect x="60" y="310" width="120" height="65" rx="8" fill="#0b0f1c" stroke="#f5b731" stroke-width="1.5"/>
  <rect x="60" y="310" width="120" height="24" rx="8" fill="#f5b731" fill-opacity="0.1"/>
  <text x="120" y="327" text-anchor="middle" fill="#f5b731" font-size="13" font-weight="700">Group A</text>
  <text x="120" y="348" text-anchor="middle" fill="#cbd5e1" font-size="10">Low symptoms</text>
  <text x="120" y="364" text-anchor="middle" fill="#cbd5e1" font-size="10">Low risk</text>

  <!-- Group B -->
  <rect x="190" y="310" width="120" height="65" rx="8" fill="#0b0f1c" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="190" y="310" width="120" height="24" rx="8" fill="#38bdf8" fill-opacity="0.1"/>
  <text x="250" y="327" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Group B</text>
  <text x="250" y="348" text-anchor="middle" fill="#cbd5e1" font-size="10">More symptoms</text>
  <text x="250" y="364" text-anchor="middle" fill="#cbd5e1" font-size="10">Low risk</text>

  <!-- Group E -->
  <rect x="320" y="310" width="120" height="65" rx="8" fill="#0b0f1c" stroke="#ff4d6d" stroke-width="1.5"/>
  <rect x="320" y="310" width="120" height="24" rx="8" fill="#ff4d6d" fill-opacity="0.1"/>
  <text x="380" y="327" text-anchor="middle" fill="#ff4d6d" font-size="13" font-weight="700">Group E</text>
  <text x="380" y="348" text-anchor="middle" fill="#cbd5e1" font-size="10">Exacerbator</text>
  <text x="380" y="364" text-anchor="middle" fill="#cbd5e1" font-size="10">(≥2 moderate / 1 hospitalization)</text>

  <!-- ===== TREATMENT BOXES ===== -->

  <!-- Group A Treatment -->
  <rect x="60" y="410" width="120" height="55" rx="8" fill="#0b0f1c" stroke="#f5b731" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="120" y="435" text-anchor="middle" fill="#f5b731" font-size="11" font-weight="600">Bronchodilator</text>
  <text x="120" y="454" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">PRN</text>

  <!-- Group B Treatment -->
  <rect x="190" y="410" width="120" height="55" rx="8" fill="#0b0f1c" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="250" y="435" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">LAMA + LABA</text>
  <text x="250" y="454" text-anchor="middle" fill="#e2e8f0" font-size="10">Combination therapy</text>

  <!-- Group E Treatment -->
  <rect x="320" y="410" width="120" height="55" rx="8" fill="#0b0f1c" stroke="#ff4d6d" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="380" y="435" text-anchor="middle" fill="#ff4d6d" font-size="11" font-weight="600">LAMA + LABA + ICS</text>
  <text x="380" y="454" text-anchor="middle" fill="#e2e8f0" font-size="10">Triple therapy</text>

  <!-- ===== RIGHT PANEL ===== -->

  <!-- Exacerbation Management Box -->
  <rect x="540" y="70" width="230" height="100" rx="8" fill="#0b0f1c" stroke="#ff4d6d" stroke-width="1.5"/>
  <rect x="540" y="70" width="230" height="28" rx="8" fill="#ff4d6d" fill-opacity="0.15"/>
  <text x="655" y="89" text-anchor="middle" fill="#ff4d6d" font-size="13" font-weight="700">Exacerbation Management</text>
  <circle cx="555" cy="115" r="3" fill="#ff4d6d"/>
  <text x="562" y="119" fill="#cbd5e1" font-size="11">Bronchodilator escalation</text>
  <circle cx="555" cy="135" r="3" fill="#ff4d6d"/>
  <text x="562" y="139" fill="#cbd5e1" font-size="11">Oral Prednisone 40 mg × 5 d</text>
  <circle cx="555" cy="155" r="3" fill="#ff4d6d"/>
  <text x="562" y="159" fill="#cbd5e1" font-size="11">Antibiotics if purulent sputum</text>

  <!-- Vaccination Reminders Box -->
  <rect x="540" y="190" width="230" height="100" rx="8" fill="#0b0f1c" stroke="#00e5cc" stroke-width="1.5"/>
  <rect x="540" y="190" width="230" height="28" rx="8" fill="#00e5cc" fill-opacity="0.12"/>
  <text x="655" y="209" text-anchor="middle" fill="#00e5cc" font-size="13" font-weight="700">Vaccination Reminders</text>
  <circle cx="555" cy="235" r="3" fill="#00e5cc"/>
  <text x="562" y="239" fill="#cbd5e1" font-size="11">Influenza (annual)</text>
  <circle cx="555" cy="255" r="3" fill="#00e5cc"/>
  <text x="562" y="259" fill="#cbd5e1" font-size="11">Pneumococcal (PCV20 / PPSV23)</text>
  <circle cx="555" cy="275" r="3" fill="#00e5cc"/>
  <text x="562" y="279" fill="#cbd5e1" font-size="11">COVID-19 (per guidelines)</text>

  <!-- ===== BOTTOM NOTES ===== -->

  <!-- Pill reminder bar -->
  <rect x="180" y="505" width="440" height="28" rx="14" fill="#0b0f1c" stroke="#334155" stroke-width="1"/>
  <text x="400" y="524" text-anchor="middle" fill="#64748b" font-size="10">Assess inhaler technique • Consider pulmonary rehab • Evaluate for LTOT • Follow-up in 4–12 weeks</text>

  <!-- Legend -->
  <rect x="250" y="548" width="300" height="38" rx="6" fill="#0b0f1c" stroke="#334155" stroke-width="0.5"/>
  <rect x="262" y="556" width="10" height="10" rx="2" fill="#0b0f1c" stroke="#38bdf8" stroke-width="1"/>
  <text x="278" y="565" fill="#94a3b8" font-size="9">Diagnosis</text>
  <rect x="338" y="556" width="10" height="10" rx="2" fill="#f5b731" fill-opacity="0.3" stroke="#f5b731" stroke-width="1"/>
  <text x="354" y="565" fill="#94a3b8" font-size="9">Assessment</text>
  <rect x="424" y="556" width="10" height="10" rx="2" fill="#ff4d6d" fill-opacity="0.3" stroke="#ff4d6d" stroke-width="1"/>
  <text x="440" y="565" fill="#94a3b8" font-size="9">Treatment</text>
  <rect x="500" y="556" width="10" height="10" rx="2" fill="#0b0f1c" stroke="#00e5cc" stroke-width="1"/>
  <text x="516" y="565" fill="#94a3b8" font-size="9">Prevention</text>

</svg>
