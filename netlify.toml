[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/content/diagrams/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Payhip product files — downloadable with no-cache to ensure customers get latest
[[headers]]
  for = "/payhip-products/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
