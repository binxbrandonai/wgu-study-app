<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNP Study — Learn Mode 📚</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050810; --bg2: #0b0f1c; --bg3: #111827; --bg4: #1a2133;
  --teal: #00e5cc; --teal-dim: #00a896;
  --gold: #f5b731; --gold-dim: #c4901a;
  --red: #ff4d6d; --purple: #a78bfa; --green: #4ade80;
  --blue: #38bdf8; --orange: #fb923c; --pink: #f472b6;
  --text: #e2e8f5; --text-dim: #5a6a8a; --text-mid: #8a9bc0;
  --border: rgba(255,255,255,0.055);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated background */
.bg-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
}
.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  animation: orb-drift 25s ease-in-out infinite alternate;
}
.bg-orb.o1 { width:600px;height:600px;top:-150px;left:-150px;background:rgba(0,229,204,0.08);animation-delay:0s; }
.bg-orb.o2 { width:700px;height:700px;bottom:-200px;right:-150px;background:rgba(167,139,250,0.06);animation-delay:-9s; }
.bg-orb.o3 { width:400px;height:400px;top:45%;left:45%;background:rgba(245,183,49,0.05);animation-delay:-15s; }
@keyframes orb-drift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(60px,40px) scale(1.15); }
  100% { transform: translate(-30px,70px) scale(0.9); }
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(5,8,16,0.92);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
}
.header-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.logo {
  font-size: 20px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--teal) 0%, var(--purple) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.back-link {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: color 0.2s;
}
.back-link:hover { color: var(--teal); }

/* Main */
.main {
  position: relative;
  z-index: 1;
  padding: 24px 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* ===== BROWSER VIEW ===== */
.browser-view { display: block; }
.browser-view.hidden { display: none; }

/* Class Tabs */
.class-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.class-tab {
  padding: 12px 24px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 12px 12px 0 0;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-dim);
  background: transparent;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
  position: relative;
  bottom: -1px;
}
.class-tab:hover {
  color: var(--text);
  background: var(--bg3);
}
.class-tab.active {
  color: var(--teal);
  background: var(--bg2);
  border-color: var(--border);
  border-bottom-color: var(--bg2);
}
.class-tab-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 800;
  vertical-align: middle;
}

/* Page Title */
.page-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.page-subtitle {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 24px;
}
.page-subtitle span {
  background: linear-gradient(135deg, var(--teal), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Topic Grid */
.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}
.topic-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}
.topic-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--teal), var(--purple));
  opacity: 0;
  transition: opacity 0.3s;
}
.topic-card:hover {
  transform: translateY(-4px);
  border-color: rgba(0,229,204,0.3);
  box-shadow: 0 8px 32px rgba(0,229,204,0.12);
}
.topic-card:hover::before {
  opacity: 1;
}
.topic-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.topic-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.topic-status {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.2px;
  padding: 4px 10px;
  border-radius: 20px;
  text-transform: uppercase;
}
.topic-status.ready {
  background: rgba(0,229,204,0.12);
  color: var(--teal);
  border: 1px solid rgba(0,229,204,0.3);
}
.topic-status.building {
  background: rgba(245,183,49,0.12);
  color: var(--gold);
  border: 1px solid rgba(245,183,49,0.3);
}
.topic-name {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 6px;
  line-height: 1.3;
}
.topic-system {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.topic-meta {
  display: flex;
  gap: 16px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--text-dim);
}
.topic-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.topic-objectives {
  list-style: none;
  margin-bottom: 16px;
}
.topic-objectives li {
  font-size: 12px;
  color: var(--text-mid);
  padding: 3px 0;
  padding-left: 16px;
  position: relative;
}
.topic-objectives li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--teal);
}
.topic-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--teal), var(--blue));
  color: white;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.topic-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,229,204,0.3);
}
.topic-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  background: var(--bg3);
  color: var(--text-dim);
}

/* Video section */
.video-section {
  margin: 24px 0 32px;
}
.video-section-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--teal);
  margin-bottom: 16px;
}
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px;
}
.video-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.video-card:hover {
  border-color: rgba(0,229,204,0.3);
}
.video-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
}
.video-source {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.video-duration {
  font-size: 11px;
  color: var(--text-dim);
}
.video-wrapper {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  background: #000;
}
.video-wrapper iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
}
.video-title {
  font-size: 13px;
  font-weight: 600;
  padding: 10px 14px 14px;
  color: var(--text-mid);
  line-height: 1.4;
}
.quiz-topic-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,229,204,0.3);
}

/* Progress bar on lesson view */
.progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--teal), var(--blue));
  z-index: 300;
  transition: width 0.3s;
}

/* ===== LESSON VIEW ===== */
.lesson-view { display: none; }
.lesson-view.active { display: block; }

.lesson-header {
  margin-bottom: 40px;
}
.lesson-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  background: none;
  border: none;
  font-family: 'Inter', sans-serif;
  transition: color 0.2s;
}
.lesson-back-btn:hover {
  color: var(--teal);
}
.lesson-title {
  font-size: 36px;
  font-weight: 900;
  margin-bottom: 12px;
}
.lesson-meta {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  color: var(--text-dim);
  font-size: 14px;
}
.lesson-meta span {
  background: var(--bg3);
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.objectives {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 40px;
}
.objectives h3 {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 16px;
}
.objectives ul { list-style: none; }
.objectives li {
  padding: 8px 0;
  padding-left: 28px;
  position: relative;
}
.objectives li:before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--teal);
  font-weight: 900;
}

.lesson-section {
  margin-bottom: 48px;
}
.section-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-number {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--blue));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  color: white;
  flex-shrink: 0;
}
.content-chunk {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 24px;
}
.chunk-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}
.story {
  border-left: 4px solid var(--teal);
  padding-left: 20px;
  font-style: italic;
  color: var(--text-dim);
}
.visual-placeholder {
  background: var(--bg3);
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 32px;
  text-align: center;
  margin: 24px 0;
  color: var(--text-dim);
}
.mnemonic {
  background: linear-gradient(135deg, rgba(245,183,49,0.1), rgba(245,183,49,0.05));
  border: 1px solid rgba(245,183,49,0.3);
  border-radius: 12px;
  padding: 20px;
  margin: 24px 0;
}
.mnemonic-label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}
.clinical-pearl {
  background: linear-gradient(135deg, rgba(0,229,204,0.12), rgba(0,229,204,0.04));
  border-left: 4px solid var(--teal);
  padding: 20px;
  margin: 24px 0;
  border-radius: 8px;
}
.pearl-label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 8px;
}
.red-flag {
  background: linear-gradient(135deg, rgba(255,77,109,0.1), rgba(255,77,109,0.05));
  border-left: 4px solid var(--red);
  padding: 20px;
  margin: 24px 0;
  border-radius: 8px;
}
.red-flag-label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 8px;
}
.checklist {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin: 24px 0;
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
  font-size: 14px;
}
.checklist-bullet {
  color: var(--teal);
  font-weight: 900;
  flex-shrink: 0;
}
.quick-check {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin: 24px 0;
}
.check-question {
  font-weight: 700;
  margin-bottom: 16px;
  font-size: 16px;
}
.check-answers {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}
.check-answer {
  background: var(--bg2);
  border: 2px solid var(--border);
  padding: 14px 18px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.check-answer:hover {
  border-color: var(--teal);
  transform: translateX(4px);
}
.check-answer.correct {
  border-color: var(--green);
  background: rgba(74,222,128,0.15);
}
.check-answer.incorrect {
  border-color: var(--red);
  background: rgba(255,77,109,0.15);
}
.check-explanation {
  display: none;
  background: var(--bg2);
  padding: 16px;
  border-radius: 8px;
  border-left: 3px solid var(--teal);
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.6;
}
.check-explanation.show { display: block; }
.check-explanation.wrong { border-left-color: var(--red); }

/* Content text */
.content-text p { margin-bottom: 12px; line-height: 1.8; }
.content-text strong { color: var(--text); font-weight: 700; }
.content-text ul, .content-text ol { padding-left: 20px; margin-bottom: 12px; }
.content-text li { margin-bottom: 6px; }
.content-text code { background: var(--bg3); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-state-icon { font-size: 64px; margin-bottom: 16px; }
.empty-state-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.empty-state-desc { font-size: 14px; line-height: 1.6; max-width: 400px; margin: 0 auto; }

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--bg3);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 500;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Responsive */
@media (max-width: 768px) {
  .topic-grid { grid-template-columns: 1fr; }
  .lesson-title { font-size: 26px; }
  .class-tabs { overflow-x: auto; }
  .class-tab { white-space: nowrap; padding: 10px 16px; font-size: 13px; }
}
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>
</div>

<div class="progress-bar" id="progress-bar" style="width:0%"></div>

<div class="header">
  <div class="header-content">
    <div class="header-left" style="display:flex;align-items:center;gap:16px">
      <div class="logo">FNP Study 3.0 — Learn Mode</div>
      <div class="streak-display" id="header-streak" style="font-size:13px;font-weight:700;color:var(--gold);background:rgba(245,183,49,0.12);padding:4px 12px;border-radius:20px;border:1px solid rgba(245,183,49,0.3)">
        🔥 <span id="header-streak-count">0</span>-day streak
      </div>
    </div>
    <a href="/index.html" class="back-link">← Back to Study</a>
  </div>
</div>

<div class="main">

  <!-- ===== BROWSER VIEW ===== -->
  <div class="browser-view" id="browser-view">
    <div class="page-title">📚 Lesson Browser</div>
    <div class="page-subtitle">Choose a <span>Topic</span> to Study</div>

    <!-- Class Tabs -->
    <div class="class-tabs" id="class-tabs"></div>

    <!-- Progress Stats -->
    <div class="progress-stats" id="progress-stats" style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;">
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <span id="stat-topics" style="color:var(--text-mid)">📚 Topics: <strong style="color:var(--teal)">0/0</strong></span>
        <span id="stat-lessons" style="color:var(--text-mid)">📝 Lessons: <strong style="color:var(--teal)">0/0</strong></span>
        <span id="stat-streak" style="color:var(--text-mid)">🔥 Streak: <strong style="color:var(--gold)">0 days</strong></span>
      </div>
      <button class="progress-btn" onclick="showProgressModal()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s" onmouseover="this.style.borderColor='var(--teal)'" onmouseout="this.style.borderColor='var(--border)'">
        📊 My Progress
      </button>
    </div>

    <!-- Topic Grid -->
    <div id="topic-grid-container">
      <div class="loading" id="topic-loading">
        <div class="loading-spinner"></div>
        Loading topics...
      </div>
    </div>
  </div>

  <!-- ===== LESSON VIEW ===== -->
  <div class="lesson-view" id="lesson-view">
    <button class="lesson-back-btn" onclick="showBrowser()">← Back to Topics</button>
    <div id="lesson-container"></div>
  </div>

</div>

<!-- Progress Modal -->
<div class="modal-overlay" id="progress-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;" onclick="if(event.target===this)hideProgressModal()">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:32px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <div style="font-size:20px;font-weight:800;">📊 My Progress</div>
      <button onclick="hideProgressModal()" style="background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;">✕</button>
    </div>
    <div id="modal-progress-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
const CLASS_CONFIG = {
  d118: { title: 'D118', name: 'Adult Primary Care', icon: '👨‍⚕️', color: 'var(--teal)', topicsFile: '/content/d118-topics.json' },
  d119: { title: 'D119', name: 'Pediatric Primary Care', icon: '🧒', color: 'var(--blue)', topicsFile: '/content/d119-topics.json' },
  d120: { title: 'D120', name: 'Special Populations', icon: '👴', color: 'var(--purple)', topicsFile: '/content/d120-topics.json' }
};

let currentClass = 'd118';
let topicCache = {};

// ===== INIT =====
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get('id');
  const classParam = params.get('class');

  if (lessonId) {
    // Direct lesson load (backward compat)
    const detectedClass = detectClass(lessonId);
    await loadTopicData(detectedClass);
    renderTabs(detectedClass);
    loadLesson(lessonId);
    return;
  }

  if (classParam && CLASS_CONFIG[classParam]) {
    currentClass = classParam;
  }

  await loadTopicData(currentClass);
  renderTabs(currentClass);
  renderTopicGrid(currentClass);
});

function detectClass(lessonId) {
  if (lessonId.startsWith('d118')) return 'd118';
  if (lessonId.startsWith('d119') || lessonId.startsWith('dev-') || lessonId.startsWith('immun') || 
      lessonId.startsWith('well-') || lessonId.startsWith('fever') || lessonId.startsWith('resp') ||
      lessonId.startsWith('newborn') || lessonId.startsWith('adhd')) return 'd119';
  return 'd118';
}

// ===== DATA LOADING =====
async function loadTopicData(classId) {
  const config = CLASS_CONFIG[classId];
  if (!config || !config.topicsFile) {
    topicCache[classId] = { topics: [] };
    return;
  }
  if (topicCache[classId]) return;
  
  try {
    const res = await fetch(config.topicsFile);
    const data = await res.json();
    topicCache[classId] = data;
  } catch (e) {
    console.error(`Failed to load topics for ${classId}:`, e);
    topicCache[classId] = { topics: [] };
  }
}

async function loadLessonData(lessonId) {
  try {
    const res = await fetch(`/content/${lessonId}.json`);
    const data = await res.json();
    return data.topic || data;
  } catch (e) {
    console.error('Failed to load lesson:', e);
    return null;
  }
}

// ===== TABS =====
function renderTabs(activeId) {
  const container = document.getElementById('class-tabs');
  container.innerHTML = Object.entries(CLASS_CONFIG).map(([id, cfg]) => {
    const topics = topicCache[id]?.topics || [];
    const ready = topics.filter(t => t.lessons_available).length;
    const active = id === activeId ? 'active' : '';
    const badgeStyle = id === 'd118' ? 'background:rgba(0,229,204,0.15);color:var(--teal)' :
                        id === 'd119' ? 'background:rgba(56,189,248,0.15);color:var(--blue)' :
                        'background:rgba(167,139,250,0.15);color:var(--purple)';
    return `<button class="class-tab ${active}" onclick="switchClass('${id}')">
      ${cfg.title} ${cfg.name}
      <span class="class-tab-badge" style="${badgeStyle}">${ready} topics</span>
    </button>`;
  }).join('');
}

function switchClass(classId) {
  currentClass = classId;
  document.getElementById('browser-view').classList.remove('hidden');
  document.getElementById('lesson-view').classList.remove('active');
  
  const container = document.getElementById('topic-grid-container');
  container.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Loading topics...</div>`;
  
  loadTopicData(classId).then(() => {
    renderTabs(classId);
    renderTopicGrid(classId);
  });
  
  // Update URL
  const url = new URL(window.location);
  url.searchParams.set('class', classId);
  url.searchParams.delete('id');
  window.history.replaceState({}, '', url);
}

// ===== TOPIC GRID =====
function renderTopicGrid(classId) {
  const container = document.getElementById('topic-grid-container');
  const data = topicCache[classId];
  
  if (!data || !data.topics || data.topics.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📚</div>
        <div class="empty-state-title">No lessons yet</div>
        <div class="empty-state-desc">Lessons for ${CLASS_CONFIG[classId].name} are being built. Check back soon!</div>
      </div>`;
    return;
  }

  const gridHTML = data.topics.map(topic => {
    const statusClass = topic.lessons_available ? 'ready' : 'building';
    const statusText = topic.lessons_available ? 'Ready' : 'Building';
    const color = topic.color || 'var(--teal)';
    
    return `<div class="topic-card" onclick="${topic.lessons_available ? `loadLesson('${topic.id}')` : ''}">
      <div class="topic-card-header">
        <div class="topic-icon" style="background:rgba(0,0,0,0.3);border:1px solid ${color}20">
          ${topic.icon || '📖'}
        </div>
        <div class="topic-status ${statusClass}">${statusText}</div>
      </div>
      <div class="topic-name">${topic.name}</div>
      <div class="topic-system">${topic.system}</div>
      <div class="topic-meta">
        <span>⏱ ${topic.duration_min} min</span>
        <span>📝 ${topic.lessons_available ? '3 lessons' : 'Coming soon'}</span>
      </div>
      <ul class="topic-objectives">
        ${topic.objectives.slice(0, 2).map(o => `<li>${o}</li>`).join('')}
      </ul>
      <button class="topic-btn" ${topic.lessons_available ? '' : 'disabled'}>
        ${topic.lessons_available ? '📖 Start Learning' : '🔨 In Progress'}
      </button>

  container.innerHTML = `<div class="topic-grid">${gridHTML}</div>`;
}

// ===== LESSON VIEW =====
async function loadLesson(lessonId) {
  document.getElementById('browser-view').classList.add('hidden');
  document.getElementById('lesson-view').classList.add('active');
  
  const container = document.getElementById('lesson-container');
  container.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Loading lesson...</div>`;
  
  const topic = await loadLessonData(lessonId);
  if (!topic) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">⚠️</div>
      <div class="empty-state-title">Lesson not found</div>
      <div class="empty-state-desc">Couldn't load this lesson. It may still be under construction.</div>
    </div>`;
    return;
  }

  // Update URL
  const url = new URL(window.location);
  url.searchParams.set('id', lessonId);
  window.history.replaceState({}, '', url);

  // Build objectives
  const objectivesHTML = topic.objectives && topic.objectives.length ? `
    <div class="objectives">
      <h3>🎯 What You'll Learn</h3>
      <ul>${topic.objectives.map(o => `<li>${o}</li>`).join('')}</ul>
    </div>` : '';

  // Build lessons
  const lessonsArray = topic.lessons || [];
  const sectionsHTML = lessonsArray.map((lesson, idx) => {
    const chunks = (lesson.content_chunks || []).map(chunk => renderChunk(chunk)).join('');
    const checks = (lesson.quick_checks || []).map((check, cIdx) => renderQuickCheck(check, idx, cIdx)).join('');
    const mnemonics = (lesson.mnemonics || []).map(m => renderMnemonic(m)).join('');
    const pearls = (lesson.clinical_pearls || []).map(p => renderPearl(p)).join('');
    const redFlags = (lesson.red_flags || []).map(r => renderRedFlag(r)).join('');
    const storyIntro = lesson.story_intro ? 
      `<div class="content-chunk"><div class="story">${formatContent(typeof lesson.story_intro === 'string' ? lesson.story_intro : (lesson.story_intro.text || ''))}</div>${lesson.story_intro.visual_cue ? `<div class="visual-placeholder">📊 ${escapeHtml(lesson.story_intro.visual_cue)}</div>` : ''}</div>` : '';
    
    return `
      <div class="lesson-section">
        <div class="section-title">
          <div class="section-number">${idx + 1}</div>
          <div>${lesson.title || lesson.story_intro?.substring(0, 50) || `Part ${idx + 1}`}</div>
        </div>
        ${storyIntro}
        ${chunks}
        ${mnemonics}
        ${pearls}
        ${redFlags}
        ${checks}
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-title">${topic.icon || ''} ${topic.name}</div>
      <div class="lesson-meta">
        <span>${topic.system || ''}</span>
        <span>⏱ ${topic.duration_min || '?'} minutes</span>
        <span>📝 ${lessonsArray.length} sections</span>
      </div>
    </div>
    ${topic.videos ? renderVideos(topic.videos) : ''}
    ${objectivesHTML}
    ${sectionsHTML}
    <div style="text-align:center;margin:48px 0 24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="lesson-back-btn" onclick="showBrowser()" style="display:inline-flex;font-size:14px;padding:12px 24px;background:var(--bg3);border:1px solid var(--border);border-radius:12px">
        ← Back to All Topics
      </button>
      <button class="quiz-topic-btn" onclick="window.location.href='/index.html?class=${currentClass}&topic=${encodeURIComponent(topic.name)}&lesson=${lessonId}'" style="display:inline-flex;font-size:14px;padding:12px 24px;background:linear-gradient(135deg,var(--teal),var(--blue));color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s">
        🧪 Quiz Me on This Topic
      </button>
    </div>`;

  // Scroll progress
  window.addEventListener('scroll', updateProgress);
  updateProgress();

  // Bind quick check events
  document.querySelectorAll('.check-answer').forEach(el => {
    el.addEventListener('click', function() {
      const checkId = this.dataset.check;
      const answerIdx = parseInt(this.dataset.answer);
      const correctIdx = parseInt(this.dataset.correct);
      
      document.querySelectorAll(`[data-check="${checkId}"]`).forEach(a => {
        a.classList.remove('correct', 'incorrect');
      });
      
      if (answerIdx === correctIdx) {
        this.classList.add('correct');
        showToast('✅ Correct!');
      } else {
        this.classList.add('incorrect');
        document.querySelector(`[data-check="${checkId}"][data-answer="${correctIdx}"]`).classList.add('correct');
        showToast('📚 Keep studying — review the explanation');
      }
      
      const exp = document.getElementById(`exp-${checkId}`);
      if (exp) exp.classList.add('show');
    });
  });
  
  // Render diagrams for visual placeholders
  renderDiagrams(topic.id);
}

// ===== DIAGRAM RESOLVER =====
// Maps topic IDs and keywords to diagram filenames
const DIAGRAM_MAP = {
  'd118-cv-htn': 'htn-algorithm.svg',
  'd118-msk-oa': 'arthritis-decision.svg',
  'd118-resp-asthma': 'asthma-steps.svg',
  'd118-cv-chf': 'hfref-algorithm.svg',
  'd118-endo-dm2': 'diabetes-algorithm.svg',
  'd118-endo-thyroid': 'thyroid-algorithm.svg',
  'd118-resp-copd': 'copd-steps.svg',
  'd118-neuro-stroke': 'stroke-algorithm.svg',
  'd118-infx-uti': 'uti-algorithm.svg',
  'd120-womens-health': 'contraception-decision.svg',
  'immunizations': 'immunization-schedule.svg',
  'dev-milestones-infant': 'pediatric-milestones-timeline.svg',
  'dev-milestones-toddler': 'pediatric-milestones-timeline.svg',
  'respiratory-infections': 'pediatric-respiratory-distress.svg',
  'adhd': 'pediatric-adhd-algorithm.svg',
};

// Keyword-based fallback mapping
const DIAGRAM_KEYWORDS = [
  { match: /htn|hypertension|blood pressure|stage 1|stage 2/i, file: 'htn-algorithm.svg' },
  { match: /oa vs ra|osteoarthritis|rheumatoid|gout|joint pain|arthritis/i, file: 'arthritis-decision.svg' },
  { match: /asthma|step.up|step.up|saba|ics.laba|smart therapy/i, file: 'asthma-steps.svg' },
  { match: /hfref|heart failure|grdmt|quadruple|ace.i|arni|sglt2|beta blocker|mra/i, file: 'hfref-algorithm.svg' },
  { match: /contraception|larc|iud|nexplanon|estrogen|birth control/i, file: 'contraception-decision.svg' },
  { match: /immunization|vaccine|vaccination|hepB|dtap|mmr|schedule/i, file: 'immunization-schedule.svg' },
  { match: /pediatric milestone|development|gross motor|fine motor|pincer|head control|crawl|walk/i, file: 'pediatric-milestones-timeline.svg' },
  { match: /croup|epiglottitis|bronchiolitis|rsv|stridor|respiratory distress|wheezing|barking cough/i, file: 'pediatric-respiratory-distress.svg' },
  { match: /adhd|attention deficit|hyperactivity|methylphenidate|inattention/i, file: 'pediatric-adhd-algorithm.svg' },
  { match: /pediatric immunization|childhood vaccine|vaccine schedule/i, file: 'pediatric-immunization-schedule.svg' },
];

function resolveDiagramForTopic(topicId, placeholderText) {
  // 1. Direct topic ID match
  if (DIAGRAM_MAP[topicId]) return DIAGRAM_MAP[topicId];
  
  // 2. Keyword match against the placeholder text
  for (const entry of DIAGRAM_KEYWORDS) {
    if (entry.match.test(placeholderText)) return entry.file;
  }
  
  return null;
}

function renderDiagrams(topicId) {
  document.querySelectorAll('.visual-placeholder').forEach(el => {
    const originalText = el.textContent.replace('📊', '').trim();
    const diagramFile = resolveDiagramForTopic(topicId, originalText);
    
    if (diagramFile) {
      el.innerHTML = `<img src="/content/diagrams/${diagramFile}" alt="${escapeHtml(originalText)}" style="max-width:100%;border-radius:12px;border:1px solid var(--border);display:block">`;
    }
  });
}

// ===== CHUNK RENDERERS =====
function renderChunk(chunk) {
  if (!chunk) return '';
  
  // Detect D119 format (has 'concept' key instead of 'type')
  if (chunk.concept && !chunk.type) {
    return renderD119Chunk(chunk);
  }
  
  const type = chunk.type || 'text';
  const title = chunk.title ? `<div class="chunk-title">${escapeHtml(chunk.title)}</div>` : '';
  const content = chunk.content ? formatContent(chunk.content) : '';

  switch (type) {
    case 'story':
      return `<div class="content-chunk">${title}<div class="story">${content}</div>${chunk.visual_desc ? `<div class="visual-placeholder">📊 ${escapeHtml(chunk.visual_desc)}</div>` : ''}</div>`;
    
    case 'mnemonic':
      return `<div class="content-chunk mnemonic"><div class="mnemonic-label">💡 Memory Trick</div>${title}${content}</div>`;
    
    case 'clinical_pearl':
      return `<div class="content-chunk clinical-pearl"><div class="pearl-label">🔥 Clinical Pearl</div>${title}${content}</div>`;
    
    case 'red_flag':
      return `<div class="content-chunk red-flag"><div class="red-flag-label">🚨 Red Flag</div>${title}${content}</div>`;
    
    case 'protocol':
    case 'checklist':
      return `<div class="content-chunk checklist">${title}<div class="checklist">${renderChecklist(content)}</div></div>`;
    
    case 'definition':
    default:
      return `<div class="content-chunk">${title}<div class="content-text">${content}</div></div>`;
  }
}

function renderD119Chunk(chunk) {
  let html = `<div class="content-chunk">`;
  html += `<div class="chunk-title">${escapeHtml(chunk.concept || '')}</div>`;
  
  if (chunk.visual_description) {
    html += `<div class="visual-placeholder">📊 ${escapeHtml(chunk.visual_description)}</div>`;
  }
  
  if (chunk.details) {
    const detailsText = Array.isArray(chunk.details) ? chunk.details.join('\n') : chunk.details;
    html += `<div class="content-text">${formatContent(detailsText)}</div>`;
  }
  
  if (chunk.mnemonic) {
    html += `<div class="mnemonic" style="margin-top:16px"><div class="mnemonic-label">💡 Memory Trick</div>${formatContent(chunk.mnemonic)}</div>`;
  }
  
  if (chunk.clinical_pearl) {
    html += `<div class="clinical-pearl" style="margin-top:16px"><div class="pearl-label">🔥 Clinical Pearl</div>${formatContent(chunk.clinical_pearl)}</div>`;
  }
  
  html += `</div>`;
  return html;
}

function renderChecklist(content) {
  const items = content.split('\n').filter(l => l.trim());
  return items.map(item => {
    const clean = item.replace(/^[•\-\d\.\s]+/, '').trim();
    if (!clean) return '';
    return `<div class="checklist-item"><span class="checklist-bullet">›</span><span>${clean}</span></div>`;
  }).join('');
}

function renderMnemonic(m) {
  if (typeof m === 'string') {
    return `<div class="content-chunk mnemonic"><div class="mnemonic-label">💡 Memory Trick</div>${formatContent(m)}</div>`;
  }
  return `<div class="content-chunk mnemonic"><div class="mnemonic-label">💡 Memory Trick</div>${formatContent(m.text || m.content || '')}</div>`;
}

function renderPearl(p) {
  if (typeof p === 'string') {
    return `<div class="content-chunk clinical-pearl"><div class="pearl-label">🔥 Clinical Pearl</div>${formatContent(p)}</div>`;
  }
  return `<div class="content-chunk clinical-pearl"><div class="pearl-label">🔥 Clinical Pearl</div>${formatContent(p.text || p.content || '')}</div>`;
}

function renderRedFlag(r) {
  if (typeof r === 'string') {
    return `<div class="content-chunk red-flag"><div class="red-flag-label">🚨 Red Flag</div>${formatContent(r)}</div>`;
  }
  return `<div class="content-chunk red-flag"><div class="red-flag-label">🚨 Red Flag</div>${formatContent(r.text || r.content || '')}</div>`;
}

function renderQuickCheck(check, lessonIdx, checkIdx) {
  const id = `qc-${lessonIdx}-${checkIdx}`;
  const answers = (check.answers || check.options || check.a || []).map((ans, aIdx) => 
    `<div class="check-answer" data-check="${id}" data-answer="${aIdx}" data-correct="${check.correct || check.answer || 0}">${escapeHtml(ans)}</div>`
  ).join('');
  
  return `<div class="quick-check">
    <div class="check-question">${check.question || check.q || ''}</div>
    <div class="check-answers">${answers}</div>
    <div class="check-explanation" id="exp-${id}">${formatContent(check.explanation || check.rationale || check.exp || '')}</div>
  </div>`;
}

function showBrowser() {

  document.getElementById('lesson-view').classList.remove('active');

  url.searchParams.delete('id');

function renderVideos(videos) {
  if (!videos || !videos.length) return '';
  const cards = videos.map(v => `
    <div class="video-card">
      <div class="video-card-header">
        <span class="video-source" style="background:${v.source === 'Ninja Nerd' ? 'rgba(0,229,204,0.15)' : 'rgba(167,139,250,0.15)'};color:${v.source === 'Ninja Nerd' ? 'var(--teal)' : 'var(--purple)'}">${v.source}</span>
        <span class="video-duration">${v.duration || ''}</span>
      </div>
      <div class="video-wrapper">

function getYoutubeId(url) {
  const match = url.match(/(?:v=|\\/|youtu\\.be\\/)([\\w-]{11})(?:[?&]|$)/);
  return match ? match[1] : '';
}

function formatContent(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/•/g, '<br>•');
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function updateProgress() {
  const scrolled = window.scrollY;
  const height = document.documentElement.scrollHeight - window.innerHeight;
  const progress = height > 0 ? (scrolled / height) * 100 : 0;
  const bar = document.getElementById('progress-bar');
  if (bar) bar.style.width = progress + '%';
}

let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== LESSON PROGRESS TRACKING =====

function getProgress() {
  const saved = localStorage.getItem('fnp_lesson_progress');
  if (saved) {
    try { return JSON.parse(saved); }
    catch(e) { return {}; }
  }
  return {};
}

function saveProgress(progress) {
  localStorage.setItem('fnp_lesson_progress', JSON.stringify(progress));
}

function getStreak() {
  const saved = localStorage.getItem('fnp_streak');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      const lastDate = new Date(data.lastDate);
      const now = new Date();
      const hoursDiff = (now - lastDate) / (1000 * 60 * 60);
      if (hoursDiff > 48) {
        return { count: 0, lastDate: now.toISOString() };
      }
      return data;
    } catch(e) {
      return { count: 0, lastDate: new Date().toISOString() };
    }
  }
  return { count: 0, lastDate: new Date().toISOString() };
}

function saveStreak(streak) {
  localStorage.setItem('fnp_streak', JSON.stringify(streak));
}

function updateStreak() {
  const streak = getStreak();
  streak.count++;
  streak.lastDate = new Date().toISOString();
  saveStreak(streak);
  updateHeaderStreak();
  return streak;
}

function updateHeaderStreak() {
  const streak = getStreak();
  const el = document.getElementById('header-streak-count');
  if (el) el.textContent = streak.count;
}

function markLessonComplete(topicId, lessonId) {
  const progress = getProgress();
  const lessonFullId = topicId + '--' + lessonId;
  
  if (!progress[topicId]) {
    progress[topicId] = { completed: [], lastStudied: null };
  }
  
  if (!progress[topicId].completed.includes(lessonFullId)) {
    progress[topicId].completed.push(lessonFullId);
  }
  progress[topicId].lastStudied = new Date().toISOString();
  
  saveProgress(progress);
  updateStreak();
  updateProgressStats();
  showToast('✅ Lesson completed!');
  
  // If we're still on the browser view, re-render to show updated checkmarks
  if (!document.getElementById('lesson-view').classList.contains('active')) {
    renderTopicGrid(currentClass);
  }
}

function isLessonComplete(topicId, lessonId) {
  const progress = getProgress();
  const lessonFullId = topicId + '--' + lessonId;
  return progress[topicId] && progress[topicId].completed.includes(lessonFullId);
}

async function getTopicProgressSummary(classId) {
  const data = topicCache[classId];
  if (!data || !data.topics) return { totalTopics: 0, completedTopics: 0, totalLessons: 0, completedLessons: 0, topicProgress: [] };
  
  const progress = getProgress();
  let totalTopics = data.topics.filter(t => t.lessons_available).length;
  let completedTopics = 0;
  let totalLessons = 0;
  let completedLessons = 0;
  let topicProgressList = [];
  
  for (const topic of data.topics) {
    if (!topic.lessons_available) continue;
    
    // Load topic content to get lesson IDs
    let lessonIds = [];
    try {
      // Check if we already loaded this topic's content
      const topicData = await loadLessonData(topic.id);
      if (topicData && topicData.lessons) {
        lessonIds = topicData.lessons.map(l => topic.id + '--' + l.id);
      }
    } catch(e) {
      // If we can't load, skip this topic
      continue;
    }
    
    totalLessons += lessonIds.length;
    const topicProg = progress[topic.id];
    const completedInTopic = topicProg ? lessonIds.filter(id => topicProg.completed.includes(id)).length : 0;
    completedLessons += completedInTopic;
    
    if (lessonIds.length > 0 && completedInTopic === lessonIds.length) {
      completedTopics++;
    }
    
    topicProgressList.push({
      id: topic.id,
      name: topic.name,
      icon: topic.icon || '📖',
      total: lessonIds.length,
      done: completedInTopic,
      notStarted: completedInTopic === 0
    });
  }
  
  return { totalTopics, completedTopics, totalLessons, completedLessons, topicProgress: topicProgressList };
}

async function updateProgressStats() {
  const classIds = Object.keys(CLASS_CONFIG);
  let grandTopics = 0, grandCompletedTopics = 0;
  let grandLessons = 0, grandCompletedLessons = 0;
  
  for (const classId of classIds) {
    const summary = await getTopicProgressSummary(classId);
    grandTopics += summary.totalTopics;
    grandCompletedTopics += summary.completedTopics;
    grandLessons += summary.totalLessons;
    grandCompletedLessons += summary.completedLessons;
  }
  
  const streak = getStreak();
  
  const topicsEl = document.getElementById('stat-topics');
  const lessonsEl = document.getElementById('stat-lessons');
  const streakEl = document.getElementById('stat-streak');
  
  if (topicsEl) topicsEl.innerHTML = `📚 Topics: <strong style="color:var(--teal)">${grandCompletedTopics}/${grandTopics}</strong>`;
  if (lessonsEl) lessonsEl.innerHTML = `📝 Lessons: <strong style="color:var(--teal)">${grandCompletedLessons}/${grandLessons}</strong>`;
  if (streakEl) streakEl.innerHTML = `🔥 Streak: <strong style="color:var(--gold)">${streak.count} days</strong>`;
}

async function showProgressModal() {
  const modal = document.getElementById('progress-modal');
  const content = document.getElementById('modal-progress-content');
  const streak = getStreak();
  
  let html = `<div style="margin-bottom:20px;padding:16px;background:var(--bg3);border-radius:12px;">
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">📊 Overall Progress</div>
    <div id="modal-overall-stats">Loading...</div>
  </div>`;
  
  for (const [classId, cfg] of Object.entries(CLASS_CONFIG)) {
    const summary = await getTopicProgressSummary(classId);
    const colorMap = { d118: 'var(--teal)', d119: 'var(--blue)', d120: 'var(--purple)' };
    const color = colorMap[classId] || 'var(--teal)';
    
    html += `<div style="margin-bottom:12px;padding:16px;background:var(--bg3);border-radius:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;color:${color}">${cfg.icon} ${cfg.title} — ${cfg.name}</div>
      <div style="font-size:12px;color:var(--text-mid);margin-bottom:8px;">
        Topics: <strong style="color:var(--teal)">${summary.completedTopics}/${summary.totalTopics}</strong>
        · Lessons: <strong style="color:var(--teal)">${summary.completedLessons}/${summary.totalLessons}</strong>
      </div>`;
    
    // Show weak areas (not started topics)
    const notStarted = summary.topicProgress.filter(t => t.done === 0);
    if (notStarted.length > 0) {
      html += `<div style="font-size:11px;color:var(--text-dim);margin-top:6px;">❌ Not started: ${notStarted.map(t => t.icon + ' ' + t.name).join(', ')}</div>`;
    }
    
    // Per-topic progress
    for (const tp of summary.topicProgress) {
      const pct = tp.total > 0 ? Math.round(tp.done / tp.total * 100) : 0;
      html += `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;">
        <span>${tp.icon}</span>
        <span style="flex:1;color:var(--text-mid)">${tp.name}</span>
        <span style="color:${pct === 100 ? 'var(--green)' : 'var(--text-dim)'}">${tp.done}/${tp.total}</span>
      </div>`;
    }
    
    html += `</div>`;
  }
  
  // Last studied
  const progress = getProgress();
  let lastStudied = 'Never';
  let lastTime = 0;
  for (const [topicId, data] of Object.entries(progress)) {
    if (data.lastStudied) {
      const t = new Date(data.lastStudied).getTime();
      if (t > lastTime) {
        lastTime = t;
        lastStudied = new Date(t).toLocaleString(undefined, {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      }
    }
  }
  
  html = html.replace('Loading...', 
    `<div style="display:flex;gap:16px;flex-wrap:wrap;">
      <span>🔥 Streak: <strong style="color:var(--gold)">${streak.count} days</strong></span>
      <span>🕐 Last studied: <strong>${lastStudied}</strong></span>
    </div>`
  );
  
  content.innerHTML = html;
  modal.style.display = 'flex';
}

function hideProgressModal() {
  document.getElementById('progress-modal').style.display = 'none';
}

// ===== PATCHED RENDER TOPIC GRID (with progress) =====
renderTopicGrid = async function(classId) {
  const container = document.getElementById('topic-grid-container');
  const data = topicCache[classId];
  
  if (!data || !data.topics || data.topics.length === 0) {
    container.innerHTML = `
      <div class=\"empty-state\">
        <div class=\"empty-state-icon\">📚</div>
        <div class=\"empty-state-title\">No lessons yet</div>
        <div class=\"empty-state-desc\">Lessons for ${CLASS_CONFIG[classId].name} are being built. Check back soon!</div>
      </div>`;
    return;
  }

  // Load progress
  const progress = getProgress();
  
  // Build topic progress data
  const topicProgressMap = {};
  for (const topic of data.topics) {
    if (!topic.lessons_available) continue;
    const topicProg = progress[topic.id];
    const doneCount = topicProg ? topicProg.completed.length : 0;
    // Each topic has 3 lessons
    const totalLessons = 3;
    topicProgressMap[topic.id] = { done: doneCount, total: totalLessons, pct: Math.round(doneCount / totalLessons * 100) };
  }

  const gridHTML = data.topics.map(topic => {
    const statusClass = topic.lessons_available ? 'ready' : 'building';
    const statusText = topic.lessons_available ? 'Ready' : 'Building';
    const color = topic.color || 'var(--teal)';
    
    const tp = topicProgressMap[topic.id];
    const allDone = tp && tp.done >= tp.total;
    const someDone = tp && tp.done > 0;
    const pct = tp ? tp.pct : 0;
    
    return `<div class=\"topic-card\" onclick=\"${topic.lessons_available ? `loadLesson('${topic.id}')` : ''}\" style="position:relative;overflow:hidden;">
      ${allDone ? `<div style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(74,222,128,0.2);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;">✅</div>` : ''}
      ${someDone && !allDone ? `<div style="position:absolute;top:8px;right:8px;background:rgba(0,229,204,0.15);border:1px solid rgba(0,229,204,0.3);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--teal);z-index:2;">${tp.done}/${tp.total}</div>` : ''}
      <div class="topic-card-header">
        <div class="topic-icon" style="background:rgba(0,0,0,0.3);border:1px solid ${color}20">
          ${topic.icon || '📖'}
        </div>
        <div class="topic-status ${statusClass}">${statusText}</div>
      </div>
      <div class="topic-name">${topic.name}</div>
      <div class="topic-system">${topic.system}</div>
      <div class="topic-meta">
        <span>⏱ ${topic.duration_min} min</span>
        <span>📝 ${topic.lessons_available ? '3 lessons' : 'Coming soon'}</span>
      </div>
      ${someDone ? `<div style="height:4px;background:var(--bg3);border-radius:2px;margin-bottom:12px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:2px;transition:width 0.3s;"></div></div>` : ''}
      <ul class="topic-objectives">
        ${topic.objectives.slice(0, 2).map(o => `<li>${o}</li>`).join('')}
      </ul>
      <button class="topic-btn" ${topic.lessons_available ? '' : 'disabled'}>
        ${allDone ? '✅ Review Completed' : (topic.lessons_available ? '📖 Start Learning' : '🔨 In Progress')}
      </button>
    </div>`;
  }).join('');

  container.innerHTML = `<div class=\"topic-grid\">${gridHTML}</div>`;
};

// ===== PATCHED LOAD LESSON (with mark-complete button) =====
loadLesson = async function(lessonId) {
  // Show lesson view
  document.getElementById('browser-view').classList.add('hidden');
  document.getElementById('lesson-view').classList.add('active');
  
  const container = document.getElementById('lesson-container');
  container.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Loading lesson...</div>`;
  
  const topic = await loadLessonData(lessonId);
  if (!topic) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">⚠️</div>
      <div class="empty-state-title">Lesson not found</div>
      <div class="empty-state-desc">Couldn't load this lesson. It may still be under construction.</div>
    </div>`;
    return;
  }

  // Update URL
  const url = new URL(window.location);
  url.searchParams.set('id', lessonId);
  window.history.replaceState({}, '', url);

  // Build objectives
  const objectivesHTML = topic.objectives && topic.objectives.length ? `
    <div class="objectives">
      <h3>🎯 What You'll Learn</h3>
      <ul>${topic.objectives.map(o => `<li>${o}</li>`).join('')}</ul>
    </div>` : '';

  // Build lessons
  const lessonsArray = topic.lessons || [];
  const sectionsHTML = lessonsArray.map((lesson, idx) => {
    const chunks = (lesson.content_chunks || []).map(chunk => renderChunk(chunk)).join('');
    const checks = (lesson.quick_checks || []).map((check, cIdx) => renderQuickCheck(check, idx, cIdx)).join('');
    const mnemonics = (lesson.mnemonics || []).map(m => renderMnemonic(m)).join('');
    const pearls = (lesson.clinical_pearls || []).map(p => renderPearl(p)).join('');
    const redFlags = (lesson.red_flags || []).map(r => renderRedFlag(r)).join('');
    const storyIntro = lesson.story_intro ? 
      `<div class="content-chunk"><div class="story">${formatContent(typeof lesson.story_intro === 'string' ? lesson.story_intro : (lesson.story_intro.text || ''))}</div>${lesson.story_intro.visual_cue ? `<div class="visual-placeholder">📊 ${escapeHtml(lesson.story_intro.visual_cue)}</div>` : ''}</div>` : '';
    
    const isComplete = isLessonComplete(lessonId, lesson.id);
    
    return `
      <div class="lesson-section" data-lesson-id="${lesson.id}">
        <div class="section-title">
          <div class="section-number">${idx + 1}</div>
          <div>${lesson.title || lesson.story_intro?.substring(0, 50) || `Part ${idx + 1}`} ${isComplete ? '<span style="font-size:14px;color:var(--green)">✅</span>' : ''}</div>
        </div>
        ${storyIntro}
        ${chunks}
        ${mnemonics}
        ${pearls}
        ${redFlags}
        ${checks}
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-title">${topic.icon || ''} ${topic.name}</div>
      <div class="lesson-meta">
        <span>${topic.system || ''}</span>
        <span>⏱ ${topic.duration_min || '?'} minutes</span>
        <span>📝 ${lessonsArray.length} sections</span>
      </div>
    </div>
    ${objectivesHTML}
    ${sectionsHTML}
    <div style="text-align:center;margin:48px 0 24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="lesson-back-btn" onclick="showBrowser()" style="display:inline-flex;font-size:14px;padding:12px 24px;background:var(--bg3);border:1px solid var(--border);border-radius:12px">
        ← Back to All Topics
      </button>
      <button class="quiz-topic-btn" onclick="window.location.href='/index.html?class=${currentClass}&topic=${encodeURIComponent(topic.name)}&lesson=${lessonId}'" style="display:inline-flex;font-size:14px;padding:12px 24px;background:linear-gradient(135deg,var(--teal),var(--blue));color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s">
        🧪 Quiz Me on This Topic
      </button>
    </div>`;

  // Add mark-complete buttons for each lesson section
  lessonsArray.forEach((lesson, idx) => {
    const sectionEl = document.querySelector(`[data-lesson-id="${lesson.id}"]`);
    if (!sectionEl) return;
    
    const isComplete = isLessonComplete(lessonId, lesson.id);
    const btnDiv = document.createElement('div');
    btnDiv.style.cssText = 'text-align:center;margin:24px 0;';
    btnDiv.innerHTML = isComplete
      ? `<span style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(74,222,128,0.1);border:1px solid var(--green);border-radius:12px;font-size:13px;font-weight:700;color:var(--green);">✅ Completed!</span>`
      : `<button class="mark-complete-btn" data-topic="${lessonId}" data-lesson="${lesson.id}" style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(0,229,204,0.1);border:1px solid rgba(0,229,204,0.3);border-radius:12px;font-size:13px;font-weight:700;color:var(--teal);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;" onmouseover="this.style.background='rgba(0,229,204,0.2)'" onmouseout="this.style.background='rgba(0,229,204,0.1)'">
        ✅ Mark Lesson Complete
      </button>`;
    
    sectionEl.appendChild(btnDiv);
  });
  
  // Bind mark-complete buttons
  document.querySelectorAll('.mark-complete-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const topicId = this.dataset.topic;
      const lessonId = this.dataset.lesson;
      markLessonComplete(topicId, lessonId);
      this.outerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(74,222,128,0.1);border:1px solid var(--green);border-radius:12px;font-size:13px;font-weight:700;color:var(--green);">✅ Completed!</span>`;
    });
  });

  // Scroll progress
  window.addEventListener('scroll', updateProgress);
  updateProgress();

  // Bind quick check events
  document.querySelectorAll('.check-answer').forEach(el => {
    el.addEventListener('click', function() {
      const checkId = this.dataset.check;
      const answerIdx = parseInt(this.dataset.answer);
      const correctIdx = parseInt(this.dataset.correct);
      
      document.querySelectorAll(`[data-check="${checkId}"]`).forEach(a => {
        a.classList.remove('correct', 'incorrect');
      });
      
      if (answerIdx === correctIdx) {
        this.classList.add('correct');
        showToast('✅ Correct!');
      } else {
        this.classList.add('incorrect');
        document.querySelector(`[data-check="${checkId}"][data-answer="${correctIdx}"]`).classList.add('correct');
        showToast('📚 Keep studying — review the explanation');
      }
      
      const exp = document.getElementById(`exp-${checkId}`);
      if (exp) exp.classList.add('show');
    });
  });
  
  // Render diagrams for visual placeholders
  renderDiagrams(lessonId);
};

// ===== PATCHED SHOW BROWSER (re-render progress) =====
showBrowser = function() {
  document.getElementById('browser-view').classList.remove('hidden');
  document.getElementById('lesson-view').classList.remove('active');
  
  const url = new URL(window.location);
  url.searchParams.delete('id');
  url.searchParams.set('class', currentClass);
  window.history.replaceState({}, '', url);
  
  // Re-render with progress
  renderTopicGrid(currentClass);
};

// Init progress on page load
setTimeout(() => {
  updateHeaderStreak();
  updateProgressStats();
}, 500);
</script>
