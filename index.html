    `<strong>Pressure injuries — prevention and staging (NPUAP):</strong><br>• Risk assessment: Braden Scale (sensory perception, moisture, activity, mobility, nutrition, friction/shear — score ≤18 = at risk). Waterlow Scale. Assess on admission and q24h. HIGHEST RISK: immobility, incontinence, malnutrition, diabetes, neuropathy, advanced age, hip fracture, ICU stay, spinal cord injury<br>• Prevention: turn/reposition q2h (minimum) — use 30° lateral tilt (not 90°, which causes shear on the opposite hip). Pressure redistribution surfaces (low-air-loss mattress for high risk). Heel offloading — pillows/heel boots, never donut devices (cause venous congestion and edema). Nutrition: 30-35 kcal/kg/day, 1.25-1.5 g/kg protein, vitamin C 500mg BID + zinc 40mg daily for wound healing. Moisture barrier cream for incontinence<br>• Stage 1: non-blanchable erythema of intact skin. Stage 2: partial-thickness skin loss — shallow open ulcer with red/pink wound bed, no slough, or intact/ruptured serum-filled blister. Stage 3: full-thickness skin loss — subcutaneous fat visible, no bone/tendon/muscle exposed, possible slough but not obscuring depth. Stage 4: full-thickness tissue loss — bone, tendon, or muscle exposed. Unstageable: obscured full-thickness slough/eschar<br>• Wound care by stage: Stage 1: no debridement, transparent film dressing. Stage 2: hydrocolloid or foam dressing — no wet-to-dry (removes healthy tissue). Stage 3: alginate (for heavy exudate) or foam — may need sharp debridement of slough. Stage 4: surgical debridement often needed — collagen matrix, negative pressure wound therapy (NPWT) for deep wounds<br>• When to refer: Stage 3-4 → wound care specialist (multidisciplinary: plastics, infectious disease, nutritionist, OT/PT). Osteomyelitis: suspected if non-healing after 2wk of appropriate care, exposed bone, or CRP/ESR elevated — MRI or bone biopsy for confirmation. IV antibiotics for 6-8wk. Surgical resection of infected bone may be necessary`,
  ],
  'Infectious Disease': [
    `<strong>Community-acquired pneumonia (CAP) — IDSA/ATS guidelines:</strong><br>• Outpatient treatment: previously healthy, no antibiotics in past 3mo → amoxicillin 1g TID OR doxycycline 100mg BID OR macrolide (azithromycin 500mg day 1, then 250mg days 2-5) if local pneumococcal resistance <25%. Comorbidities (COPD, DM, CKD, CHF, asplenia, immunosuppression) OR recent abx → Augmentin or cephalosporin (cefpodoxime, cefuroxime) + macrolide (azithromycin) OR monotherapy with respiratory fluoroquinolone (levofloxacin 750mg or moxifloxacin 400mg)<br>• Severity scoring: CURB-65 (confusion, BUN >19, RR ≥30, BP <90/60, age ≥65) — score 0-1: outpatient, 2: admit, ≥3: severe (consider ICU). PSI/PORT score more sensitive but complex<br>• Sputum culture + blood cultures ×2 BEFORE antibiotics if admitted. Urinary antigen (Legionella + pneumococcus) — useful if severe CAP or outbreak concern<br>• Duration: minimum 5 days — discontinue when afebrile ×48h AND clinically stable (HR <100, RR <24, SBP >90, SpO2 ≥90%). Longer if cavitary, empyema, Legionella, severe necrotizing infection, or delayed response`,
    `<strong>Urinary tract infections — IDSA guidelines (2023):</strong><br>• Uncomplicated cystitis: TMP-SMX DS BID ×3 days (if local resistance <20%). Nitrofurantoin 100mg BID ×5 days (avoid if CrCl <30). Fosfomycin 3g single dose. Avoid fluoroquinolones as first-line (fluoroquinolone-sparing stewardship). Beta-lactams (cephalexin 500mg QID ×5-7 days) less effective<br>• Complicated UTI (male, pregnancy, catheter, recent instrumentation, abnormal anatomy, renal impairment): urine culture REQUIRED. Treat 7-14 days. TMP-SMX, ciprofloxacin, ceftriaxone, or ertapenem. Remove/replace catheter. Imaging (CT or ultrasound) if recurrent fevers or obstruction suspected<br>• Pyelonephritis: admit if unable to take PO, hemodynamic instability, severe pain, pregnancy, suspected obstruction, or complicated. Outpatient: ciprofloxacin 500mg BID ×7 days (if resistance <10%) OR levofloxacin 750mg ×5 days. Ceftriaxone 1g IM/IV ×1 then oral TMP-SMX or cipro. Inpatient: ceftriaxone 1g daily ×7-14 days. Alternative: cefepime, piperacillin-tazobactam, ertapenem. Blood cultures before antibiotics<br>• Asymptomatic bacteriuria: NO screening or treatment except in PREGNANCY (treat to prevent pyelonephritis/preterm labor — 3-7 day course) and prior to urologic procedures (mucosal bleeding expected). Do NOT treat in elderly, diabetics, catheterized patients, spinal cord injury. Overuse of antibiotics for ASB = major contributor to multidrug resistance<br>• Catheter-associated UTI (CAUTI): remove Foley if possible. Culture directed therapy. Start empiric: piperacillin-tazobactam, cefepime, or meropenem if recent abx exposure. Duration 7-14 days based on response`,
    `<strong>Sepsis and septic shock — Surviving Sepsis Campaign Hour-1 Bundle:</strong><br>• Recognition: qSOFA ≥2 (RR ≥22, altered mental status, SBP ≤100). Lactate — >2 mmol/L = tissue hypoperfusion, >4 = severe sepsis. Obtain blood cultures ×2 (aerobic + anaerobic) BEFORE abx, but DO NOT DELAY antibiotics for cultures<br>• Hour-1 bundle (ALL start within 1 hour of recognition): measure lactate (repeat if initial >2 within 2-4h). Obtain blood cultures. Start broad-spectrum antibiotics (vancomycin + piperacillin-tazobactam — most common; if MRSA risk, add vancomycin; if Pseudomonas risk, anti-pseudomonal beta-lactam). Begin 30 mL/kg crystalloid (balanced fluids: Lactated Ringer's or Plasma-Lyte preferred over NS — reduces mortality, hyperchloremic metabolic acidosis). Start vasopressors if MAP <65 after initial fluid bolus<br>• Specific populations: immunocompromised → consider antifungal (caspofungin). Neutropenia → cefepime + vancomycin. Hospital-acquired → broader gram-negative + MRSA coverage. Recent abdominal surgery → abdominal source (piperacillin-tazobactam or ertapenem)<br>• Fluid resuscitation: initial 30 mL/kg crystalloid within 3h. Dynamic assessment (passive leg raise, IVC collapsibility on ultrasound, stroke volume variation) to assess fluid responsiveness after initial bolus. CVP is NOT reliable for fluid management<br>• Vasopressors: norepinephrine is FIRST-LINE (titrate to MAP ≥65). Add vasopressin 0.03 U/min if norepinephrine >20-30 mcg/min. Epinephrine if norepinephrine + vasopressin inadequate. DOBUTAMINE for cardiac dysfunction (low cardiac output with adequate fluid and MAP)`,
    `<strong>Cellulitis and skin infections — IDSA guidelines:</strong><br>• Non-purulent cellulitis (no abscess): S. pyogenes (group A strep) most common. Tx: cephalexin 500mg QID ×5-7 days OR clindamycin 300-450mg TID ×5-7 days (better bioavail, covers MRSA less well). If beta-lactam allergy: clindamycin or doxycycline. Consider MRSA coverage if: known colonization, recurrent abscesses, purulent drainage, failed cephalosporin, severe infection<br>• Purulent cellulitis/abscess: MRSA suspected. I&D is PRIMARY treatment — antibiotics are adjunctive. Incise + drain all abscesses (ultrasound to confirm fluid). Culture pus. Abx: TMP-SMX DS BID (most evidence) OR doxycycline 100mg BID OR clindamycin 300-450mg TID. Duration: 5-7 days after I&D. If extensive: add cephalexin for strep coverage (TMP-SMX alone doesn't cover group A strep)<br>• Necrotizing fasciitis — SURGICAL EMERGENCY: pain out of proportion, rapid progression, systemic toxicity, crepitus, bullae, skin necrosis, gas on X-ray/CT. LRINEC score: CRP >150, WBC >15, Hb <11, Na <135, Cr >1.6, glucose >180. Score ≥6 = consider, ≥8 = strong predictor. Tx: IMMEDIATE surgical debridement (not "start abx and watch") — delay increases mortality. Empiric abx: vancomycin + piperacillin-tazobactam + clindamycin (for toxin suppression). Type I (polymicrobial): post-surgical, diabetics. Type II (GAS): young, healthy, extremity trauma. Type III (Vibrio): seawater, liver disease<br>• Diabetic foot infection: probe-to-bone test — 87% sensitive for osteomyelitis. Wound culture (deep tissue, not swab). X-ray for gas, foreign body, Charcot. Tx: mild (cellulitis + no bone involvement): oral amoxicillin/clavulanate OR clindamycin + cephalexin. Moderate (deep >2cm, abscess): IV ampicillin-sulbactam, ertapenem, or ceftriaxone + metronidazole. Severe (systemic toxicity, suspected OM): piperacillin-tazobactam or imipenem + vancomycin. Duration: cellulitis 7-14d, OM ≥6wk. Vascular assessment: ABI or toe pressures — revascularization if inadequate perfusion (wound unlikely to heal without blood flow)`,
    `<strong>Antimicrobial stewardship principles:</strong><br>• Start smart, then focus: 48-72h rule — check culture results and narrow/stop/de-escalate at 48-72 hours. Document indication, dose, duration, and stop/review date for ALL antibiotics. Never treat "positive cultures" from skin or respiratory specimens unless they correlate with clinical infection (colonization ≠ infection)<br>• Prophylaxis vs treatment: surgical prophylaxis (cefazolin within 60min of incision, single dose — redose if surgery >4h or blood loss >1500mL). Do NOT continue post-op antibiotics. Medical prophylaxis (UTI, endocarditis, neutropenia) — use narrowest spectrum, shortest appropriate duration<br>• Duration defaults: CAP 3-5 days, HCAP/HAP 7 days, UTI cystitis 3 days, pyelonephritis 5-7 days, intra-abdominal infection 4 days after source control, cellulitis 5-7 days, osteomyelitis 6-8wk IV then oral, endocarditis 4-6wk IV<br>• Resistance prevention: avoid fluoroquinolones (C. diff, tendon rupture, aortitis, mitochondrial toxicity, dysglycemia). Avoid cephalosporins for uncomplicated UTI. Minimize carbapenem use. Avoid prolonged therapy (most common driver of resistance is OVERUSE, not UNDERUSE). Check daily: "Can I stop or narrow this antibiotic?"<br>• MRSA/MSSA distinction: MSSA → cefazolin or nafcillin (superior to vancomycin for MSSA — better PK/PD, less nephrotoxic, lower mortality in MSSA bacteremia). Vancomycin: trough 15-20 for pneumonia (lung penetration 30%), 10-15 for other. Holding vancomycin for MRSA coverage unnecessary if MSSA confirmed — switch to cefazolin. Daptomycin NOT for pneumonia (inactivated by surfactant)`,
  ],
  'LGBTQIAP+': [
    `<strong>Affirming care — terminology and foundation:</strong> Use patient-identified name and pronouns (ask and document in chart — use pronouns field). Sexual orientation: identity + behavior (not the same — MSM may not identify as gay). Gender identity: internal sense of self (transgender = different from sex assigned at birth, non-binary = neither exclusively man nor woman). Gender expression: outward presentation (clothing, mannerisms, hairstyle). Use open-ended questions: "What name would you like me to use?" and "What pronouns do you use?" Never assume. Convert version — if you accidentally misgender, correct yourself briefly, don't over-apologize. Create a welcoming environment: inclusive forms (partner vs husband/wife), unisex restrooms, LGBTQ+ visible signage (safe zone stickers, rainbow flag), gender-neutral language, culturally appropriate intake forms.`,
    `<strong>Gender-affirming hormone therapy — transfeminine (estrogen + antiandrogen):</strong><br>• Estradiol: sublingual/buccal 2-4mg daily (split BID), increase q3-6mo to goal 4-8mg daily. Patches 0.1-0.2mg/24h BID change. Avoid oral ethinyl estradiol (VTE risk 4-5x higher vs bioidentical). Target E2 100-200 pg/mL, T <50 ng/dL<br>• Antiandrogen: spironolactone 50-200mg daily (start 50mg, titrate q4wk). SE: orthostasis, hyperkalemia, decreased libido. Alternatives: GnRH agonist (leuprolide) for adolescents. Bicalutamide 25-50mg (less hypotensive, can cause transaminitis)<br>• Expected changes: breast development (Tanner 2-3 within 3-6mo, full growth 2-3yr), decreased muscle mass, fat redistribution, decreased libido, decreased erections/testicular size, slowed facial/body hair growth (does NOT reverse — need laser/electrolysis for removal), emotional changes (range of emotion wider)<br>• Monitoring: E2 + T q3mo for year 1, then q6-12mo. BP, weight, metabolic panel (K+ with spironolactone), prolactin (if symptoms). Risk: VTE (2-3x background but lower than ethinyl estradiol era), CV events, gallstones, prolactinoma (rare)<br>• Surgical: vaginoplasty (penile inversion or sigmoid colon). Requires hair removal 6-8mo pre-op. Spiro 2-4wk before surgery if penile inversion. Post-op: lifelong self-dilation schedule, estrogen continues (do not stop)`,
    `<strong>Gender-affirming hormone therapy — transmasculine (testosterone):</strong><br>• Testosterone: IM cypionate/enanthate 50-100mg weekly (or 100-200mg q2wk). SQ 50-100mg weekly. Gel 1.62% 20.25-81mg daily (1-4 pumps). Starting dose: IM 50mg weekly or SQ 25-50mg weekly. Target T 400-800 ng/dL (cis-male mid-range)<br>• Changes: voice drop (3-6mo, irreversible after ~6mo), clitoral growth (1-3yr), increased muscle + decreased fat, facial/body hair growth, cessation of menses (most within 6mo), scalp hair loss (genetically determined), increased libido, libido generally highest first 3-6mo, acne (face, back, chest), emotional changes (some report difficulty crying, increased irritability — monitor for depression/aggression)<br>• Monitoring: T, Hb/Hct (polycythemia — if Hct >54%, reduce dose or phlebotomy), lipid panel (HDL decreases, LDL increases — net CVD effect unknown), BP, weight. First year q3mo, then q6-12mo<br>• Cancer screening: follow same guidelines as cisgender patients by organ present. Transmasculine patients with breasts need mammograms per breast cancer screening guidelines. Cervical cancer screening if cervix present. Transfeminine patients on estrogen ± antiandrogen: breast cancer screening per same guidelines as cisgender women (risk higher with longer duration HT, but absolute risk lower than cis women)<br>• Fertility preservation: counsel BEFORE starting hormones. Options: oocyte/embryo cryopreservation for transfeminine, sperm banking for transmasculine. Hormones reduce but do NOT eliminate fertility. Case reports of conception after months-years of T therapy. Must have clear conversation about "this is not reliable birth control"`,
    `<strong>Pre-exposure prophylaxis (PrEP) for HIV — CDC 2024 guidelines:</strong><br>• Indications: sexually active MSM at risk (condomless sex, STI in past 6mo, HIV+ partner, sex with partners of unknown status). Heterosexual patients with high-risk partner. PWID with shared injection equipment. ALL sexually active individuals at risk — not just MSM<br>• Oral PrEP: tenofovir disoproxil fumarate (TDF) 300mg + emtricitabine (FTC) 200mg daily (Truvada generic). For MSM: can use "2-1-1" dosing (2 tabs 2-24h before sex, 1 tab 24h after first dose, 1 tab 48h after first dose) — not for heterosexual or PWID. Tenofovir alafenamide (TAF) 25mg + FTC 200mg (Descovy) — less renal/bone toxicity than TDF, better for CrCl 30-60, NOT for receptive vaginal sex<br>• Injectable PrEP: cabotegravir (CAB LA/Apretude) 600mg IM — loading dose (2 injections 1mo apart), then q2mo. More effective than oral PrEP in MSM (0.41 vs 1.22 per 100 person-years), and in cisgender women. Side effects: injection site pain (most common), headache, nausea<br>• Monitoring: HIV test (4th gen antigen/antibody) BEFORE starting — do NOT start PrEP if HIV+ (can cause resistance). Cr + eGFR at baseline and q6mo (for TDF). STI screening (GC/CT, syphilis) q3mo. HIV test q3mo. Hep B serology (TDF/FTC treats HepB but can flare on discontinuation)<br>• Adherence counseling: "PrEP doesn't work if you don't take it." For oral TDF/FTC: max protection after 7 days of daily dosing (rectal), 21 days (vaginal, blood). Missed doses: take as soon as remembered unless within 4h of next dose — skip missed. More than 2 missed doses/week → suboptimal protection`,
    `<strong>STI screening in LGBTQ+ populations — CDC 2024:</strong><br>• MSM: urethral + pharyngeal + rectal GC/CT NAAT annually (or q3-6mo if high risk — multiple partners, group sex, substance use during sex, PrEP user). Syphilis serology q3-12mo. HIV q3-12mo (consider RNA PCR if high suspicion with negative 4th gen). Hep A + Hep B vaccination (if HAV/HBV-negative + MSM). HPV vaccination through age 45 (anal Pap if HIV+ or anal receptive with prior HPV)<br>• Transfeminine: same STI screening as MSM based on sexual behavior (anatomy-based screening: vaginal neovagina requires speculum exam for GC/CT if penile inversion, or swab if sigmoid). Syphilis q3-6mo if high risk. HIV q3-6mo. Specific: if post-vaginoplasty, neovaginal swab for GC/CT (sigmoid = self-collected, penile inversion = physician collected)<br>• Transmasculine: pregnancy test if amenorrheic + sexually active. Cervical screening if cervix present (can be painful on T — use smaller speculum, extra lubrication, patient-controlled insertion). Vaginal GC/CT if receptive vaginal sex. Urine GC/CT may be adequate for some. Urethral swab if phalloplasty/metoidioplasty<br>• Extra-genital screening: rectal and pharyngeal GC/CT — 50-70% of infections are extra-genital only (would be missed by urine alone). Most patients do NOT have symptoms of rectal/pharyngeal GC/CT. Self-collected rectal swabs are as sensitive as clinician-collected<br>• DoxyPEP: doxycycline 200mg within 72h of condomless sex (single dose). Reduces syphilis and chlamydia infection by 60-70% in MSM, no reduction in gonorrhea. For MSM with bacterial STI in past 12mo. Not recommended for cisgender women (no demonstrated benefit). CDC 2024 guidelines recommend discussing with STI patients. Resistance concern: tetracycline resistance in M. genitalium and S. aureus`,
  ],
  'MSK Pediatric': [
    `<strong>Limping child — approach to the limping child (age-based differential):</strong><br>• 1-3yr: toddler's fracture (tibia, occult — oblique spiral on tibia X-ray), septic arthritis (hip → most dangerous), DDH, foreign body in foot, insect bite/joint, transient synovitis<br>• 4-10yr: transient synovitis (hip — most common cause of acute hip pain), Legg-Calvé-Perthes (avascular necrosis femoral head, 4-8yr, M>F 4:1), septic arthritis, osteomyelitis, fracture, juvenile idiopathic arthritis (JIA)<br>• 11-16yr: slipped capital femoral epiphysis (SCFE — 10-16yr, M>F, obese, African American > Caucasian), sports injuries (fractures, sprains, Osgood-Schlatter, Sever disease), osteosarcoma/Ewing sarcoma (night pain, systemic symptoms)<br>• Red flags: fever (infection), refusal to bear weight (septic joint until proven otherwise), night pain/awakening from sleep (malignancy), constitutional symptoms (weight loss, night sweats = malignancy/TB), bilateral hip/knee pain (inflammatory arthritis)<br>• Septic arthritis vs transient synovitis: Kocher criteria — fever >38.5°C (1 pt), non-weight-bearing (1 pt), ESR >40 (1 pt), WBC >12,000 (1 pt). Score 0-1: <3% septic; 2: 40%; 3: 93%; 4: >99% septic probability. If ≥3: emergent orthopedic consult + joint aspiration (sensitivity 80-95%; Gram stain in 50%)`,
    `<strong>Septic arthritis and osteomyelitis — pediatric infectious disease emergency:</strong><br>• Septic arthritis: BACTERIAL INVASION of joint space. Hip most commonly affected in children <3yr (<strong>Kocher criteria above</strong>). Causative organisms: <3mo → S. agalactiae (GBS), E. coli, S. aureus; 3mo-3yr → S. aureus, Kingella kingae (growing importance — mild presentation, culture-negative but PCR positive); >3yr → S. aureus (MRSA increasing), S. pyogenes. Dx: joint aspiration for cell count, Gram stain, culture, PCR. Synovial WBC >50,000 = septic until proven otherwise. Tx: surgical I&D + IV antibiotics (vancomycin + ceftriaxone or cefazolin + clindamycin). Duration: 3-4wk IV then oral based on response<br>• Osteomyelitis: infection of bone — hematogenous seeding in children (metaphysis of long bones most common). Pathophysiology: sluggish blood flow in metaphyseal capillaries + trauma → bacterial seeding. Acute: fever, pain, refusal to use limb, localized tenderness/swelling, no erythema, pseudoparalysis. Dx: X-ray normal in first 7-10 days (late findings: periosteal reaction, lytic lesion, sequestrum). MRI with contrast is gold standard (sensitivity 90-98%, specificity 75-92%). Bone aspiration for culture<br>• Tx osteomyelitis: empiric IV antibiotics (clindamycin or cefazolin + gentamicin). MSSA: cefazolin/nafcillin. MRSA: vancomycin or clindamycin (if susceptible). If Kingella: ampicillin or cefuroxime. Transition to oral when afebrile, ESR/CRP trending down, and organism identified. Total duration: 4-6wk (IV 1-2wk → oral 2-4wk). Surgical: if subperiosteal abscess, sequestrum, or no clinical improvement within 48h of appropriate antibiotics<br>• Long-term monitoring: CRP normalizes in 7-10 days (good marker for response). ESR takes 4-6wk. X-ray changes persist 6-12mo. Late complications: growth disturbance (physis involvement), pathologic fracture, chronic recurrent multifocal osteomyelitis (CRMO) — autoimmune, sterile, multiple bones`,
    `<strong>Slipped capital femoral epiphysis (SCFE) — orthopedic urgency:</strong><br>• Presentation: adolescent (10-16yr) with acute or insidious hip/groin/thigh/knee pain (referred pain — 15% present with knee pain ONLY — ALWAYS examine the hip in adolescents with knee pain). Limp, external rotation of affected leg, decreased internal rotation, hip flexion causes obligatory external rotation (Drehmann sign). Bilateral in 20-40%<br>• Risk factors: OBESITY (90% of SCFE patients >95th percentile BMI), endocrine disorders (hypothyroidism most common, GH deficiency, growth hormone therapy, hypogonadism, hyperparathyroidism, renal osteodystrophy), previous slipped contralateral side<br>• Diagnosis: AP + frog-leg lateral hip X-ray — Klein line (line along superior femoral neck should intersect femoral head). In SCFE: femoral head is displaced medially/posteriorly relative to neck. "Ice cream falling off the cone." X-ray finding: widened physis, decreased epiphyseal height, metaphyseal blanch sign. Do NOT miss: frog-leg X-ray critical (AP alone misses 30% of mild slip)<br>• Classification: stable (can bear weight, with or without crutches — prognosis excellent, avascular necrosis rate <1%) vs unstable (cannot bear weight even with crutches — EMERGENCY, AVN rate 10-50%, needs immediate surgical pinning within 24h). Grading: mild (<30°), moderate (30-50°), severe (>50°)<br>• Management: STABLE → surgical pinning in situ (single cannulated screw across physis). UNSTABLE → emergent operative fixation (do NOT manipulate — increases AVN risk). Do NOT accept weight-bearing in unstable SCFE until surgically stabilized. Contralateral prophylactic pinning: consider if high risk (young age <10yr, low BMI, endocrine disorder, <7yr, or hip not visible on imaging)`,
    `<strong>Juvenile idiopathic arthritis (JIA) — classification and management:</strong><br>• Classification by subtype (ILAR criteria, ≥6wk of arthritis in child <16yr, exclude other causes): Oligoarticular (50%, ≤4 joints in first 6mo — highest risk for uveitis, ANA+ 80%). Polyarticular RF+ (5%, ≥5 joints, adolescent girls, rheumatoid factor +, erosive — resembles adult RA). Polyarticular RF− (15%, ≥5 joints). Systemic (10%, Still's disease — quotidian fever ×2wk + evanescent salmon-pink rash + arthritis + serositis; early in life 1-6yr). Enthesitis-related (10-15%, HLA-B27+, male > female, older child, enthesitis + sacroiliitis, acute anterior uveitis). Psoriatic (<5%, psoriasis + arthritis + dactylitis + nail pitting)<br>• Ocular involvement: chronic anterior uveitis — SILENT (redness, pain, photophobia are LATE — child may not report). Screen: oligoarticular and polyarticular RF− with ANA+ — screen q3mo for 4yr then q6mo. Systemic JIA — rarely uveitis. Onset: can precede arthritis by years. Irreversible: synechiae, band keratopathy, cataract, glaucoma, blindness<br>• First-line: NSAID (naproxen 10-20 mg/kg/day divided BID). Intra-articular corticosteroid injection (triamcinolone hexacetonide — lasts longer than acetonide) for oligoarthritis<br>• DMARDs: methotrexate 10-15 mg/m² SQ weekly (gold standard for polyarticular JIA). Folic acid supplementation. LEUCOVORIN rescue if oral ulceration or hepatotoxicity. Biologics: etanercept (TNFi — first biologic for polyarticular JIA, SQ weekly). Adalimumab (also treats uveitis). Tocilizumab (IL-6 inhibitor — for systemic JIA, dramatically effective for fever + inflammatory markers). Abatacept (CTLA4-Ig) for polyarticular JIA<br>• Systemic JIA macrophage activation syndrome (MAS) — LIFE THREATENING: persistent fever + hepatosplenomegaly + cytopenia + coagulopathy + hyperferritinemia. Triggers: infection, medication, active JIA. Tx: high-dose methylprednisolone 30 mg/kg/day ×3-5 days + cyclosporine + anakinra (IL-1 inhibitor). Mortality 8-20% despite treatment`,
    `<strong>Pediatric fractures — classification and management:</strong><br>• Greenstick (incomplete): cortex broken on tension side, intact on compression side. Most common in radius/ulna. Tx: cast ×4-6wk. Healing predictable<br>• Torus/buckle (compression): cortex bulges but not completely broken. Stable, low energy. Tx: removable splint ×3-4wk. NO need for rigid casting or orthopedic follow-up in most cases. Parent education on removal<br>• Plastic/bowing: bone bent without visible fracture. In children paired bones (radius/ulna, tibia/fibula) — one bent, one broken. Tx: reduction under sedation + casting. If >20° angulation → needs reduction<br>• Physeal (Salter-Harris classification): I (through physis, transverse) → usually good prognosis. II (through physis + metaphysis — most common 75%) → good. III (through physis + epiphysis) → requires perfect reduction (articular). IV (through all three: metaphysis + physis + epiphysis) → needs ORIF, risk of growth arrest. V (crush of physis) → worst prognosis, growth arrest nearly certain<br>• Growth plate considerations: children heal faster, remodel better, but growth arrest is permanent. Distal radius has excellent remodeling (1° per 2mo of growth remaining). Femur/tibia remodel less well. Displaced SH III-IV need ORIF. Follow-up: SH I-II: X-ray at 4-6mo to check for growth disturbance. SH III-V: X-ray at 3mo, 6mo, 12mo to monitor. Growth arrest line (Park-Harris line) parallel to physis → normal growth; if angulated → consider epiphysiodesis on opposite side`,
  ],
  'Menopause': [
    `<strong>Menopause diagnosis and staging — STRAW+10 criteria:</strong> Final menstrual period confirmed after 12 consecutive months of amenorrhea (no obvious cause). Average age: 51yr. Stages: reproductive (regular cycles), menopause transition/early perimenopause (variable cycles, >7-day change, elevated FSH, vasomotor symptoms), late perimenopause (≥60 days of amenorrhea, FSH >25, profound symptoms), postmenopause (early: first 1-2yr after FMP; late: >2yr). Premature menopause: <40yr — workup: FSH, estradiol, karyotype (Turner mosaicism, Fragile X premutation), anti-Müllerian hormone, thyroid, adrenal antibodies. POI (primary ovarian insufficiency) diagnosis: FSH >25 on two occasions >4wk apart. Bone density baseline for POI + hormone therapy until average age of menopause.`,
    `<strong>Vasomotor symptoms (VMS) — hot flashes and night sweats:</strong><br>• Epidemiology: 80% of women during menopause transition. Median duration: 7.4yr (12yr if first VMS in perimenopause). Frequency: daily to multiple/hour. Triggers: warm environment, hot drinks, spicy food, alcohol, stress, smoking. Impact: sleep disruption (most distressing), impaired QoL, cognitive fog, depression risk, work productivity loss<br>• Moderate-severe VMS (interfering with daily life): hormone therapy is FIRST-LINE and MOST EFFECTIVE (estrogen ± progestogen — reduces hot flashes 75-90%)<br>• Non-hormonal options: fezolinetant (NK3 receptor antagonist — first non-hormonal FDA-approved for moderate-severe VMS, 45mg daily, no cancer risk, no hormone contraindications). SSRI/SNRI (paroxetine 7.5mg — only SSRI FDA-approved; venlafaxine 37.5-75mg for sleep). Gabapentin 300-900mg nightly (especially effective for sleep-disrupting night sweats). Oxybutynin 2.5-5mg nightly (but anticholinergic — use with caution in older women, Beer's criteria). Cognitive behavioral therapy (CBT) — reduces bother even without reducing frequency. Clinical hypnosis — Level 1 evidence<br>• Lifestyle: layered clothing, cooling devices (fans, cooling pillows, neck fans), maintain healthy weight (obesity worsens VMS 2-3x). Avoid triggers. Soy/isoflavones: inconsistent evidence, modest benefit. Black cohosh: NOT effective (large RCT showed no benefit vs placebo). Vitamin E: maybe minimal effect. DO NOT recommend compounded bioidentical hormones — no regulatory oversight, no safety data`,
    `<strong>Menopausal hormone therapy (MHT) — prescribing principles (NAMS/IMS 2024):</strong><br>• Indications: moderate-severe VMS (most effective — 75-90% reduction), prevention of bone loss (if ≤60yr or <10yr postmenopause and high fracture risk and cannot take bisphosphonate), genitourinary syndrome of menopause (GSM — vaginal estrogen is first-line). NOT for cardiovascular prevention (WHI showed increased CHD if >10yr postmenopause or age >60, stroke risk, VTE risk)<br>• Estrogen options: oral 17β-estradiol (0.5-2mg daily) — increased VTE risk less than older conjugated equine estrogens. Transdermal estradiol (patch 0.025-0.1mg/24h, q3.5d or weekly) — preferred for many: NO INCREASED VTE risk (first-pass hepatic effect bypassed), lower stroke risk, better BP profile. Gel/spray/cream: daily application<br>• Progestogen: needed if uterus present (prevents endometrial hyperplasia/cancer — continuous = amenorrhea, cyclic = withdrawal bleed). Micronized progesterone 100-200mg daily — preferred (no increased breast cancer risk in EPT? Complex — WHI showed +0.08% absolute increase with CEE+MPA, less with bioidentical). Levonorgestrel IUD (Mirena, 5yr for endometrial protection) — excellent option for women needing both contraception + MHT<br>• Timing hypothesis: age <60 or <10yr from menopause → favorable risk-benefit (WHI reanalysis). Age >60 or >10yr from menopause → increased absolute risk of CVD, stroke, VTE, dementia. "Early initiation, lowest effective dose, shortest necessary duration" is NOT universally correct — many women need 5-10+ years (median duration 7yr). Reassess annually<br>• Contraindications: hx breast cancer (estrogen-sensitive), endometrial cancer (except low-risk early stage?), unexplained vaginal bleeding, hx VTE/PE (except transdermal — no increased risk per some data), hx stroke/TIA, active liver disease, porphyria. Migraine with aura: transdermal preferred (lower stroke risk than oral)`,
    `<strong>Genitourinary syndrome of menopause (GSM) — vaginal health:</strong><br>• Symptoms: vaginal dryness, burning, irritation, dyspareunia (most common — 50% of postmenopausal women affected), decreased lubrication, recurrent UTIs (GSM increases UTI risk 2-4x due to pH shift and loss of lactobacillus), urinary urgency/frequency, urinary incontinence. Symptoms are PROGRESSIVE and rarely resolve without treatment<br>• First-line: vaginal moisturizers (Replens, Hyalofemme — apply 2-3x/week, not just before sex) + vaginal lubricants (water-based, silicone-based for sex). OTC — no prescription needed. 30-50% of women improve with non-hormonal alone if GSM mild<br>• Vaginal estrogen: LOW DOSE — minimal systemic absorption (estradiol 10 mcg tablet, estradiol 7.5 mcg/2.5g cream twice weekly, estradiol ring 7.5 mcg/24h q3mo). Does NOT require progestogen (endometrial effects minimal). NO increased risk of VTE, breast cancer recurrence, or cardiovascular events at vaginal doses. Cannot base decisions on breast cancer fear — low risk. Continuous use: safety data for 1+ years. 3x/week maintenance after initial nightly ×2wk<br>• Ospemifene (SERM): 60mg daily — treats moderate-severe dyspareunia. Oral, non-hormonal. Works: improves vaginal pH, maturation index. Side effects: hot flashes (paradoxical), VTE risk (class effect, avoid high-risk women). SERM with estrogenic effect on vagina, anti-estrogenic on breast<br>• Dehydroepiandrosterone (DHEA/prasterone): 6.5mg vaginal insert daily — FDA-approved for moderate-severe dyspareunia. No systemic estrogen — estrogen and androgen produced locally. Lower estrogen levels than vaginal estradiol — option for breast cancer survivors. Safety data: does not increase serum estradiol above postmenopausal range. Insurance coverage varies`,
    `<strong>Bone health in menopause — prevention and treatment:</strong><br>• Screening: DEXA at menopause if risk factors (fragility fracture, parental hip fracture, smoking, BMI <21, alcohol >3 drinks/day, rheumatoid arthritis, early menopause/POI, chronic steroid use, secondary causes — hyperparathyroidism, Cushing's, malabsorption, type 1 DM, chronic liver disease, CKD, HIV). All women ≥65 regardless of risk factors<br>• Prevention: calcium 1200mg daily total (diet + supplement, max 500mg elemental per dose for absorption) + vitamin D 800-1000 IU daily. Weight-bearing exercise (walking, jogging, resistance training 2-3x/week — increases BMD 1-2% per year). Fall prevention. Avoid smoking, limit alcohol. Bisphosphonate if T ≤ -2.5 or prior fragility fracture or FRAX 10yr major fracture >20% or hip fracture >3%<br>• Bisphosphonates: alendronate 70mg weekly (first-line, most studied, PO). Risedronate 35mg weekly or 150mg monthly. Zoledronic acid 5mg IV yearly (no GI intolerance, good adherence, acute phase reaction first dose). Ibandronate 150mg monthly (less proven for non-vertebral fracture — consider second-line). Take with plain water on empty stomach, stay upright ≥30min, do not eat/drink/lie down. Duration: 3-5yr then drug holiday (atypical femur fracture risk after >5yr)<br>• Anabolic therapy (PTH analogs): teriparatide (Forteo) 20mcg SQ daily ×2yr max — for severe osteoporosis (T ≤ -3.5, or fracture on bisphosphonate, or multiple vertebral fractures). Follow with bisphosphonate to maintain gains (BMD increases 10-20% in spine). Romosozumab (Evenity, monoclonal antibody targeting sclerostin) 210mg SQ monthly ×1yr — both anabolic + antiresorptive, black box — increased CV events, do NOT use in patients with MI/stroke in past year<br>• Estrogen: prevents bone loss (BMD increases 3-5% over 3yr). FDA-indicated for osteoporosis prevention (not first-line for treatment unless concurrent VMS). Raloxifene (SERM): 60mg daily, reduces vertebral fracture 50% but NOT hip fracture, NO breast cancer risk reduction (actually reduces invasive breast cancer). Increased VTE risk similar to estrogen. NOT for premenopausal women. Denosumab (Prolia) 60mg SQ q6mo: potent antiresorptive, no renal adjustment, no osteonecrosis of jaw atypical femur fracture risk while on therapy. DO NOT STOP denosumab without transition to bisphosphonate — BMD loss + vertebral fracture risk increased on abrupt discontinuation`,
  ],
  'Obstetrics Antepartum': [
    `<strong>Prenatal care schedule (ACOG 2023):</strong> First visit 8-12wk (confirm dates, dating ultrasound, prenatal labs, risk assessment). q4wk until 28wk, q2wk until 36wk, then weekly until delivery. Total: 12-14 visits for uncomplicated pregnancy. Goal: detect and manage complications early, optimize maternal/fetal outcomes, provide education and support. First-trimester: dating ultrasound (crown-rump length best), cell-free DNA (cfDNA) for aneuploidy screening or NT ultrasound 11-14wk + serum markers. Second-trimester: anatomy scan 18-22wk, glucose tolerance test 24-28wk. Third-trimester: GBS screening 36-38wk, growth scans if risk factors. Immunizations: Tdap 27-36wk (each pregnancy), influenza (any trimester), RSV (32-36wk during RSV season).`,
    `<strong>Hypertension in pregnancy — classification (ACOG):</strong><br>• Chronic HTN: BP ≥140/90 before pregnancy or <20wk gestation. Treatment goal: 120-160/80-105 (strict BP control <140/90 reduces severe HTN but may impair fetal growth). Labetalol, nifedipine, methyldopa preferred. AVOID ACEi/ARB (fetal renal agenesis, oligohydramnios, skull ossification defects)<br>• Gestational hypertension: BP ≥140/90 after 20wk without proteinuria or end-organ damage. Manage as preeclampsia — 25% progress to preeclampsia. Monitor BP, urine protein, symptoms weekly. Deliver at 37wk if stable, earlier if severe<br>• Preeclampsia: BP ≥140/90 + proteinuria (≥300mg/24h or protein/creatinine ≥0.3) OR end-organ dysfunction (thrombocytopenia <100K, elevated LFTs 2x normal, renal insufficiency Cr >1.1, pulmonary edema, cerebral/visual symptoms). Risk factors: nulliparity, obesity, multifetal gestation, age >35, prior preeclampsia, chronic HTN, diabetes, autoimmune disease, ART, family history<br>• Severe preeclampsia (ANY of): BP ≥160/110 after 1 attempt at rest, platelets <100K, AST/ALT 2x normal, severe RUQ pain, pulmonary edema, new-onset cerebral/visual disturbance, serum Cr >1.1. Tx: deliver at ≥34wk. If <34wk: steroids for fetal lung maturity + MgSO4 seizure prophylaxis + antihypertensives. MgSO4 4-6g IV load then 1-2g/h ×24h post-delivery<br>• HELLP syndrome: hemolysis (LDH >600), elevated LFTs (AST >70), low platelets (<100K). Variant of severe preeclampsia but 15% have normal BP. Complications: DIC, placental abruption, hepatic rupture, acute kidney injury, pulmonary edema. Tx: deliver immediately + MgSO4 + BP control. Dexamethasone for platelets <50K. Plasmapheresis if persistent thrombocytopenia >72h postpartum`,
    `<strong>Gestational diabetes mellitus (GDM) — screening and management:</strong><br>• Screening: 1-step (75g OGTT at 24-28wk — diagnose if fasting ≥92, 1hr ≥180, 2hr ≥153) OR 2-step (50g glucose challenge — screen if 1hr ≥130-140; if positive → 100g 3hr OGTT). ACOG recommends 2-step. IADPSG recommends 1-step (controversial — increases GDM diagnosis by 20-50%, unclear if improves outcomes)<br>• Management: glucose monitoring (fasting + 1hr post-prandial). Targets: fasting <95, 1hr <140, 2hr <120. Medical nutrition therapy (MNT) with carb counting (30-45g carbs per meal, 15-30g snacks). Exercise 30min daily<br>• Pharmacotherapy: insulin is FIRST-LINE (most studied, does not cross placenta). NPH 0.1-0.2 U/kg at bedtime for fasting hyperglycemia. Rapid-acting (lispro, aspart) before meals for post-prandial. Total daily dose: 0.7-2 U/kg (higher in later pregnancy due to placental anti-insulin hormones). Metformin: second-line (crosses placenta, less fetal data — not first-line per FDA; but used widely outside US). Glyburide: avoid (crosses placenta, macrosomia rate higher, neonatal hypoglycemia)<br>• Surveillance: fetal movement counts daily after 28wk. Ultrasound growth q4wk (check abdominal circumference — earliest sign of accelerated growth). Antepartum testing (BPP or NST) if on insulin or poor glycemic control — twice weekly starting 32-34wk<br>• Postpartum: glucose tolerance test at 4-12wk postpartum (75g OGTT). Breastfeeding encouraged (reduces maternal diabetes risk). 50% risk of T2DM in 5-10yr — refer for annual screening, lifestyle intervention, consider metformin for prevention in those with prior GDM`,
    `<strong>Preterm labor — diagnosis and management (SMFM/ACOG):</strong><br>• Diagnosis: regular uterine contractions (4 in 20min or 8 in 60min) + cervical change (dilation ≥2cm or effacement ≥80%) OR cervical length <20mm on TVUS. Fetal fibronectin (fFN) — NEGATIVE (≥50 ng/mL): high NPV 95% → delivery unlikely in 7 days. POSITIVE: low PPV 15-30% but signals need for intervention<br>• Tocolysis — short-term (48h) to allow steroid completion: calcium channel blockers (nifedipine 30mg PO load, then 10-20mg q4-6h) — first-line, best side-effect profile. Indomethacin (<32wk, 50-100mg PO/PR load then 25-50mg q6h ×48h) — but oligohydramnios, close PDA risk. Terbutaline: NOT recommended (maternal cardiac risk, pulmonary edema). Atosiban (oxytocin antagonist) — not available in US<br>• Corticosteroids: betamethasone 12mg IM ×2 doses 24h apart (or dexamethasone 6mg IM q12h ×4 doses) for women 24-34wk at risk of preterm delivery within 7 days. Consider 22-24wk per shared decision. Rescue course: if prior course >14 days ago AND still at risk of delivery <34wk — single rescue course (betamethasone 12mg ×1). DOES NOT cross placenta effectively before 24wk<br>• Neuroprotection: MgSO4 for gestational age <32wk with imminent delivery — 4-6g IV load, then 1-2g/h ×12-24h. Reduces risk of moderate-severe cerebral palsy by 30-40% (number needed to treat = 63) — Cochrane meta-analysis<br>• Cerclage: history-indicated (prior 3+ midtrimester losses, cervical insufficiency — place at 12-14wk). Ultrasound-indicated (cervical length <25mm before 24wk + prior preterm birth). Physical exam-indicated (painless dilation >2cm before 24wk). Contraindication: PROM, chorioamnionitis, active bleeding, preterm labor, fetal anomaly incompatible with life, multifetal gestation (increased risk in twins — consider rescue cerclage only)`,
    `<strong>Third-trimester bleeding — critical differential:</strong><br>• Placenta previa: painless bright red bleeding (usually 28-32wk). Risk factors: prior previa, prior C-section, multifetal, smoking, maternal age >35, IVF. Dx: transvaginal ultrasound (do NOT do digital exam — can cause catastrophic hemorrhage). Confirm with TVUS at 28-30wk if previa suspected. If marginal previa >20mm from os, vaginal delivery is safe. If complete previa covering os: scheduled C-section at 36-37wk (after steroids). Management: admit for observation if active bleeding, Rhogam if Rh-negative, cross-match. Emergency: if massive hemorrhage → immediate C-section regardless of gestational age<br>• Placental abruption: painful vaginal bleeding (concealed in 10-20%) — dark blood. TRIAD: vaginal bleeding + hypertonic/tetanic contractions + uterine tenderness/back pain. Risk factors: HTN, preeclampsia, trauma, cocaine/amphetamines, smoking, thrombophilia, prior abruption, PPROM. Complications: maternal hemorrhage, DIC (15-20%), fetal death (15%), renal failure, Couvelaire uterus (extravasation into myometrium)<br>• Vasa previa: fetal vessels crossing internal os — presents with painless bright red bleeding at amniotomy (PROM or artificial rupture). EXSANGUINATION of fetus → fetal death within minutes. Dx: antenatal ultrasound with Doppler — suspensory sign: vessels over os in second trimester → confirm at 32wk. Risk: bilobed placenta, succenturiate lobe, velamentous cord insertion, IVF pregnancy (3x increased risk)<br>• Management: previa with active bleeding → admit, type and cross, IV access ×2 large bore, continuous fetal monitoring, steroids if <36wk. Abruption: if fetal distress + viable → urgent C-section. If no fetal distress + mild → expectant management with monitoring. Vasa previa: scheduled C-section at 35-37wk (pre-labor), avoid vaginal delivery entirely<br>• Rh-negative status: give Rhogam 300 mcg IM for any third-trimester bleeding (or 50 mcg if <12wk). Also give at 28wk routinely + within 72h postpartum if baby Rh+. Kleihauer-Betke test if >20wk + large bleed — determines if additional Rhogam needed`,
  ],
  'Prenatal': [
    `<strong>Prenatal vitamins and supplementation:</strong> Folic acid 400-800 mcg daily (start 1mo preconception through 12wk — prevents 70% of NTDs). High-risk (prior NTD, DM, valproate, obesity, multiple gestations): 4-5mg daily. Vitamin D 600 IU daily (higher dose 1000-4000 IU if deficiency common). DHA 200-300 mg daily (neurodevelopment, preterm birth reduction). Iodine 150-220 mcg daily (thyroid function, neurodevelopment — most prenatals lack sufficient iodine). Iron 27mg daily (excess absorption improved with vitamin C). Avoid: vitamin A >10,000 IU/day (teratogenic), high-dose herbal/botanical supplements, "detox" teas, St. John's Wort. Prenatal vitamins should be started 3 months before attempting conception — neural tube closes by day 28 of gestation, often before pregnancy is known.`,
    `<strong>First-trimester screening — aneuploidy (ACOG 2024):</strong><br>• Cell-free DNA (cfDNA/NIPT) — BEST: detect trisomy 21 (>99%), trisomy 18 (>97%), trisomy 13 (>91%), sex chromosome aneuploidy (SCA 95-97%). Also fetal sex determination and some microdeletions (22q11 DiGeorge, 1p36, Prader-Willi, Angelman). Screen from 10wk. False-positive rate <0.2% for T21. NIPT should still be followed by diagnostic testing if positive — does NOT replace CVS or amniocentesis<br>• NT (nuchal translucency) ultrasound 11-14wk: normal <3.0mm. NT >3.0mm → increased risk trisomy 13, 18, 21 + Turner, Noonan, cardiac defects. Combined (NT + PAPP-A + free β-hCG): detection 85% for T21, 80% for T18 (at 5% FPR). If NT >3.5mm: early fetal echo (20-22wk)<br>• Quad screen (15-22wk): AFP, hCG, uE3, inhibin A. Detection: 75-80% T21, 80% T18 (at 5% FPR). Also screens for ONTD (AFP >2.5 MoM → targeted ultrasound + amniocentesis for AFP + AChE). Decreasing utility in cfDNA era, but still standard for patients not offered or declining cfDNA<br>• Diagnostic testing: CVS (10-13wk, transabdominal/transcervical, 0.5% miscarriage risk). Amniocentesis (15-22wk, transabdominal, 0.1-0.3% pregnancy loss risk). Karyotype (500 bands) + microarray (detects microdeletions 100x smaller than karyotype). Both are diagnostic — no false positives, no false negatives for tested abnormalities<br>• Counseling: ALL patients should be offered aneuploidy screening regardless of age (ACOM removes age-based cutoffs). Shared decision-making: cfDNA vs Quad screen vs diagnostic. "No screening" is an acceptable option. If cfDNA positive → refer for genetic counseling and diagnostic testing before making decisions about termination or prenatal planning`,
    `<strong>Group B Streptococcus (GBS) screening and prophylaxis (CDC 2024):</strong><br>• Screen ALL pregnant women at 36-38wk: rectovaginal swab for GBS culture (standard culture medium, 48h). Exceptions: GBS bacteriuria in current pregnancy (treat intrapartum, no swab needed), prior infant with invasive GBS disease (treat intrapartum), planned C-section with intact membranes and no labor (no screening needed)<br>• Intrapartum prophylaxis: penicillin G 5 million units IV load, then 2.5-3 million units q4h until delivery. Ampicillin 2g IV load, then 1g q4h. Duration: at least 4h before delivery for optimal prevention (decreases neonatal colonization 90%)<br>• If penicillin-allergic: low-risk (no anaphylaxis, no angioedema, no urticaria, no asthma) → cefazolin 2g IV load, then 1g q8h. High-risk (anaphylaxis, angioedema, urticaria within 1hr of dose, asthma) → clindamycin 900mg q8h OR vancomycin 1g q12h. Clindamycin only if GBS isolate is clindamycin-sensitive (susceptibility testing required — 25-40% of GBS are resistant)<br>• Neonatal early-onset GBS prevention risk reduction: 80% reduction with intrapartum abx. Before guidelines: 1.8/1000 live births → now 0.23/1000. Late-onset GBS (day 7-89) NOT prevented by intrapartum abx (horizontal/nosocomial transmission)<br>• GBS bacteriuria in pregnancy: ANY colony count = treat antepartum (penicillin or amoxicillin ×5-7 days) + treat intrapartum. No need for test of cure. Low colony count (100 CFU/mL) = still needs antepartum and intrapartum treatment`,
    `<strong>Immunizations in pregnancy (ACOG, CDC, AAP):</strong><br>• Tdap: 27-36wk EACH PREGNANCY — regardless of prior vaccination. Vaccinate with each pregnancy to maximize passive antibody transfer to neonate (pertussis, tetanus, diphtheria). Optimal window: 27-36wk (transplacental IgG transfer peaks third trimester). Contraindication: severe allergic reaction to prior dose. Not contraindicated: local reaction, history of Guillain-Barré<br>• Influenza (inactivated): ANY trimester during flu season (or all year if circulating). Reduces maternal influenza 50-70%, reduces maternal hospitalization 40%, reduces infant influenza 6mo+ (passive antibodies). Contraindication: severe egg allergy (can give in monitored setting — flu is now egg-free formulations available)<br>• RSV (Abrysvo): 32-36wk during RSV season (Sept-Jan). FDA-approved 2023. Reduces severe RSV in infants by 82% in first 90 days. Monoclonal antibody (nirsevimab/Beyfortus) for infant if not vaccinated during pregnancy — give to all infants <8mo entering first RSV season<br>• COVID-19: updated vaccine recommended in any trimester. Reduces severe maternal disease (ICU, ventilation, death) by 80%. Passive antibody transfer to neonate protects infant <6mo. Both mRNA (Pfizer, Moderna) and protein-based (Novavax) — minimal safety signals<br>• Contraindicated (live vaccines): MMR, varicella, live attenuated influenza (nasal), BCG, yellow fever, oral typhoid, LAIV (nasal). Wait 28 days after delivery before giving live vaccines if not immune. Hepatitis B: safe (recombinant). Hep A: safe (inactivated). HPV: NOT recommended in pregnancy (not studied), but no signal of harm — just defer. Pneumococcal: safe. Meningococcal: safe. Rabies: if indicated (post-exposure) — safe`,
    `<strong>Common pregnancy complaints — management:</strong><br>• Nausea/vomiting (NVP): first-line: ginger 250mg TID + B6 10-25mg TID + doxylamine 12.5-25mg nightly (Diclegis/Bonjesta — FDA Category A). Second-line: metoclopramide 5-10mg TID, ondansetron 4-8mg TID (avoid in first trimester — small increased risk of cleft palate in some studies; but untreated hyperemesis is worse). Hyperemesis gravidarum: >5% weight loss, ketonuria, electrolyte abnormalities → IV fluids + thiamine + hospitalize. Reassurance: self-limited, resolves by 14-16wk<br>• Heartburn/GERD: lifestyle (small frequent meals, avoid lying down after eating, elevate HOB). Antacids (Tums, Maalox) PRN. H2 blockers (famotidine 20mg BID) — safe throughout. PPIs (omeprazole 20mg daily) — more data accumulating, considered safe second-line. AVOID: sodium bicarbonate (fluid overload, metabolic alkalosis), magnesium trisilicate (fetal nephrolithiasis with prolonged use)<br>• Constipation: increase fiber + fluids. Docusate 100mg BID (stool softener — not effective alone). Polyethylene glycol (Miralax) 17g daily — safe, well-tolerated. Senna (Senokot) 1-2 tabs at bedtime — most effective stimulant. Avoid: bisacodyl (Dulcolax) in third trimester (causes uterine contractions), mineral oil (decreased fat-soluble vitamin absorption, aspiration risk)<br>• Back pain: 50-70% incidence — peaks 24-28wk. Treatment: acetaminophen (max 3g/day, limit <4g). PT (pelvic floor, core stabilization). Support belts (prenatal belly band). Heat, massage, chiropractic manipulation (cervical + thoracic safe; avoid high-velocity lumbar in third trimester). Avoid: NSAIDs (particularly after 20wk — premature closure of ductus arteriosus, oligohydramnios)<br>• Leg cramps: nightly — prevalence 30-50% in third trimester. Magnesium glycinate 200-400mg nightly (best evidence, Cochrane review: reduces frequency and intensity). Stretching (calf-stretch before bed). Increase fluid intake. Consider calcium lactate 500-1000mg nightly. Avoid quinine (teratogenic, cardiotoxic — never prescribe). Worsens with dehydration and diuretics (caffeine, high sodium intake)`,

  'STI': [
    `<strong>Chlamydia trachomatis — CDC 2024 treatment guidelines:</strong> Most common reportable bacterial STI in US (1.6 million cases/year). 70-80% of women asymptomatic — can cause PID (10-15%), tubal infertility, ectopic pregnancy. Screen annually all sexually active women <25 (USPSTF Grade B); older women with risk factors; MSM q3-12mo (urethral, pharyngeal, rectal NAAT). Dx: NAAT (urine, vaginal swab, cervical swab). Tx: azithromycin 1g PO ×1 (single dose) OR doxycycline 100mg BID ×7 days (preferred in 2024 update — superior efficacy especially for rectal CT; azithromycin resistance emerging). Retest at 3mo (high reinfection rate 15-20%). Treat all partners within 60 days. Expedited partner therapy (EPT) legal in most states — give Rx for partner without exam. Pregnant: azithromycin 1g ×1 — test for cure at 4wk (repeat NAAT — false positives from non-viable RNA). NO doxycycline in pregnancy.`,
    `<strong>Gonorrhea — CDC 2024 treatment guidelines:</strong> Second most common bacterial STI. Rising resistance: cephalosporins LAST remaining reliable class. Ceftriaxone 500mg IM ×1 (single dose, increased from 250mg due to resistance). If chlamydia not ruled out: add azithromycin or doxycycline 100mg BID ×7 days. Pharyngeal: ceftriaxone 500mg IM ×1 (harder to treat — azithromycin 2g PO ×1 no longer recommended as monotherapy). Resistance: ceftriaxone MIC creep — global concern. Test of cure at 7-14 days for pharyngeal GC. Retest at 3mo. DGI (disseminated gonococcal infection): dermatitis (pustular/hemorrhagic lesions on extremities), tenosynovitis, migratory polyarthritis, hepatitis, meningitis, endocarditis. Tx: ceftriaxone 1-2g IV ×7-14 days, depending on site. Treat all partners within 30 days. EPT: doxycycline or cefixime 800mg PO ×1 (reduced efficacy — EPT not as effective for GC as for CT). Pregnant: ceftriaxone 500mg IM + azithromycin 1g PO — test of cure at 4wk`,
    `<strong>Syphilis — CDC 2024 treatment guidelines:</strong> "The Great Pretender." Resurging — US rate up 80% since 2018. Primary: painless chancre (single, firm, non-tender, clean base — 3-90 days after exposure). Secondary: maculopapular rash (palms/soles in 80%), fever, lymphadenopathy, condyloma lata (moist, flat, papules in intertriginous areas), patchy alopecia, mucous patches. Latent: early (<1yr) vs late (>1yr or unknown). Tertiary: gumma, cardiovascular (aortic insufficiency, aneurysm), neurosyphilis (tabes dorsalis, general paresis, Argyll Robertson pupils). Screen: RPR/VDRL (non-treponemal, titer correlates with disease activity) then confirm with treponemal test (FTA-ABS, TP-PA)<br>• Tx: primary, secondary, early latent (<1yr): benzathine penicillin G 2.4 million units IM ×1. Late latent (>1yr) or unknown duration: PCN 2.4 million units IM q1wk ×3 doses. Neurosyphilis: aqueous PCN G 18-24 million units IV daily ×10-14 days OR procaine PCN 2.4 million units IM daily + probenecid 500mg PO QID ×10-14 days. Jarisch-Herxheimer reaction: fever, chills, myalgias within 6-12h of first dose (50% of primary, 90% of secondary). Self-limited — treat with Tylenol, reassure. Do NOT use steroids to prevent (can obscure neuro response)<br>• Penicillin allergy: doxycycline 100mg BID ×14 days (primary/secondary, early latent). Doxycycline 100mg BID ×28 days (late latent). Ceftriaxone 2g IM/IV daily ×10-14 days (neurosyphilis — but high-level cross-reactivity with PCN — skin testing recommended before use)<br>• Syphilis in pregnancy: PCN is the ONLY recommended treatment (no alternatives). If PCN-allergic: desensitize (PO or IV). Doxycycline contraindicated (fetal skeletal/teeth effects). Monitor with monthly RPR titers (should drop 4-fold by 3mo → 8-fold by 6mo). If not: retreat. Risk of fetal syphilis: 100% untreated early maternal syphilis, 40% late latent. Congenital syphilis: hepatosplenomegaly, osteochondritis/chondritis (radiographic "saber shins"), rhinitis ("snuffles"), maculopapular (desquamating), jaundice. Evaluate all infants: CSF for VDRL, long bone X-rays, hearing/vision. Tx: PCN G 50,000 U/kg IV q12h (first 7 days) then q8h ×10 days total`,
    `<strong>HIV — CDC 2024 STI co-infection and management:</strong><br>• Screen: opt-out HIV testing for all patients 13-64 at least once (CDC). Annual for high-risk (MSM, PWID, sex workers, STI diagnosis, partner with HIV). Fourth-generation antigen/antibody test detects both within 2-4wk of exposure (p24 antigen detects earlier than antibody alone). Confirm with HIV-1/2 differentiation assay. Nucleic acid test (NAT) for acute infection (detects RNA within 10-14 days)<br>• PEP (post-exposure prophylaxis): start ASAP (within 72h). Duration: 28 days. Regimen: tenofovir disoproxil fumarate 300mg + emtricitabine 200mg (Truvada) daily + raltegravir 400mg BID or dolutegravir 50mg daily. Occupational: 3-drug regimen for 28 days. Non-occupational: 3-drug regimen (Truvada or Descovy + dolutegravir or raltegravir). Baseline: HIV test, CBC, CMP, pregnancy test. Follow-up: HIV test at 4wk, 3mo, 6mo<br>• PrEP: tenofovir disoproxil fumarate 300mg + emtricitabine 200mg (Truvada) daily — for at-risk HIV-negative individuals. Also TAF 25mg + FTC 200mg (Descovy). See LGBTQIAP+ topic for full details<br>• STI co-infection impact: HIV+ patients with STI — higher HIV viral load in genital secretions, increased HIV transmission risk during STI. Treat STI per standard guidelines. Syphilis: can present with atypical/accelerated course in HIV (co-infection may cause higher RPR titers, faster progression to neurosyphilis, higher treatment failure). Lumbar puncture is more liberally indicated<br>• Partner services: HIV+ patient — discuss partner notification (health department, patient referral, provider referral). Offer EPT for STI co-infections where legal. Link partner to HIV testing + PrEP`,
    `<strong>HSV-1 and HSV-2 — genital herpes management:</strong><br>• Clinical: primary outbreak (most severe) — multiple painful vesicular/ulcerative lesions, fever, headache, myalgias, inguinal lymphadenopathy, dysuria. Recurrence: more frequent and severe for HSV-2 (4-6/yr) vs HSV-1 (1-2/yr). Prodrome: tingling, burning, paresthesias 6-24h before lesions. Asymptomatic shedding: 2x more HSV-1 than HSV-2 orally, 2x more HSV-2 genitally. Dx: PCR from lesion swab (NOT serology) for active lesions. Type-specific serology (gG1, gG2): use only for: recurrent genital symptoms with negative swab, partner with genital herpes, comprehensive STI screen<br>• First episode: acyclovir 400mg TID ×7-10 days OR valacyclovir 1g BID ×7-10 days OR famciclovir 250mg TID ×7-10 days. May extend if incomplete healing. Antivirals reduce duration (3-5 days), viral shedding (80%), new lesion formation — do NOT reduce latency or recurrence frequency (only suppression does)<br>• Suppressive therapy (if ≥6 recurrences/yr): valacyclovir 500mg daily (first-line, BID if breakthrough), or acyclovir 400mg BID, or famciclovir 250mg BID. Reduces recurrences by 70-80%. Reduces HSV-2 transmission to susceptible partners by 50%. Reassess after 1yr: 50% of patients can stop and maintain remission<br>• Pregnancy (CRITICAL — neonatal herpes mortality 50%): screen symptomatic patients. Acyclovir 400mg TID from 36wk until delivery reduces C-section rate for active HSV. C-section if active genital lesions or prodromal symptoms at onset of labor (including in patients on suppressive therapy). Avoid invasive fetal monitoring (scalp electrode) if known HSV. Neonatal herpes: occurs 1:3200-10:000 births, 85% acquired intrapartum. Types: SEM (skin/eye/mouth), CNS (meningitis, encephalitis), disseminated (liver, lungs, brain). Tx: high-dose IV acyclovir 60 mg/kg/day divided q8h ×14-21 days depending on extent<br>• Counseling: explain natural history — "You will have this virus for life. Most HSV-2 genital infections are subclinical. You can still have sex — use condoms (reduces transmission 50%), consider suppressive therapy, avoid sex during prodrome/outbreak. Disclosure is ethical, but there's no legal mandate in every state"`,

  'Well Child Visit': [
    `<strong>Well-child visit schedule — AAP Bright Futures:</strong> 3-5d, 1mo, 2mo, 4mo, 6mo, 9mo, 12mo, 15mo, 18mo, 24mo, 30mo, then annually 3-21yr. Each visit: comprehensive history (interval history, growth, development, nutrition, sleep, safety, family function, social determinants of health), complete physical exam (measurements: weight, length/height, head circumference to 24mo, BMI ≥2yr, BP ≥3yr), developmental surveillance (standardized screening at 9, 18, 30mo), hearing and vision screening, immunizations, anticipatory guidance. The 3-5d newborn visit is CRITICAL: weight check (goal <7% loss from birth weight — if >7%, assess feeding and consider phototherapy + bilirubin), jaundice screen (risk assessment + transcutaneous bili), breastfeeding support, car seat, sleep safety (back to sleep, firm surface, no loose bedding, room-sharing without bed-sharing).`,
    `<strong>Developmental screening — AAP policy (all well-child visits):</strong><br>• Standardized screening at 9mo, 18mo, 24/30mo: Ages and Stages Questionnaire (ASQ) — parent-completed, screens 5 domains (communication, gross motor, fine motor, problem-solving, personal-social). M-CHAT-R/F at 18mo and 24mo (autism specific — 9-10% positive screen rate). Surveillance at EVERY visit using clinical judgment + milestone checklist<br>• 2mo: social smile, coos, follows face past midline, lifts head in prone, symmetric movements. Refer PT/OT if: persistent fisting, head lag, asymmetrical, no visual tracking<br>• 6mo: rolls front→back + back→front, sits with support, reaches for objects, transfers hand-to-hand, babbles (consonant-vowel strings). Refer if: no sitting, persistent fisting, no babbling, no social smile<br>• 9mo: sits unsupported, crawls (belly or 4-point), cruises, pincer grasp, stranger anxiety, mama/dada nonspecific, gestures ("bye-bye"). Refer if: not sitting, no crawling, no babbling, no stranger anxiety, persistent toe-walking (90% of toe-walking is benign/idiopathic — check ankle dorsiflexion, asymmetry)<br>• 12mo: pulls to stand, cruises, maybe walks (50% walk by 12mo, 95% by 15mo), first words (2-3 meaningful). Refer if: not pulling to stand, no words, no gestures, loses skills (regression — red flag for autism, Rett, Landau-Kleffner)<br>• 18mo: walks independently, runs stiffly, climbs, 10-25 words, points to body parts, imitates, pretend play, uses spoon/cup. Refer if: <10 words, no walking, no pointing (pointing is KEY social communication milestone — absence highly specific for autism), no pretend play, toe-walking (if persistent: check CP, tethered cord, idiopathic — 5% will need serial casting/surgery)<br>• 24mo: runs well, walks up/down stairs, 50-200 words, 2-word phrases, parallel play, undresses, kicks ball. Refer if: <50 words, no 2-word combinations, not running, loss of language (regression = autism red flag), no interactive play, or any concern from M-CHAT-R/F`,
    `<strong>Immunization schedule — CDC/AAP 2024 (birth through 18yr):</strong><br>• Birth: Hep B #1 (within 24h, before discharge — regardless of birth weight). If mom HBsAg+: Hep B #1 + HBIG within 12h<br>• 2mo: DTaP #1, IPV #1, Hib #1, PCV20 #1 or PCV15 #1, RV #1 (Rotarix or RotaTeq). All combination vaccines acceptable: Pediarix (DTaP+IPV+HepB), Pentacel (DTaP+IPV+Hib)<br>• 4mo: DTaP #2, IPV #2, Hib #2, PCV #2, RV #2<br>• 6mo: DTaP #3, IPV #3 (optional, give if using IPV-containing combinations), Hib #3 (if needed per brand), PCV #3, RV #3 (RotaTeq only, Rotarix is 2-dose). HepB #3 (≥24wk, ≥4mo after first, ≥2mo after second). Influenza (first dose, 2-dose if <9yr first season)<br>• 12-15mo: MMR #1, varicella #1, HepA #1 (2-dose series 6mo apart), PCV #4 (booster), Hib #4 (booster), DTaP #4 (15-18mo)<br>• 18-24mo: HepA #2. Catch-up: any missed doses<br>• 4-6yr: DTaP #5 (or Tdap at 11-12yr), IPV #4, MMR #2, varicella #2<br>• 11-12yr: Tdap, MenACWY #1, HPV (2-dose if 9-14yr at first dose, 3-dose if 15+ or immunocompromised or start age 9-14 with <5mo between doses). Consider MenB (2-3 doses based on brand — shared decision-making at 16-23yr)<br>• 16-18yr: MenACWY booster (if given first dose at 11-12yr). MenB (2-3 dose series). COVID-19: updated booster recommended for all ages ≥6mo. RSV (nirsevimab): all infants <8mo entering first RSV season, high-risk 8-19mo second season<br>• Catch-up: CDC catch-up schedule available — rule of thumb: minimum interval between doses must be maintained. If behind, don't restart — just give remaining doses at recommended intervals. Serology: only test for Hep B, varicella, measles, rubella if no documentation — DO NOT retest routinely`,
    `<strong>Anticipatory guidance by age — injury prevention (AAP):</strong><br>• Newborn-6mo: Safe sleep (back to sleep, flat firm surface, no toys/bumpers/pillows/blankets — room share but don't bed share — AAP 2022 reaffirmed). Car seat (rear-facing, in back seat — no front seat until 13yr). No smoking/vaping near infant (SIDS risk 2-5x). No honey in first year (infant botulism). Shaken baby syndrome education: "If crying is overwhelming, it's okay to put baby down in a safe place and walk away for 5 minutes"<br>• 6-12mo: Falls (baby gates at stairs, window guards, furniture anchored). Burns (check water heater <120°F, no hot liquids near baby, outlet covers). Choking (avoid: hot dogs, grapes, nuts, popcorn, hard candy, whole cherry tomatoes — cut all round foods into quarters). Pool safety (fence all sides, 4-ft minimum, self-latching gate — never leave child unattended near water for any duration)<br>• 1-2yr: Poisoning (store all meds/cleaners/button batteries locked up — put poison control number 1-800-222-1222 in phone now). Water safety (never unsupervised near ANY water — bath, pool, toilet, bucket). Car seat: rear-facing as long as possible, at least to 2yr (max limit of seat). Stranger danger + street safety not developmentally appropriate yet<br>• 3-5yr: Car seat/booster (5-point harness until 40-65lb, then high-back booster until 4'9" ≈ 8-12yr). Water safety (swim lessons? No evidence they prevent drowning alone — supervision required at all times). Stranger safety: "Don't go anywhere with anyone without asking me first." Bike helmet (start early — model the behavior). Gun safety: "Do you have guns in the home? Store unloaded, locked, ammunition separate"<br>• 6-12yr: Internet safety (supervised access only, parent controls, no social media accounts below platform age of 13). Helmet for bikes, scooters, skateboards, ATVs — non-negotiable. Sun protection: SPF 30+, reapply q2h, avoid peak UV 10am-4pm. Sleep: 9-12h/night; no screens in bedroom. Emotional health: ask about bullying, friends. Seat belt (belt-positioning booster until 4'9", then seat belt)`,
    `<strong>Adolescent well-visit — HEADSSS assessment (confidentiality first):</strong><br>• Establish confidentiality: "What we talk about here is private between us unless you're going to hurt yourself, someone is hurting you, or someone is hurting you — I'll always tell you before I share anything. Your parent/guardian will not be told what you say here." Ask parent to step out. Keep separate confidential note. Discuss limits at start of each visit<br>• H — Home: living situation, relationships at home, safety, recent moves, frequent fighting (conflict + violence), runaway history. Ask "Who lives with you?" and "How do you get along with the people at home?"<br>• E — Education: school performance, grade changes, favorite/hardest subjects, attendance, bullying, suspensions, IEP/504, future plans (college, work). Ask "How are things going at school?" and "Have you ever been bullied?"<br>• A — Activities: friends (peer group activities, pressure), extracurriculars, hobbies, screen time, social media use (platforms, problematic use), sports, sleep (hours, patterns, phone in bedroom). Ask "What do you do for fun?" and "How many hours of sleep do you get?"<br>• D — Drugs: tobacco/vaping (JUUL, Puff Bar, Elf Bar — YES, ask specifically), alcohol (binge drinking frequency), marijuana (frequency, method, age of onset), prescription misuse (stimulants, opioids), illicit drugs. CRAFFT screen 2.0: Car/Relax/Alone/Forget/Friends/Trouble — 2+ positive = high risk for SUD. Ask "Have you ever ridden in a car driven by someone who was high or drunk?"<br>• S — Sexuality: sexual activity (oral, vaginal, anal, same-sex vs different-sex partners), condom use, contraception, STI testing, number of partners, forced sex (ask "Have you ever been forced to do something sexual?"), orientation/identity. "Are you attracted to boys, girls, both, or not sure?" "Have you had sex? With anyone? When was the last time?"<br>• S — Suicide/depression: PHQ-9 or PHQ-A screening. "Have you felt down, depressed, or hopeless?" "Have you had thoughts of hurting yourself or ending your life?" C-SSRS if positive. Safety plan + parent involvement + mental health referral. Every visit — suicide is the SECOND leading cause of death in ages 10-24<br>• E — Eating/Safety: body image, weight concerns, dieting, binge/purge, excessive exercise. Seat belt use (always?), helmet (bike/motorcycle?), gun access (check at least once), seat belt use. Ask "Do you feel safe at home/school?" and "Are you worried about your weight or your body?"`,
  ],
  "Women's Health Gynecology": [
    `<strong>Abnormal uterine bleeding (AUB) — PALM-COEIN classification (FIGO 2018):</strong> Structural: Polyp, Adenomyosis, Leiomyoma (fibroids — submucosal most symptomatic). Malignancy/hyperplasia. Non-structural: Coagulopathy (rare but check if adolescent presenting with severe bleeding — von Willebrand 13%), Ovulatory dysfunction (most common cause in adolescents and perimenopause), Endometrial, Iatrogenic, Not yet classified. Workup: CBC, ferritin, TSH, prolactin, pregnancy test, Chlamydia/gonorrhea NAAT. Imaging: transvaginal ultrasound (TVUS) for structural causes. Endometrial biopsy if ≥45yr, or <45 with risk factors (obesity, PCOS, tamoxifen, Lynch, unopposed estrogen, failed medical therapy).`,
    `<strong>Endometriosis — diagnosis and management (ASRM 2024):</strong><br>• Clinical: chronic pelvic pain (cyclic and non-cyclic), dysmenorrhea (prostaglandin-mediated, starts before menses → continues through period), deep dyspareunia (tender uterosacral ligaments), dyschezia (pain with defecation during menses), dysuria (bladder implants), infertility. 50-70% of adolescent with chronic pelvic pain have endometriosis. Classic exam: tender nodular uterosacral ligaments, fixed retroverted uterus, tender adnexal mass (endometrioma — "chocolate cyst" on ultrasound)<br>• Diagnosis: definitive = laparoscopy with biopsy (gold standard — visualize implants: powder-burn/blue-black lesions, clear/pink/red lesions, white plaques, peritoneal defects). Non-invasive: TVUS for endometriomas, MRI for deep infiltrating endometriosis (DIE) — sensitivity 85% for DIE. CA-125 elevated but NOT diagnostic. Delay in diagnosis averages 7-10yr — do NOT dismiss<br>• Medical management (first-line): NSAIDs (naproxen 500mg BID during menses). Combined hormonal contraception (continuous/extended cycle to induce amenorrhea). Progestin-only: norethindrone acetate 5-15mg daily (first-line for pain). Depot MPA (Depo-Provera). Levonorgestrel IUD (Mirena — reduces pain 70-80%, comparable to GnRH agonist without bone loss). GnRH agonists (leuprolide 3.75mg IM monthly): for severe pain not responding — add-back therapy (norethindrone 5mg + conjugated equine estrogen 0.625mg) to prevent bone loss and vasomotor symptoms. GnRH antagonist (elagolix 150mg daily + 200mg BID based on severity — oral, reversible, less bone loss than agonists)<br>• Surgical: laparoscopic excision of endometriosis (SUPERIOR to ablation — lower recurrence, better pain relief, improved fertility). Cystectomy for endometrioma. Preserve normal tissue. Recurrence: 20-30% at 2yr, 40-50% at 5yr — suppress with CHC or progestin post-op<br>• Fertility: laparoscopic excision improves spontaneous conception. If no conceive in 6-12mo post-op → IVF. Endometriosis-associated infertility: mild → IUI + COH, severe → IVF. Pain may persist in pregnancy (mostly first trimester, improves second/third)`,
    `<strong>Polycystic ovary syndrome (PCOS) — Rotterdam criteria (≥2 of 3):</strong> 1) Oligo/anovulation (cycles >35 days or <8/yr). 2) Clinical/biochemical hyperandrogenism (hirsutism — Ferriman-Gallwey score ≥8; acne; alopecia; elevated free testosterone, DHEA-S, androstenedione). 3) Polycystic ovaries on ultrasound (≥12 follicles 2-9mm per ovary OR ovarian volume >10 mL). Exclude: thyroid, prolactin, non-classic CAH (17-OHP), Cushing's, androgen-secreting tumor. Metabolic: 50-70% have insulin resistance (independent of obesity — lean PCOS also at risk). Screen: fasting glucose, lipids, 2hr OGTT if BMI >25 or risk factors. Long-term: T2DM (3x risk), metabolic syndrome, CVD risk factors, endometrial cancer (unopposed estrogen → hyperplasia). Management: lifestyle first (7% weight loss restores ovulation in 50-70%, reduces hirsutism, improves lipids and glucose). COC for menstrual regulation + antiandrogen (drospirenone). Metformin for IGT or metabolic syndrome. Spironolactone 50-200mg daily for hirsutism (add COC for contraception — spironolactone is teratogenic). Fertility: letrozole 2.5-7.5mg cycle days 3-7 (first-line — more effective than clomiphene, lower multiple rate). Metformin + letrozole if BMI >30. Consider ovarian drilling (laparoscopic) if clomiphene/letrozole-resistant`,

enopausal growth on HRT → stop therapy, rescan in 3-6mo. Surgery: morcellation for unknown pathology may disseminate unsuspected sarcoma — use containment systems. Age at menopause: fibroids typically regress with estrogen decline — consider expectant management if near menopause`,
