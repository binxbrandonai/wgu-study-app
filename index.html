// ===== TOPICS =====
function getTopicsForCourse(course) {
  const qs = QUESTIONS[course] || [];
  const counts = {};
  qs.forEach(q => { counts[q.topic] = (counts[q.topic]||0)+1; });
  return Object.entries(counts).sort((a,b) => a[0].localeCompare(b[0]));
}

function isWeak(course, topic) {
  return (WEAK_TOPICS[course]||[]).some(w => topic.includes(w) || w.includes(topic));
}

function renderSidebar() {
  const topics = getTopicsForCourse(state.activeCourse);
  const list = document.getElementById('topicList');
  document.getElementById('sidebarHeader').textContent = `${state.activeCourse} Topics`;
  let html = '';
  topics.forEach(([topic, count]) => {
    const weak = isWeak(state.activeCourse, topic);
    const done = state.completedTopics.has(`${state.activeCourse}::${topic}`);
    const activeClass = state.activeTopic === topic ? 'active' : '';
    const weakClass = weak ? 'weak' : '';
    const indicator = done
      ? `<span class="topic-check">✓</span>`
      : `<span class="topic-dot" style="${weak ? 'background:#ef4444' : ''}"></span>`;
    html += `<div class="topic-item ${activeClass} ${weakClass}" onclick="selectTopic('${topic.replace(/'/g,"\\'")}')">
      ${indicator}
      <span>${topic}</span>
      <span class="count-badge">${count}</span>
    </div>`;
  });
  list.innerHTML = html;
}

function selectTopic(topic) {
  state.activeTopic = topic;
  state.inlineQuiz = { questions: [], currentIndex: 0, score: 0, answered: false };
  renderSidebar();
  renderEpisode(topic);
}

// ===== EPISODE RENDERING =====
function renderEpisode(topic) {
  const course = state.activeCourse;
  const allQs = (QUESTIONS[course]||[]).filter(q => q.topic === topic);
  // Select up to 5 random questions for inline quiz
  const shuffled = [...allQs].sort(() => Math.random()-0.5);
  const quizQs = shuffled.slice(0, Math.min(5, shuffled.length));
  state.inlineQuiz.questions = quizQs;
  state.inlineQuiz.currentIndex = 0;
  state.inlineQuiz.score = 0;
  state.inlineQuiz.answered = false;

  const weak = isWeak(course, topic);
  const video = (VIDEOS[course]||{})[topic];
  const diagram = DIAGRAMS[topic];
  const kps = KEY_POINTS[topic] || getAutoKeyPoints(topic, allQs);

  // Update last study date and streak
  const today = new Date().toISOString().split('T')[0];
  if (state.lastStudyDate !== today) {
    const last = state.lastStudyDate ? new Date(state.lastStudyDate) : null;
    const now = new Date(today);
    if (last && Math.floor((now-last)/(1000*60*60*24)) === 1) {
      state.streakDays++;
    } else if (!last) {
      state.streakDays = 1;
    }
    state.lastStudyDate = today;
    saveState();
  }

  const weakBadge = weak ? '<span class="episode-badge episode-weak">⚠️ Weak Area</span>' : `<span class="episode-badge">${course}</span>`;

  let html = `<div class="episode-card fade-in">
    <div class="episode-header">
      <span class="episode-title">${topic}</span>
      ${weakBadge}
    </div>`;

  // 1. VIDEO SECTION
  html += `<div class="section-block">
    <div class="section-label watch">▶ 1 &nbsp; Watch</div>`;
  if (video) {
    html += `<div class="video-container">
      <iframe src="https://www.youtube.com/embed/${video.id}?rel=0&modestbranding=1" allowfullscreen title="${video.title}"></iframe>
    </div>
    <p style="font-size:12px;color:var(--text-light);margin-top:8px;text-align:center;">${video.title}</p>`;
  } else {
    html += `<div class="video-placeholder">
      <div class="play-icon">🎬</div>
      <p>Search <strong>"Ninja Nerd ${topic}"</strong> or <strong>"Osmosis ${topic}"</strong> on YouTube for the best visual explanation.</p>
    </div>`;
  }
  html += `</div>`;

  // 2. VISUAL SECTION
  html += `<div class="section-block">
    <div class="section-label visual">🗺 2 &nbsp; Visual</div>`;
  if (diagram) {
    html += `<div class="diagram-container" onclick="openDiagram('${diagram}')" style="cursor:zoom-in;" title="Click to enlarge">
      <iframe src="${diagram}" class="diagram-embed" title="${topic} diagram"></iframe>
    </div>
    <span class="diagram-expand-btn" onclick="openDiagram('${diagram}')">⤢ Tap to enlarge</span>`;
  } else {
    html += `<div class="diagram-container" style="padding:30px;text-align:center;color:var(--text-mid);">
      <p style="font-size:14px;">📋 <strong>${topic}</strong> — Focus on clinical algorithms and decision trees for this topic.<br>
      Draw your own flow chart as you study to cement the pathways!</p>
    </div>`;
  }
  html += `</div>`;

  // 3. KEY POINTS SECTION
  html += `<div class="section-block">
    <div class="section-label keypoints">💡 3 &nbsp; Key Points</div>
    <ul class="keypoints-list">`;
  kps.forEach((pt, idx) => {
    const detail = KEY_POINTS_DETAIL[topic] && KEY_POINTS_DETAIL[topic][idx] ? KEY_POINTS_DETAIL[topic][idx] : null;
    const detailHTML = detail ? `<div class="kp-detail" id="kpd-${idx}">${detail}</div>` : '';
    const expandIcon = detail ? `<span class="kp-expand-icon">▼</span>` : '';
    const clickAttr = detail ? `onclick="toggleKP(this, 'kpd-${idx}')"` : '';
    html += `<li><div class="kp-row" ${clickAttr}><span class="kp-icon">→</span><span>${expandAbbreviations(pt)}</span>${expandIcon}</div>${detailHTML}</li>`;
  });
  html += `</ul></div>`;

  // 4. INLINE QUIZ SECTION
  html += `<div class="section-block">
    <div class="section-label quiz">🧠 4 &nbsp; Practice Quiz</div>
    <div id="inlineQuizArea">`;
  if (quizQs.length > 0) {
    html += renderInlineQuestion(0, quizQs);
  } else {
    html += `<p style="color:var(--text-mid);font-size:14px;">No practice questions available for this topic yet.</p>`;
  }
  html += `</div></div></div>`;

  document.getElementById('contentArea').innerHTML = html;
}

function getAutoKeyPoints(topic, questions) {
  // Extract key points from rationales
  const points = [];
  questions.slice(0,5).forEach(q => {
    const rat = q.rationale || '';
    const boardTip = rat.match(/\*\*Board tip:\*\*(.+?)(\.|$)/i);
    if (boardTip) points.push(boardTip[1].trim());
  });
  if (points.length < 3) {
    points.push(`Study the <strong>${topic}</strong> clinical presentation, diagnosis, and treatment approach`);
    points.push(`Focus on <strong>when to refer</strong> vs. manage in primary care`);
    points.push(`Know the <strong>board-level drug doses</strong> and monitoring parameters`);
  }
  return points.slice(0,5);
}

function renderInlineQuestion(index, questions) {
  const q = questions[index];
  const total = questions.length;
  const pct = Math.round(index/total*100);
  const letters = ['A','B','C','D'];

  return `<div class="quiz-counter">Question ${index+1} of ${total}</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="question-text">${q.q}</div>
    <div class="answer-options" id="inlineOptions_${index}">
      ${q.a.map((opt,i) => `<button class="answer-btn" onclick="answerInline(${index},${i})" id="inlineOpt_${index}_${i}">
        <span class="opt-letter">${letters[i]}.</span>
        <span>${opt}</span>
      </button>`).join('')}
    </div>
    <div id="inlineRationale_${index}" style="display:none;"></div>
    <div class="quiz-nav" id="inlineNav_${index}" style="display:none;">
      <div style="font-size:13px;color:var(--text-mid);" id="inlineScore_${index}"></div>
      <button class="btn-teal" onclick="nextInlineQuestion(${index})" id="inlineNextBtn_${index}">
        ${index+1 < total ? 'Next Question →' : '🏆 Finish Episode'}
      </button>
    </div>`;
}

function answerInline(questionIndex, chosenIndex) {
  const qs = state.inlineQuiz.questions;
  const q = qs[questionIndex];
  const correct = q.correct;
  const letters = ['A','B','C','D'];

  // Disable all options
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`inlineOpt_${questionIndex}_${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === correct) btn.classList.add('revealed');
    if (i === chosenIndex && chosenIndex !== correct) btn.classList.add('incorrect');
    if (i === chosenIndex && chosenIndex === correct) {
      btn.classList.remove('revealed');
      btn.classList.add('correct');
    }
  }

  const isCorrect = chosenIndex === correct;
  if (isCorrect) {
    state.inlineQuiz.score++;
    state.totalCorrect++;
  }
  state.totalAnswered++;

  // Track by topic
  const tk = `${state.activeCourse}::${state.activeTopic}`;
  if (!state.correctByTopic[tk]) state.correctByTopic[tk] = { correct: 0, total: 0 };
  state.correctByTopic[tk].total++;
  if (isCorrect) state.correctByTopic[tk].correct++;
  saveState();

  // Show rationale
  const rat = formatRationale(q.rationale);
  document.getElementById(`inlineRationale_${questionIndex}`).innerHTML = rat;
  document.getElementById(`inlineRationale_${questionIndex}`).style.display = 'block';
  document.getElementById(`inlineNav_${questionIndex}`).style.display = 'flex';
  document.getElementById(`inlineScore_${questionIndex}`).textContent = `Score: ${state.inlineQuiz.score}/${questionIndex+1}`;
}

function nextInlineQuestion(currentIndex) {
  const qs = state.inlineQuiz.questions;
  const next = currentIndex + 1;
  if (next >= qs.length) {
    // Episode complete
    const score = state.inlineQuiz.score;
    const total = qs.length;
    const tk = `${state.activeCourse}::${state.activeTopic}`;
    state.completedTopics.add(tk);
    saveState();
    renderSidebar();
    document.getElementById('inlineQuizArea').innerHTML = `
      <div class="episode-complete">
        <div class="trophy">🏆</div>
        <h3>Episode Complete!</h3>
        <p>You scored <strong>${score}/${total}</strong> (${Math.round(score/total*100)}%) on <strong>${state.activeTopic}</strong></p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <button class="btn-primary" onclick="selectTopic('${state.activeTopic.replace(/'/g,"\\'")}')">🔄 Retry Topic</button>
          <button class="btn-teal" onclick="switchTab('quiz');event.target.closest('.nav-tab')">📝 Full Quiz Mode</button>
        </div>
      </div>`;
    return;
  }
  document.getElementById('inlineQuizArea').innerHTML = renderInlineQuestion(next, qs);
}

function formatRationale(rat) {
  if (!rat) return '';
  // Format board tips
  let formatted = rat.replace(/\*\*Board tip:\*\*/gi, '<span class="board-tip">⭐ Board Tip:</span>');
  formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  formatted = formatted.replace(/---+/g, '');
  // Split into main text and board tip
  const tipIdx = formatted.indexOf('<span class="board-tip">');
  let mainText = tipIdx > -1 ? formatted.substring(0, tipIdx) : formatted;
  let tipText = tipIdx > -1 ? formatted.substring(tipIdx) : '';
  return `<div class="rationale-box"><p>${mainText.trim()}</p>${tipText ? `<div class="board-tip" style="margin-top:10px;padding-top:10px;border-top:1px solid #bae6fd;">${tipText}</div>` : ''}</div>`;
}

    pool = Object.values(QUESTIONS).flat();
  } else {
    pool = [...(QUESTIONS[quizOpts.course]||[])];
  }
  if (quizOpts.focus === 'weak') {
    const wt = WEAK_TOPICS[quizOpts.course] || [];
    pool = pool.filter(q => wt.some(w => q.topic.includes(w) || w.includes(q.topic)));
  }

  pool = pool.sort(() => Math.random()-0.5).slice(0, quizOpts.count);

  renderFullQuizQuestion();

        <div class="progress-wrap">
          <div class="q-num">Question ${fq.currentIndex+1} of ${total} &nbsp;•&nbsp; Score: ${fq.score}/${fq.currentIndex}</div>
          <div class="quiz-progress-bar" style="margin-bottom:0"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
        </div>
        <button class="btn-secondary" onclick="endQuizEarly()" style="font-size:13px;padding:8px 14px;">End Quiz</button>
      </div>
      <div class="quiz-card fade-in">
        <div style="font-size:11px;font-weight:700;color:var(--text-light);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px;">${q.topic} &nbsp;•&nbsp; ${q.course}</div>
        <div class="question-text">${q.q}</div>
        <div class="answer-options" id="fqOptions">
          ${q.a.map((opt,i) => `<button class="answer-btn" onclick="answerFullQuiz(${i})" id="fqOpt_${i}">
            <span class="opt-letter">${letters[i]}.</span>
            <span>${opt}</span>
          </button>`).join('')}
        </div>
        <div id="fqRationale" style="display:none;"></div>
        <div id="fqNav" style="display:none;justify-content:space-between;align-items:center;margin-top:16px;">
          <div id="fqFeedback" style="font-size:14px;font-weight:600;"></div>
          <button class="btn-primary" onclick="nextFullQuizQ()">
            ${fq.currentIndex+1 < total ? 'Next →' : '🏆 See Results'}
          </button>
        </div>
      </div>
    </div>`;
}

function answerFullQuiz(chosen) {
  const fq = state.fullQuiz;
  const q = fq.questions[fq.currentIndex];
  const correct = q.correct;
  const isCorrect = chosen === correct;

  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`fqOpt_${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === correct) btn.classList.add('revealed');
    if (i === chosen && !isCorrect) btn.classList.add('incorrect');
    if (i === chosen && isCorrect) { btn.classList.remove('revealed'); btn.classList.add('correct'); }
  }

  if (isCorrect) {
    fq.score++;
    state.totalCorrect++;
  } else {
    fq.missed.push({ q, chosen });
  }
  state.totalAnswered++;
  saveState();

  document.getElementById('fqRationale').innerHTML = formatRationale(q.rationale);
  document.getElementById('fqRationale').style.display = 'block';
  document.getElementById('fqNav').style.display = 'flex';
  document.getElementById('fqFeedback').innerHTML = isCorrect
    ? '<span style="color:var(--green)">✓ Correct!</span>'
    : `<span style="color:var(--red)">✗ Incorrect</span>`;
}

function nextFullQuizQ() {
  const fq = state.fullQuiz;
  fq.currentIndex++;
  if (fq.currentIndex >= fq.questions.length) {
    showQuizResults();
  } else {
    renderFullQuizQuestion();
  }
}

function endQuizEarly() {
  showQuizResults();
}

function showQuizResults() {
  const fq = state.fullQuiz;
  const score = fq.score;
  const total = fq.currentIndex;
  const pct = total > 0 ? Math.round(score/total*100) : 0;
  const grade = pct >= 80 ? '🏆 Excellent!' : pct >= 70 ? '👍 Good job!' : pct >= 60 ? '📚 Keep studying' : '💪 More practice needed';
  const gradeColor = pct >= 80 ? 'var(--green)' : pct >= 70 ? 'var(--teal)' : pct >= 60 ? 'var(--gold)' : 'var(--red)';

  let missedHtml = fq.missed.length > 0 ? `
    <div style="margin-top:32px;">
      <h3 style="font-size:16px;font-weight:800;color:var(--navy);margin-bottom:16px;">Review Missed Questions (${fq.missed.length})</h3>
      <div class="missed-list">
        ${fq.missed.map(({q,chosen}) => `<div class="missed-item">
          <div class="mi-q">${q.q}</div>
          <div class="mi-your">✗ Your answer: ${q.a[chosen]}</div>
          <div class="mi-correct">✓ Correct: ${q.a[q.correct]}</div>
          <div class="mi-rat">${(q.rationale||'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/---+/g,'')}</div>
        </div>`).join('')}
      </div>
    </div>` : `<div style="text-align:center;margin-top:24px;padding:24px;background:#dcfce7;border-radius:var(--radius-sm);"><strong style="color:var(--green)">🌟 Perfect score! No missed questions!</strong></div>`;

  document.getElementById('quizActiveArea').style.display = 'none';
  document.getElementById('quizResultsArea').style.display = 'block';
  document.getElementById('quizResultsArea').innerHTML = `
    <div class="results-card fade-in">
      <div class="results-header">
        <div class="results-score" style="color:${gradeColor}">${pct}%</div>
        <div class="results-label">${score} correct out of ${total} questions</div>
        <div style="font-size:18px;font-weight:700;color:${gradeColor};margin-top:8px;">${grade}</div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
        <button class="btn-primary" onclick="startFullQuiz()">🔄 Retry Quiz</button>
        <button class="btn-secondary" onclick="document.getElementById('quizSetupArea').style.display='block';document.getElementById('quizResultsArea').style.display='none';">⚙️ New Quiz Setup</button>
      </div>
      ${missedHtml}
    </div>`;
}

// ===== PROGRESS TAB =====
function renderProgress() {
  const courses = ['D118','D119','D120'];
  const courseNames = { D118: 'Adult Primary Care', D119: 'Pediatric Primary Care', D120: 'Special Populations' };
  let html = '';

  // Overall stats
  const pct = state.totalAnswered > 0 ? Math.round(state.totalCorrect/state.totalAnswered*100) : 0;
  html += `<div class="progress-card" style="grid-column:1/-1;">
    <h3>📊 Overall Performance</h3>
    <div class="stat-big-row">
      <div class="stat-big"><div class="num">${state.totalAnswered}</div><div class="lbl">Questions Answered</div></div>
      <div class="stat-big"><div class="num">${pct}%</div><div class="lbl">Overall Accuracy</div></div>
    </div>
  </div>`;

  // Streak
  html += `<div class="progress-card">
    <h3>🔥 Study Streak</h3>
    <div class="streak-display">
      <div class="streak-num">${state.streakDays}</div>
      <div class="streak-label">Days in a Row</div>
    </div>
  </div>`;

  // Course completion
  html += `<div class="progress-card">
    <h3>📚 Course Completion</h3>`;
  courses.forEach(c => {
    const topics = getTopicsForCourse(c);
    const completed = topics.filter(([t]) => state.completedTopics.has(`${c}::${t}`)).length;
    const pct = topics.length > 0 ? Math.round(completed/topics.length*100) : 0;
    const colors = { D118: 'navy', D119: 'teal', D120: 'gold' };
    html += `<div class="progress-bar-row">
      <div class="progress-bar-label"><span><strong>${c}</strong> — ${courseNames[c]}</span><span>${completed}/${topics.length} (${pct}%)</span></div>
      <div class="pbar"><div class="pbar-fill ${colors[c]}" style="width:${pct}%"></div></div>
    </div>`;
  });
  html += `</div>`;

  // Weak areas
  html += `<div class="progress-card">
    <h3>⚠️ Focus Areas</h3>
    <ul class="weak-areas-list">
      <li><span>🔴 MSK (D118)</span><span class="weak-pct">18% pass rate</span></li>
      <li><span>🔴 Endocrine (D118)</span><span class="weak-pct">20% pass rate</span></li>
      <li><span>🔴 ENT (D118)</span><span class="weak-pct">17% pass rate</span></li>
      <li><span>🟡 Pediatric MSK (D119)</span><span class="weak-pct">Needs review</span></li>
      <li><span>🟡 Substance Use (D120)</span><span class="weak-pct">Needs review</span></li>
    </ul>
    <button class="btn-gold" style="margin-top:16px;width:100%;" onclick="switchTab('quiz');quizOpts.focus='weak';">Study Weak Areas →</button>
  </div>`;

  // Question counts
  html += `<div class="progress-card">
    <h3>📋 Question Bank</h3>`;
  courses.forEach(c => {
    const count = (QUESTIONS[c]||[]).length;
    const color = { D118:'navy', D119:'teal', D120:'gold' }[c];
    html += `<div class="progress-bar-row">
      <div class="progress-bar-label"><span><strong>${c}</strong></span><span>${count} questions</span></div>
      <div class="pbar"><div class="pbar-fill ${color}" style="width:${Math.min(100,Math.round(count/3))}%"></div></div>
    </div>`;
  });
  html += `</div>`;

  document.getElementById('progressGrid').innerHTML = html;
}

// ===== INIT =====
async function init() {
  loadState();
  updateCountdown();
  setInterval(updateCountdown, 60000);

  try {
    const resp = await fetch('questions.json');
    QUESTIONS = await resp.json();
    renderSidebar();
    renderWelcome();
  } catch(e) {
    console.error('Failed to load questions:', e);
    document.getElementById('contentArea').innerHTML = `
      <div class="welcome-card">
        <div class="welcome-icon">❌</div>
        <h2 class="welcome-title">Loading Error</h2>
        <p class="welcome-sub">Could not load questions.json. Make sure the app is served from a web server.</p>
      </div>`;
  }
}

document.addEventListener('DOMContentLoaded', init);

function expandAbbreviations(text) {
  if (!text) return text;
  // Track which ones we've already expanded in this text block
  const used = new Set();
  return text.replace(/\b([A-Z][A-Z0-9\/\-]{1,9})\b/g, (match) => {
    if (ABBR[match] && !used.has(match)) {
      used.add(match);
      return `${match} <span style="color:var(--text-light);font-size:0.88em;">(${ABBR[match]})</span>`;
    }
    return match;
  });
}
